    <script>
        const uploadArea = document.getElementById('uploadArea');
        const audioInput = document.getElementById('audioInput');
        const audioMeta = document.getElementById('audioMeta');
        const fileName = document.getElementById('fileName');
        const durationInfo = document.getElementById('durationInfo');
        const settingsBox = document.getElementById('settingsBox');
        const pitchButtons = document.querySelectorAll('.pitch-btn');
        const pitchSlider = document.getElementById('pitchSlider');
        const pitchDisplay = document.getElementById('pitchDisplay');
        const keepDurationCheck = document.getElementById('keepDurationCheck');
        const outputFormat = document.getElementById('outputFormat');
        const previewBox = document.getElementById('previewBox');
        const playPreviewBtn = document.getElementById('playPreviewBtn');
        const stopPreviewBtn = document.getElementById('stopPreviewBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const resultAudio = document.getElementById('resultAudio');

        let audioFile = null;
        let originalBuffer = null;
        let currentSemitones = 0;
        let exportedBlobUrl = null;
        let isProcessing = false;
        let previewSourceNode = null;
        let previewAudioCtx = null;

        uploadArea.onclick = () => audioInput.click();
        setupDragDrop(uploadArea, (files) => {
            const f = files[0];
            if (f && (f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/i.test(f.name))) {
                handleAudio(f);
            } else {
                showToast('请上传有效的音频文件');
            }
        });

        audioInput.onchange = (e) => {
            if (e.target.files[0]) handleAudio(e.target.files[0]);
        };

        async function handleAudio(file) {
            audioFile = file;
            fileName.textContent = `文件：${file.name} (${formatSize(file.size)})`;
            audioMeta.style.display = 'block';
            stopPreview();

            if (exportedBlobUrl) {
                URL.revokeObjectURL(exportedBlobUrl);
                exportedBlobUrl = null;
            }

            try {
                showToast('正在解析音频文件...');
                const arrayBuffer = await file.arrayBuffer();
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                originalBuffer = await actx.decodeAudioData(arrayBuffer);
                actx.close();

                const d = originalBuffer.duration;
                const m = Math.floor(d / 60);
                const s = Math.floor(d % 60);
                durationInfo.textContent = `音频时长：${m}分${s}秒 (${d.toFixed(1)}s) | 采样率：${originalBuffer.sampleRate}Hz | 声道：${originalBuffer.numberOfChannels}`;

                previewBox.style.display = 'block';
                settingsBox.style.display = 'block';
                startBtn.style.display = 'inline-block';
                resultBox.style.display = 'none';
                downloadBtn.style.display = 'none';
                updatePitchDisplay();
            } catch (err) {
                console.error(err);
                showToast('音频解析失败，请检查文件格式');
            }
        }

        pitchButtons.forEach(btn => {
            btn.onclick = () => {
                pitchButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSemitones = parseFloat(btn.dataset.semitones);
                pitchSlider.value = currentSemitones;
                updatePitchDisplay();
                restartPreviewIfPlaying();
            };
        });

        pitchSlider.oninput = () => {
            currentSemitones = parseFloat(pitchSlider.value);
            pitchButtons.forEach(b => {
                b.classList.toggle('active', parseFloat(b.dataset.semitones) === currentSemitones);
            });
            updatePitchDisplay();
            restartPreviewIfPlaying();
        };

        function updatePitchDisplay() {
            const prefix = currentSemitones > 0 ? '+' : '';
            pitchDisplay.textContent = `${prefix}${currentSemitones} 半音`;
        }

        function stopPreview() {
            if (previewSourceNode) {
                try { previewSourceNode.stop(); } catch (e) {}
                previewSourceNode = null;
            }
            if (previewAudioCtx) {
                try { previewAudioCtx.close(); } catch (e) {}
                previewAudioCtx = null;
            }
            playPreviewBtn.style.display = 'inline-block';
            stopPreviewBtn.style.display = 'none';
        }

        function restartPreviewIfPlaying() {
            if (previewSourceNode) {
                playPreview();
            }
        }

        async function playPreview() {
            if (!originalBuffer) return;
            stopPreview();

            previewAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const pitchFactor = Math.pow(2, currentSemitones / 12);

            if (!keepDurationCheck.checked) {
                // 直接通过调频率播放变调
                previewSourceNode = previewAudioCtx.createBufferSource();
                previewSourceNode.buffer = originalBuffer;
                previewSourceNode.playbackRate.value = pitchFactor;
                previewSourceNode.connect(previewAudioCtx.destination);
                previewSourceNode.onended = () => stopPreview();
                previewSourceNode.start();
            } else {
                // 变调保时长预览（快速预览前 15 秒或完整音频）
                playPreviewBtn.textContent = '试听准备中...';
                const previewBuffer = sliceAudioBuffer(originalBuffer, 0, Math.min(15, originalBuffer.duration));
                const stretchedBuffer = await pitchShiftBuffer(previewBuffer, currentSemitones, () => {});
                
                previewSourceNode = previewAudioCtx.createBufferSource();
                previewSourceNode.buffer = stretchedBuffer;
                previewSourceNode.connect(previewAudioCtx.destination);
                previewSourceNode.onended = () => stopPreview();
                previewSourceNode.start();
                playPreviewBtn.textContent = '▶ 试听当前变调效果';
            }

            playPreviewBtn.style.display = 'none';
            stopPreviewBtn.style.display = 'inline-block';
        }

        playPreviewBtn.onclick = playPreview;
        stopPreviewBtn.onclick = stopPreview;

        function sliceAudioBuffer(buffer, startSec, endSec) {
            const sr = buffer.sampleRate;
            const startOffset = Math.floor(startSec * sr);
            const endOffset = Math.min(buffer.length, Math.floor(endSec * sr));
            const newLength = endOffset - startOffset;
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const out = actx.createBuffer(buffer.numberOfChannels, newLength, sr);
            actx.close();
            for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
                out.copyToChannel(buffer.getChannelData(ch).subarray(startOffset, endOffset), ch);
            }
            return out;
        }

        startBtn.onclick = async () => {
            if (!originalBuffer || isProcessing) return;
            isProcessing = true;
            stopPreview();

            startBtn.disabled = true;
            startBtn.textContent = '变调处理中...';
            progressBar.style.display = 'block';
            statusText.style.display = 'block';
            progressFill.style.width = '10%';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                const semitones = currentSemitones;
                const keepDuration = keepDurationCheck.checked;
                let finalBuffer;

                if (Math.abs(semitones) < 0.01) {
                    finalBuffer = originalBuffer;
                } else if (!keepDuration) {
                    // 仅改变重采样率
                    const pitchFactor = Math.pow(2, semitones / 12);
                    finalBuffer = resamplePitch(originalBuffer, pitchFactor);
                } else {
                    // 音调移位同时保持原始时长 (Pitch Shift with constant duration)
                    statusText.textContent = '正在进行音高转换处理...';
                    finalBuffer = await pitchShiftBuffer(originalBuffer, semitones, (p) => {
                        progressFill.style.width = `${15 + p * 65}%`;
                    });
                }

                progressFill.style.width = '85%';
                statusText.textContent = '正在编码音频...';

                let blob;
                const fmt = outputFormat.value;
                if (fmt === 'wav') {
                    blob = audioBufferToWavBlob(finalBuffer);
                } else {
                    blob = encodeMP3(finalBuffer);
                }

                progressFill.style.width = '100%';
                statusText.textContent = '变调导出完成！';

                if (exportedBlobUrl) URL.revokeObjectURL(exportedBlobUrl);
                exportedBlobUrl = URL.createObjectURL(blob);

                resultAudio.src = exportedBlobUrl;
                const prefix = semitones > 0 ? '+' : '';
                sizeInfo.innerHTML = `原始音频：${formatSize(audioFile.size)} (${originalBuffer.duration.toFixed(1)}s)<br>变调音频：<span class="highlight">${formatSize(blob.size)}</span> (${finalBuffer.duration.toFixed(1)}s)<br>变调参数：<span class="highlight">${prefix}${semitones} 半音</span> (保时长：${keepDuration ? '是' : '否'})`;
                resultBox.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                showToast('音频变调处理成功！');

            } catch (err) {
                console.error(err);
                statusText.textContent = '处理失败：' + (err.message || '未知错误');
                showToast('变调失败：' + err.message);
            } finally {
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.textContent = '开始变调导出';
            }
        };

        // 仅重采样变调（伴随时长变化）
        function resamplePitch(buffer, factor) {
            const numChannels = buffer.numberOfChannels;
            const origLen = buffer.length;
            const newLen = Math.floor(origLen / factor);
            const sampleRate = buffer.sampleRate;

            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const outBuffer = actx.createBuffer(numChannels, newLen, sampleRate);
            actx.close();

            for (let ch = 0; ch < numChannels; ch++) {
                const src = buffer.getChannelData(ch);
                const dst = outBuffer.getChannelData(ch);
                for (let i = 0; i < newLen; i++) {
                    const srcPos = i * factor;
                    const i0 = Math.floor(srcPos);
                    const i1 = Math.min(i0 + 1, origLen - 1);
                    const frac = srcPos - i0;
                    dst[i] = src[i0] * (1 - frac) + src[i1] * frac;
                }
            }
            return outBuffer;
        }

        // 音调移位核心算法：变调同时保持原时长 (通过 SOLA 时间拉伸配合重采样插值)
        async function pitchShiftBuffer(buffer, semitones, onProgress) {
            const pitchFactor = Math.pow(2, semitones / 12);
            // 1. 先进行时间拉伸 (拉伸因子为 pitchFactor，此时变长或变短)
            const stretchedBuffer = await solaTimeStretch(buffer, pitchFactor, onProgress);
            // 2. 然后以 1/pitchFactor 重新采样，使速度变回原样，而音调提升/降低 pitchFactor
            return resamplePitch(stretchedBuffer, pitchFactor);
        }

        async function solaTimeStretch(buffer, speed, onProgress) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const origLen = buffer.length;

            const winSize = Math.floor(sampleRate * 0.04);
            const synHop = Math.floor(winSize / 2);
            const anaHop = Math.floor(synHop * speed);

            const targetLen = Math.floor(origLen / speed);
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const outBuffer = actx.createBuffer(numChannels, targetLen, sampleRate);
            actx.close();

            const maxSearch = Math.floor(sampleRate * 0.015);
            const outChannels = [];
            const srcChannels = [];
            for (let ch = 0; ch < numChannels; ch++) {
                outChannels.push(outBuffer.getChannelData(ch));
                srcChannels.push(buffer.getChannelData(ch));
            }

            const totalSteps = Math.floor((origLen - winSize - maxSearch) / anaHop);
            let anaPos = 0;
            let synPos = 0;

            for (let step = 0; step < totalSteps; step++) {
                if (step % 35 === 0) {
                    onProgress(step / totalSteps);
                    await new Promise(r => setTimeout(r, 0));
                }

                let bestOffset = 0;
                if (synPos > 0 && anaPos > 0) {
                    let maxCorr = -Infinity;
                    const ref = srcChannels[0];
                    for (let delta = -maxSearch; delta <= maxSearch; delta++) {
                        const testPos = anaPos + delta;
                        if (testPos < 0 || testPos + winSize >= origLen) continue;
                        let corr = 0;
                        for (let k = 0; k < synHop; k += 2) {
                            corr += ref[testPos + k] * outChannels[0][synPos + k];
                        }
                        if (corr > maxCorr) {
                            maxCorr = corr;
                            bestOffset = delta;
                        }
                    }
                }

                const actualAnaPos = anaPos + bestOffset;

                for (let ch = 0; ch < numChannels; ch++) {
                    const src = srcChannels[ch];
                    const dst = outChannels[ch];
                    for (let i = 0; i < winSize; i++) {
                        if (synPos + i >= targetLen) break;
                        const sVal = actualAnaPos + i < origLen ? src[actualAnaPos + i] : 0;
                        if (i < synHop && synPos > 0) {
                            const w = i / synHop;
                            dst[synPos + i] = dst[synPos + i] * (1 - w) + sVal * w;
                        } else {
                            dst[synPos + i] = sVal;
                        }
                    }
                }

                anaPos += anaHop;
                synPos += synHop;
                if (synPos >= targetLen) break;
            }

            return outBuffer;
        }

        function audioBufferToWavBlob(buffer) {
            const numChannels = buffer.numberOfChannels;
            const length = buffer.length;
            const sampleRate = buffer.sampleRate;
            const bitsPerSample = 16;
            const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
            const blockAlign = (numChannels * bitsPerSample) / 8;
            const dataSize = (length * numChannels * bitsPerSample) / 8;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;
            const arrayBuffer = new ArrayBuffer(totalSize);
            const view = new DataView(arrayBuffer);

            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            }

            writeString(0, 'RIFF');
            view.setUint32(4, totalSize - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function encodeMP3(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length;

            const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
            const mp3Data = [];
            const blockSize = 1152;

            const left = new Int16Array(length);
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, buffer.getChannelData(0)[i]));
                left[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }

            if (numChannels === 1) {
                for (let i = 0; i < length; i += blockSize) {
                    const chunk = left.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            } else {
                const right = new Int16Array(length);
                for (let i = 0; i < length; i++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(1)[i]));
                    right[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                }
                for (let i = 0; i < length; i += blockSize) {
                    const chunkL = left.subarray(i, i + blockSize);
                    const chunkR = right.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunkL, chunkR);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            }

            const finalBuf = mp3encoder.flush();
            if (finalBuf.length > 0) mp3Data.push(finalBuf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        downloadBtn.onclick = () => {
            if (!exportedBlobUrl) return;
            const a = document.createElement('a');
            a.href = exportedBlobUrl;
            const ext = outputFormat.value;
            const prefix = currentSemitones > 0 ? `+${currentSemitones}` : `${currentSemitones}`;
            a.download = (audioFile?.name || 'audio').replace(/\.\w+$/, '') + `-变调${prefix}半音.` + ext;
            a.click();
        };
    </script>
</body>
</html>
