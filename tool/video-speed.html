<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频变速</title>
    <link rel="icon" type="image/png" href="../favicon.png">

    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="视频变速 | PC-TOOL">
    <meta property="og:description" content="免费在线工具集合——视频变速、图片转换、视频压缩、音频转格式……每一个功能都为效率而生，完全免费，为人民服务！">
    <meta property="og:image" content="https://www.pc-tool.cn/avatar.jpg">
    <meta property="og:url" content="https://www.pc-tool.cn/tool/video-speed.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PC-TOOL">
    <meta property="og:locale" content="zh_CN">
    <style>
        .container {
            max-width: 780px;
        }
        #videoInput { display: none; }

        .speed-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 16px 0;
        }

        .speed-btn {
            padding: 7px 15px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #d4d4d8;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .speed-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .speed-btn.active {
            background: rgba(129, 140, 248, 0.25);
            border-color: rgba(129, 140, 248, 0.6);
            color: #c4b5fd;
            font-weight: bold;
        }

        .slider-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .slider-row label {
            color: #a1a1aa;
            font-size: 14px;
            white-space: nowrap;
        }

        .slider-row input[type="range"] {
            flex: 1;
        }

        .speed-val-display {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            min-width: 60px;
            text-align: right;
        }

        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            color: #a1a1aa;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .options-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .preview-box {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .preview-box video {
            max-width: 100%;
            max-height: 380px;
            border-radius: 8px;
            background: #000;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin: 15px 0 6px;
            display: none;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #34d399);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s;
        }

        .status-text {
            font-size: 13px;
            color: #a1a1aa;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>视频变速</h1>
        <p>调整视频播放速率，支持多档快慢放、音频同步变速，零插件纯浏览器处理</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传视频文件</p>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div id="videoMeta" style="text-align:center; margin:10px 0; display:none;">
            <p id="fileName" style="color:#e4e4e7; font-size:14px;"></p>
            <p id="durationInfo" style="color:#71717a; font-size:13px;"></p>
        </div>

        <div id="settingsBox" style="display:none;">
            <div class="speed-presets">
                <button class="speed-btn" data-speed="0.25">0.25x (极慢)</button>
                <button class="speed-btn" data-speed="0.5">0.5x (慢放)</button>
                <button class="speed-btn" data-speed="0.75">0.75x</button>
                <button class="speed-btn active" data-speed="1.0">1.0x (原速)</button>
                <button class="speed-btn" data-speed="1.25">1.25x</button>
                <button class="speed-btn" data-speed="1.5">1.5x (推荐)</button>
                <button class="speed-btn" data-speed="2.0">2.0x (双倍速)</button>
                <button class="speed-btn" data-speed="3.0">3.0x</button>
                <button class="speed-btn" data-speed="4.0">4.0x (极速)</button>
            </div>

            <div class="slider-box">
                <div class="slider-row">
                    <label>倍速调节:</label>
                    <input type="range" id="speedSlider" min="0.25" max="4.0" step="0.05" value="1.0">
                    <span class="speed-val-display" id="speedDisplay">1.00x</span>
                </div>
                <div class="options-row">
                    <label>
                        <input type="checkbox" id="keepPitchCheck" checked> 保持音频音调 (防止变声)
                    </label>
                    <label>
                        <input type="checkbox" id="muteAudioCheck"> 导出为静音视频
                    </label>
                    <span id="targetDurationTip" style="color:#71717a;">预计变速后时长：-</span>
                </div>
            </div>

            <div class="preview-box" id="previewBox">
                <video id="previewVideo" controls playsinline></video>
                <div style="font-size:12px; color:#71717a; margin-top:4px;">上图支持实时播放预览变速效果</div>
            </div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">处理中...</div>

        <div style="text-align:center; margin-top:16px;">
            <button class="convert-btn" id="startBtn" style="display:none;">导出变速视频</button>
            <button class="download-btn" id="downloadBtn">下载变速视频</button>
        </div>

        <div class="result-box" id="resultBox">
            <h3>变速导出完成</h3>
            <div class="size-info" id="sizeInfo"></div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script src="common.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const videoMeta = document.getElementById('videoMeta');
        const fileName = document.getElementById('fileName');
        const durationInfo = document.getElementById('durationInfo');
        const settingsBox = document.getElementById('settingsBox');
        const speedButtons = document.querySelectorAll('.speed-btn');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const keepPitchCheck = document.getElementById('keepPitchCheck');
        const muteAudioCheck = document.getElementById('muteAudioCheck');
        const targetDurationTip = document.getElementById('targetDurationTip');
        const previewBox = document.getElementById('previewBox');
        const previewVideo = document.getElementById('previewVideo');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hCtx = hiddenCanvas.getContext('2d');

        let videoFile = null;
        let originalDuration = 0;
        let currentSpeed = 1.0;
        let exportedBlobUrl = null;
        let isProcessing = false;

        uploadArea.onclick = () => videoInput.click();
        setupDragDrop(uploadArea, (files) => {
            if (files[0]?.type.startsWith('video/')) handleVideo(files[0]);
            else showToast('请上传有效的视频文件');
        });
        videoInput.onchange = (e) => {
            if (e.target.files[0]) handleVideo(e.target.files[0]);
        };

        function handleVideo(file) {
            videoFile = file;
            fileName.textContent = `文件：${file.name} (${formatSize(file.size)})`;
            videoMeta.style.display = 'block';

            if (previewVideo.src) URL.revokeObjectURL(previewVideo.src);
            previewVideo.src = URL.createObjectURL(file);
            previewBox.style.display = 'block';
            settingsBox.style.display = 'block';
            startBtn.style.display = 'inline-block';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            previewVideo.onloadedmetadata = () => {
                originalDuration = previewVideo.duration;
                const m = Math.floor(originalDuration / 60);
                const s = Math.floor(originalDuration % 60);
                durationInfo.textContent = `原视频时长：${m}分${s}秒 (${originalDuration.toFixed(1)}s) | 分辨率：${previewVideo.videoWidth}×${previewVideo.videoHeight}`;
                updateSpeedDisplay();
            };
        }

        speedButtons.forEach(btn => {
            btn.onclick = () => {
                speedButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSpeed = parseFloat(btn.dataset.speed);
                speedSlider.value = currentSpeed;
                updateSpeedDisplay();
            };
        });

        speedSlider.oninput = () => {
            currentSpeed = parseFloat(speedSlider.value);
            speedButtons.forEach(b => {
                b.classList.toggle('active', parseFloat(b.dataset.speed) === currentSpeed);
            });
            updateSpeedDisplay();
        };

        keepPitchCheck.onchange = () => {
            previewVideo.preservesPitch = keepPitchCheck.checked;
        };

        function updateSpeedDisplay() {
            speedDisplay.textContent = currentSpeed.toFixed(2) + 'x';
            previewVideo.playbackRate = currentSpeed;
            previewVideo.preservesPitch = keepPitchCheck.checked;

            if (originalDuration > 0) {
                const targetSec = originalDuration / currentSpeed;
                const m = Math.floor(targetSec / 60);
                const s = Math.floor(targetSec % 60);
                targetDurationTip.textContent = `预计变速后时长：约 ${m}分${s}秒 (${targetSec.toFixed(1)}s)`;
            }
        }

        startBtn.onclick = async () => {
            if (!videoFile || isProcessing) return;
            isProcessing = true;

            startBtn.disabled = true;
            startBtn.textContent = '变速处理中...';
            progressBar.style.display = 'block';
            statusText.style.display = 'block';
            progressFill.style.width = '0%';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                const speed = currentSpeed;
                const muteAudio = muteAudioCheck.checked;

                const offVideo = document.createElement('video');
                offVideo.src = URL.createObjectURL(videoFile);
                offVideo.muted = true;
                offVideo.playsInline = true;
                offVideo.preload = 'auto';

                await new Promise((resolve, reject) => {
                    offVideo.onloadedmetadata = resolve;
                    offVideo.onerror = reject;
                });

                const vw = offVideo.videoWidth || 1280;
                const vh = offVideo.videoHeight || 720;
                const duration = offVideo.duration;
                const newDuration = duration / speed;

                hiddenCanvas.width = vw;
                hiddenCanvas.height = vh;

                const fps = 30;
                const canvasStream = hiddenCanvas.captureStream(fps);
                let finalStream = canvasStream;
                let audioCtx = null;

                if (!muteAudio) {
                    try {
                        statusText.textContent = '处理音频变速...';
                        const ab = await videoFile.arrayBuffer();
                        const actx = new (window.AudioContext || window.webkitAudioContext)();
                        audioCtx = actx;
                        const decodedBuf = await actx.decodeAudioData(ab);

                        const dest = actx.createMediaStreamDestination();
                        const source = actx.createBufferSource();
                        source.buffer = decodedBuf;
                        source.playbackRate.value = speed;
                        source.connect(dest);
                        source.start(0);

                        const aTracks = dest.stream.getAudioTracks();
                        if (aTracks.length > 0) {
                            finalStream = new MediaStream([
                                ...canvasStream.getVideoTracks(),
                                aTracks[0]
                            ]);
                        }
                    } catch (e) {
                        console.warn('音频解析变速跳过，输出静音视频：', e);
                    }
                }

                let mimeType = 'video/webm;codecs=vp8';
                if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
                    mimeType = 'video/mp4;codecs=avc1';
                } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
                    mimeType = 'video/webm;codecs=vp9';
                } else if (MediaRecorder.isTypeSupported('video/webm')) {
                    mimeType = 'video/webm';
                }

                const recorder = new MediaRecorder(finalStream, mimeType ? { mimeType } : {});
                const chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                const recorderStop = new Promise(resolve => recorder.onstop = resolve);

                offVideo.playbackRate = speed;
                recorder.start();
                await offVideo.play();

                await new Promise((resolve) => {
                    function renderFrame() {
                        if (offVideo.paused || offVideo.ended) {
                            resolve();
                            return;
                        }
                        hCtx.drawImage(offVideo, 0, 0, vw, vh);

                        const pct = Math.min(99, Math.round((offVideo.currentTime / duration) * 100));
                        progressFill.style.width = pct + '%';
                        statusText.textContent = `正在按 ${speed.toFixed(2)}x 编码: ${pct}% (变速后约 ${newDuration.toFixed(1)}s)`;

                        requestAnimationFrame(renderFrame);
                    }
                    offVideo.onended = resolve;
                    renderFrame();
                });

                progressFill.style.width = '100%';
                statusText.textContent = '封装视频中...';

                setTimeout(() => {
                    if (recorder.state === 'recording') recorder.stop();
                    if (audioCtx) audioCtx.close();
                }, 100);

                await recorderStop;

                const finalBlob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
                if (exportedBlobUrl) URL.revokeObjectURL(exportedBlobUrl);
                exportedBlobUrl = URL.createObjectURL(finalBlob);

                sizeInfo.innerHTML = `原视频大小：${formatSize(videoFile.size)} (${duration.toFixed(1)}s)<br>` +
                                     `变速后大小：<span class="highlight">${formatSize(finalBlob.size)}</span><br>` +
                                     `实际变速倍率：<span class="highlight">${speed.toFixed(2)}x</span><br>` +
                                     `变速后时长：<span class="highlight">${newDuration.toFixed(1)}s</span>`;

                resultBox.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                statusText.textContent = '变速处理完成！';
                showToast('视频变速成功！');
            } catch (err) {
                console.error(err);
                statusText.textContent = '处理出错：' + err.message;
                showToast('变速失败：' + err.message);
            } finally {
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.textContent = '导出变速视频';
            }
        };

        downloadBtn.onclick = () => {
            if (!exportedBlobUrl) return;
            const ext = exportedBlobUrl.includes('mp4') ? 'mp4' : 'webm';
            const base = (videoFile?.name || 'video').replace(/\.\w+$/, '');
            downloadFile(exportedBlobUrl, `${base}_${currentSpeed.toFixed(2)}x.${ext}`);
        };
    </script>
</body>
</html>
