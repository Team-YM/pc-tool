<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>文本清理与排序 | PC-TOOL</title><link rel="stylesheet" href="common.css"><style>
.container{max-width:900px}.container h1{margin-bottom:8px}.container>p{margin-bottom:18px}.editor{width:100%;height:220px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e4e4e7;font:14px/1.6 Consolas,monospace;resize:vertical;outline:none}.options{display:flex;flex-wrap:wrap;gap:14px;text-align:left;margin:16px 0;color:#d4d4d8;font-size:14px}.options label{display:flex;align-items:center;gap:5px}.number{width:80px;padding:5px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.actions .btn{margin:0}.label{display:flex;justify-content:space-between;color:#a1a1aa;font-size:13px;margin:8px 0}.stat{color:#a1a1aa;font-size:13px;margin-top:8px}
</style></head><body><canvas id="bg-canvas" class="bg-canvas"></canvas><a class="back-link" href="../index.html">← 返回首页</a><div class="container"><h1>文本清理与排序</h1><p>组合使用去重、排序、去空行和行号功能，处理结果完全在本地生成。</p><div class="label"><span>输入多行文本</span><span id="inStat">0 行</span></div><textarea id="input" class="editor" placeholder="每行一条内容..."></textarea><div class="options"><label><input type="checkbox" id="dedupe"> 去重</label><label><input type="checkbox" id="ignore"> 忽略大小写去重</label><label><input type="checkbox" id="empty"> 去除空行</label><label><input type="checkbox" id="sort"> 排序</label><select id="sortType" class="number"><option value="natural">自然</option><option value="dict">字典</option></select><select id="order" class="number"><option value="asc">升序</option><option value="desc">降序</option></select><label><input type="checkbox" id="number"> 添加行号</label><label>起始 <input id="start" class="number" type="number" value="1"></label><label>分隔符 <input id="sep" class="number" style="width:55px" value=". "></label></div><div class="actions"><button class="btn" id="run">处理文本</button><button class="btn" id="sample">示例</button><button class="btn" id="clear">清空</button><button class="btn" id="copy">复制结果</button><button class="btn" id="download">下载结果</button></div><div class="label"><span>处理结果</span></div><textarea id="output" class="editor" readonly></textarea><div class="stat" id="stat">等待处理</div></div><script src="common.js"></script><script>
(function(){var $=function(id){return document.getElementById(id)},input=$('input'),output=$('output');function natural(a,b){return a.localeCompare(b,'zh-CN',{numeric:true,sensitivity:'base'})}function run(){var lines=input.value.replace(/\r\n?/g,'\n').split('\n');var before=lines.length;if($('empty').checked)lines=lines.filter(function(x){return x.trim()});if($('dedupe').checked){var seen=Object.create(null);lines=lines.filter(function(x){var k=$('ignore').checked?x.toLocaleLowerCase():x;if(seen[k])return false;seen[k]=true;return true})}if($('sort').checked){lines.sort($('sortType').value==='natural'?natural:function(a,b){return a.localeCompare(b,'zh-CN')});if($('order').value==='desc')lines.reverse()}if($('number').checked){var n=Number($('start').value)||1,sep=$('sep').value;lines=lines.map(function(x,i){return n+i+sep+x})}output.value=lines.join('\n');$('stat').textContent='原始 '+before+' 行 · 结果 '+lines.length+' 行 · '+output.value.length+' 字符'}input.addEventListener('input',function(){$('inStat').textContent=(input.value?input.value.split(/\r\n?|\n/).length:0)+' 行'});$('run').onclick=run;$('sample').onclick=function(){input.value='Banana\napple\n\nbanana\nitem 10\nitem 2';input.dispatchEvent(new Event('input'));run()};$('clear').onclick=function(){input.value='';output.value='';$('stat').textContent='等待处理';input.dispatchEvent(new Event('input'))};$('copy').onclick=function(){navigator.clipboard.writeText(output.value).then(function(){showToast('结果已复制')})};$('download').onclick=function(){var blob=new Blob([output.value],{type:'text/plain;charset=utf-8'});downloadFile(URL.createObjectURL(blob),'cleaned-text.txt')};input.dispatchEvent(new Event('input'))})();
</script></body></html>
