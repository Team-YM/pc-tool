<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Defect Tester</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="Self-service dead pixel test — run full-screen solid colors to spot black dots, bright dots, dark dots and dead pixels. Click to switch colors, press ESC to exit.">
    <link rel="stylesheet" href="common.css">
    <style>
        .container h1 {
            color: #e4e4e7;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
        }

        .container > p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .test-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .start-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 16px 42px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #34d399, #10b981);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .notice-esc {
            margin-top: 18px;
            color: #71717a;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .esc-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 5px;
            color: #e4e4e7;
            font-size: 12px;
            font-weight: 600;
            font-family: monospace;
        }

        /* Color preview dots */
        .color-previews {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Fullscreen test overlay */
        #fullscreenTester {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 999999;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top floating tip bubble (shown for the first two seconds, then fades out) */
        .tester-tip {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: opacity 0.8s ease;
            white-space: nowrap;
            text-align: center;
        }

        /* Mobile long-press progress ring animation */
        .touch-progress-circle {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #34d399;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            animation: spin 0.8s linear infinite;
            z-index: 1000000;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← Back</a>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <div class="container">
        <h1>Dead Pixel Test</h1>
        <p>Enter a full-screen solid color background to visually check your display for bright dots, dark dots, color shifts and dead pixels.</p>

        <div class="test-box">
            <button class="start-btn" id="startBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                Start test
            </button>
            <div class="notice-esc" id="usageNotice">
                <span>Click to switch colors during the test, press</span>
                <span class="esc-badge">ESC</span>
                <span>or right-click to exit fullscreen</span>
            </div>

            <div class="color-previews">
                <div class="color-dot" style="background: #000000;" title="Pure black"></div>
                <div class="color-dot" style="background: #ffffff;" title="Pure white"></div>
                <div class="color-dot" style="background: #ff0000;" title="Pure red"></div>
                <div class="color-dot" style="background: #00ff00;" title="Pure green"></div>
                <div class="color-dot" style="background: #0000ff;" title="Pure blue"></div>
                <div class="color-dot" style="background: #ffff00;" title="Yellow"></div>
                <div class="color-dot" style="background: #00ffff;" title="Cyan"></div>
                <div class="color-dot" style="background: #ff00ff;" title="Magenta"></div>
                <div class="color-dot" style="background: #808080;" title="50% gray"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen test container -->
    <div id="fullscreenTester">
        <div class="tester-tip" id="testerTip">Click the screen to switch colors · press ESC to exit</div>
        <div class="touch-progress-circle" id="touchCircle"></div>
    </div>

    <script src="common.js"></script>
    <script>
        const colors = [
            '#000000', // Black (finds bright dots)
            '#ffffff', // White (finds dark dots and smudges)
            '#ff0000', // Red
            '#00ff00', // Green
            '#0000ff', // Blue
            '#ffff00', // Yellow
            '#00ffff', // Cyan
            '#ff00ff', // Magenta
            '#808080'  // Gray (checks color uniformity)
        ];

        let currentIndex = 0;
        const startBtn = document.getElementById('startBtn');
        const tester = document.getElementById('fullscreenTester');
        const testerTip = document.getElementById('testerTip');
        const usageNotice = document.getElementById('usageNotice');
        const touchCircle = document.getElementById('touchCircle');
        let tipTimeout = null;

        // Detect whether the device is a mobile touchscreen
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth <= 1024);

        // Differentiate initial on-screen tips
        if (isMobileDevice) {
            usageNotice.innerHTML = '<span>Tap the screen to switch colors · </span><span class="esc-badge" style="background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.4); color:#fca5a5;">long-press 3 s</span><span> to exit the test</span>';
            testerTip.textContent = 'Tap to change color · long-press 3 s to exit';
        }

        function updateColor() {
            tester.style.backgroundColor = colors[currentIndex];
        }

        function enterTest() {
            currentIndex = 0;
            updateColor();
            tester.style.display = 'block';
            testerTip.style.opacity = '1';

            // Fade out the top tip (keep 3.5 s on mobile so users can read it)
            clearTimeout(tipTimeout);
            tipTimeout = setTimeout(() => {
                testerTip.style.opacity = '0';
            }, isMobileDevice ? 3500 : 2500);

            // Trigger fullscreen
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) {
                el.msRequestFullscreen();
            }
        }

        function exitTest() {
            tester.style.display = 'none';
            if (touchCircle) touchCircle.style.display = 'none';
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        startBtn.addEventListener('click', enterTest);

        // Mobile long-press 3 s to exit and tap to switch colors
        let touchStartTime = 0;
        let touchStartPos = { x: 0, y: 0 };
        let longPressTimer = null;
        let isLongPressTriggered = false;

        tester.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                touchStartTime = Date.now();
                touchStartPos = { x: touch.clientX, y: touch.clientY };
                isLongPressTriggered = false;

                // Show a breathing ring at the touch position
                if (touchCircle) {
                    touchCircle.style.left = `${touch.clientX}px`;
                    touchCircle.style.top = `${touch.clientY}px`;
                    touchCircle.style.display = 'block';
                }

                // Start the 3-second timer
                clearTimeout(longPressTimer);
                longPressTimer = setTimeout(() => {
                    isLongPressTriggered = true;
                    if (touchCircle) touchCircle.style.display = 'none';
                    if (navigator.vibrate) navigator.vibrate(50); // Vibration feedback
                    exitTest();
                }, 3000);
            }
        }, { passive: false });

        tester.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const dx = Math.abs(touch.clientX - touchStartPos.x);
                const dy = Math.abs(touch.clientY - touchStartPos.y);
                // Cancel the long press if movement exceeds 15 px to avoid accidental triggers
                if (dx > 15 || dy > 15) {
                    clearTimeout(longPressTimer);
                    if (touchCircle) touchCircle.style.display = 'none';
                }
            }
        }, { passive: true });

        tester.addEventListener('touchend', (e) => {
            clearTimeout(longPressTimer);
            if (touchCircle) touchCircle.style.display = 'none';

            // Do not trigger a color switch if the long press already fired
            if (isLongPressTriggered) {
                e.preventDefault();
                return;
            }

            const touchDuration = Date.now() - touchStartTime;
            // A short tap (under 400 ms) counts as a color switch
            if (touchDuration < 400) {
                currentIndex = (currentIndex + 1) % colors.length;
                updateColor();
            }
        });

        // PC mouse click switches to the next color (mobile touch handled separately)
        tester.addEventListener('click', (e) => {
            if (isMobileDevice) return;
            currentIndex = (currentIndex + 1) % colors.length;
            updateColor();
        });

        // Watch fullscreen changes; auto-close the test layer on exit
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                tester.style.display = 'none';
                if (touchCircle) touchCircle.style.display = 'none';
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                tester.style.display = 'none';
                if (touchCircle) touchCircle.style.display = 'none';
            }
        });

        // Key listener — ESC or any exit intent
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                exitTest();
            } else if (e.key === ' ' || e.key === 'ArrowRight') {
                if (tester.style.display === 'block') {
                    currentIndex = (currentIndex + 1) % colors.length;
                    updateColor();
                }
            } else if (e.key === 'ArrowLeft') {
                if (tester.style.display === 'block') {
                    currentIndex = (currentIndex - 1 + colors.length) % colors.length;
                    updateColor();
                }
            }
        });

        // Right-click context menu exits directly on desktop
        tester.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            exitTest();
        });
    </script>
</body>
</html>
