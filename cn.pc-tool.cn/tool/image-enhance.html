<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图片变清晰 | PC-TOOL</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="使用 Real-ESRGAN AI 模型让图片变清晰，支持放大、拖动和原图对比。">
    <link rel="stylesheet" href="common.css">
    <style>
        .container { max-width: 1080px; }
        .container h1 { margin-bottom: 8px; }
        .lead { color: #a1a1aa; margin-bottom: 22px; }
        .upload-area { margin: 0 0 18px; padding: 34px 20px; }
        .upload-area strong { color: #e4e4e7; display: block; font-size: 18px; margin-bottom: 5px; }
        .status { min-height: 24px; color: #a1a1aa; text-align: center; font-size: 14px; }
        .status[data-type="error"] { color: #fb7185; }
        .status[data-type="success"] { color: #34d399; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 16px 0; }
        .controls label { color: #a1a1aa; font-size: 14px; }
        .controls select, .controls button { margin: 0; }
        .mode-switch { display: inline-flex; padding: 3px; background: #18181b; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; }
        .mode-switch button { border: 0; background: transparent; color: #a1a1aa; padding: 7px 12px; border-radius: 5px; cursor: pointer; }
        .mode-switch button.active { background: #0891b2; color: white; }
        .mode-help { width: 100%; text-align: center; color: #71717a; font-size: 12px; }
        .viewer { display: none; position: relative; overflow: hidden; min-height: 420px; height: min(62vh, 650px); background: #050506; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; cursor: grab; touch-action: none; user-select: none; }
        .viewer:active { cursor: grabbing; }
        .viewer-panes { display: flex; width: 100%; height: 100%; position: relative; }
        .viewer-pane { flex: 1; position: relative; overflow: hidden; height: 100%; }
        .viewer-pane-left { border-right: 1px solid rgba(255,255,255,.15); }
        .viewer-stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; }
        .viewer-stage canvas { display: block; }
        .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; z-index: 10; transform: translateX(-50%); }
        .divider::after { content: '对比'; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 8px; background: rgba(9,9,11,.8); border: 1px solid rgba(255,255,255,.2); border-radius: 5px; color: #fff; font-size: 12px; }
        .tag { position: absolute; top: 14px; z-index: 2; padding: 5px 9px; background: rgba(9,9,11,.75); border: 1px solid rgba(255,255,255,.12); border-radius: 5px; font-size: 12px; color: #d4d4d8; pointer-events: none; }
        .tag-before { left: 14px; } .tag-after { right: 14px; }
        .zoom { display: none; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; color: #a1a1aa; font-size: 13px; }
        .zoom button { margin: 0; padding: 6px 12px; font-size: 14px; }
        .download-btn { display: none; margin: 15px auto 0; }
        .note { margin-top: 22px; color: #71717a; text-align: center; font-size: 13px; line-height: 1.7; }
        @media (max-width: 640px) { .container { padding: 24px 16px; } .container h1 { font-size: 24px; } .viewer { min-height: 300px; height: 56vh; } .back-link { top: 10px; left: 10px; } }
    </style>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>
<a href="../index.html" class="back-link">&larr; 返回工具首页</a>
<div class="container">
    <h1>AI图片变清晰</h1>
    <p class="lead">使用 Real-ESRGAN AI 模型放大并增强图片细节，图片在浏览器本地处理。</p>
    <div class="upload-area" id="uploadArea">
        <strong>上传图片开始增强</strong>
        <span>点击或拖拽 JPG、PNG、WebP 图片</span>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="status" id="status">Canvas 模式可以直接使用</div>
    <div class="controls">
        <div class="mode-switch" role="group" aria-label="处理模式"><button type="button" id="canvasMode" class="active">Canvas 本地</button><button type="button" id="aiMode">AI 超分</button></div>
        <span class="mode-help" id="modeHelp">无需下载模型，使用浏览器 Canvas 进行锐化和放大</span>
        <div id="aiModelGroup" style="display:none; align-items:center; gap:8px;">
            <label for="aiModelSelect">AI模型</label>
            <select class="format-select" id="aiModelSelect">
                <option value="photo" selected>真实照片 (Real-ESRGAN / 细节丰富)</option>
                <option value="anime">动漫二次元 (Anime / 线条平滑)</option>
                <option value="fast">超轻量快速 (Fast / 低显存占用)</option>
            </select>
        </div>
        <label for="scaleSelect">放大倍数</label>
        <select class="format-select" id="scaleSelect"><option value="2">2x</option><option value="4" selected>4x</option></select>
        <button class="btn" id="resetBtn" style="display:none">清空图片</button>
    </div>
    <div class="viewer" id="viewer">
        <div class="viewer-panes">
            <div class="viewer-pane viewer-pane-left">
                <div class="viewer-stage" id="stageLeft">
                    <canvas id="originalCanvas"></canvas>
                </div>
            </div>
            <div class="viewer-pane viewer-pane-right">
                <div class="viewer-stage" id="stageRight">
                    <canvas id="enhancedCanvas"></canvas>
                </div>
            </div>
        </div>
        <span class="tag tag-before">原图</span><span class="tag tag-after">AI增强</span><div class="divider" id="divider"></div>
    </div>
    <div class="zoom" id="zoomControls"><button class="btn" id="zoomOut">−</button><span id="zoomValue">100%</span><button class="btn" id="zoomIn">＋</button><button class="btn" id="zoomReset">适应窗口</button></div>
    <a class="download-btn" id="downloadBtn" download="ai-enhanced.png">下载增强图片</a>
    <p class="note">对比线左边为原图，右边为增强效果。画布支持拖动查看细节，滚轮或按钮可缩放。AI 模型在浏览器本地运行，图片不上传服务器。</p>
</div>
<script src="common.js"></script>
<script>
(function () {
    var uploadArea = document.getElementById('uploadArea'), fileInput = document.getElementById('fileInput');
    var status = document.getElementById('status');
    var resetBtn = document.getElementById('resetBtn'), viewer = document.getElementById('viewer');
    var stageLeft = document.getElementById('stageLeft'), stageRight = document.getElementById('stageRight');
    var originalCanvas = document.getElementById('originalCanvas'), enhancedCanvas = document.getElementById('enhancedCanvas');
    var divider = document.getElementById('divider'), zoomControls = document.getElementById('zoomControls');
    var zoomValue = document.getElementById('zoomValue'), downloadBtn = document.getElementById('downloadBtn');
    var scaleSelect = document.getElementById('scaleSelect'), aiModelSelect = document.getElementById('aiModelSelect');
    var aiModelGroup = document.getElementById('aiModelGroup');
    var image = null, resultUrl = '', currentAiModelType = '', upscaler = null, mode = 'canvas', scale = 1, offsetX = 0, offsetY = 0, dragging = false, startX = 0, startY = 0;
    var isProcessing = false;
    var aiLoading = null;
    var canvasMode = document.getElementById('canvasMode'), aiMode = document.getElementById('aiMode'), modeHelp = document.getElementById('modeHelp');
    function loadAiRuntime() {
        if (aiLoading) return aiLoading;
        aiLoading = import('https://cdn.jsdelivr.net/npm/upscalejs@2.1.0/+esm');
        return aiLoading;
    }
    function chooseMode(nextMode) {
        if (mode === nextMode) return;
        mode = nextMode;
        canvasMode.classList.toggle('active', mode === 'canvas');
        aiMode.classList.toggle('active', mode === 'ai');
        aiModelGroup.style.display = mode === 'ai' ? 'inline-flex' : 'none';
        modeHelp.textContent = mode === 'canvas' ? '无需下载模型，使用浏览器 Canvas 进行锐化和放大' : '可选择写实人像照片、二次元动漫或轻量模型，在浏览器端完成推断';
        // 切换模式时，自动清空已上传图片及处理结果
        resetImage();
        setStatus(mode === 'canvas' ? '已切换为 Canvas 模式，请上传图片' : '已切换为 AI 超分模式，请上传图片');
    }
    canvasMode.onclick = function () { chooseMode('canvas'); };
    aiMode.onclick = function () { chooseMode('ai'); };

    function setStatus(text, type) { status.textContent = text; status.dataset.type = type || ''; }
    uploadArea.onclick = function () { fileInput.click(); };
    fileInput.onchange = function () { if (fileInput.files[0]) loadImage(fileInput.files[0]); };
    uploadArea.ondragover = function (e) { e.preventDefault(); uploadArea.style.borderColor = '#22d3ee'; };
    uploadArea.ondragleave = function () { uploadArea.style.borderColor = ''; };
    uploadArea.ondrop = function (e) { e.preventDefault(); uploadArea.style.borderColor = ''; if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); };

    function updateStageLayout() {
        if (!image) return;
        var w = image.naturalWidth;
        var h = image.naturalHeight;
        stageLeft.style.width = w + 'px';
        stageLeft.style.height = h + 'px';
        stageRight.style.width = w + 'px';
        stageRight.style.height = h + 'px';
        originalCanvas.style.width = w + 'px';
        originalCanvas.style.height = h + 'px';
        enhancedCanvas.style.width = w + 'px';
        enhancedCanvas.style.height = h + 'px';
    }

    function resetImage() {
        fileInput.value = '';
        image = null;
        resultUrl = '';
        viewer.style.display = 'none';
        zoomControls.style.display = 'none';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        originalCanvas.width = 0;
        originalCanvas.height = 0;
        enhancedCanvas.width = 0;
        enhancedCanvas.height = 0;
    }

    function loadImage(file) {
        if (!file.type.startsWith('image/')) return setStatus('请选择图片文件', 'error');
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
            image = img;
            originalCanvas.width = img.naturalWidth;
            originalCanvas.height = img.naturalHeight;
            originalCanvas.getContext('2d').drawImage(img, 0, 0);

            // 预设增强画布大小
            enhancedCanvas.width = img.naturalWidth;
            enhancedCanvas.height = img.naturalHeight;

            updateStageLayout();
            viewer.style.display = 'block';
            zoomControls.style.display = 'flex';
            resetBtn.style.display = 'inline-block';
            downloadBtn.style.display = 'none';
            fitView();
            URL.revokeObjectURL(url);

            // 上传后自动触发增强处理
            processEnhance();
        };
        img.onerror = function () { setStatus('图片读取失败', 'error'); URL.revokeObjectURL(url); };
        img.src = url;
    }

    async function processEnhance() {
        if (!image || isProcessing) return;
        isProcessing = true;
        try {
            var outputScale = Number(scaleSelect.value);
            if (mode === 'canvas') {
                setStatus('Canvas 正在自动锐化与放大图片…');
                var canvas = document.createElement('canvas'); canvas.width = image.naturalWidth * outputScale; canvas.height = image.naturalHeight * outputScale;
                var ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.filter = 'contrast(1.12) saturate(1.06)'; ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                enhancedCanvas.width = canvas.width; enhancedCanvas.height = canvas.height; enhancedCanvas.getContext('2d').drawImage(canvas, 0, 0);
                setStatus('处理完成！左侧为原图，右侧为增强画面', 'success');
            } else {
                var selectedModel = aiModelSelect ? aiModelSelect.value : 'photo';
                var modelConfig = '6B';
                var modelDesc = 'Real-ESRGAN 照片超分';
                if (selectedModel === 'anime') {
                    modelConfig = 'anime';
                    modelDesc = '二次元动漫模型';
                } else if (selectedModel === 'fast') {
                    modelConfig = 'default';
                    modelDesc = '轻量快速模型';
                }

                setStatus('正在加载 ' + modelDesc + '，首次使用请耐心等待…');
                var module = await loadAiRuntime();
                if (!upscaler || currentAiModelType !== selectedModel) {
                    var Upscaler = module.Upscaler || module.default;
                    upscaler = new Upscaler({
                        base: 'https://cdn.jsdelivr.net/npm/upscalejs@2.1.0/dist/',
                        model: modelConfig,
                        workerCount: 1
                    });
                    currentAiModelType = selectedModel;
                }
                setStatus('AI 正在增强图片细节…');
                var bitmap = await createImageBitmap(image), result = await upscaler.upscale(bitmap, { targetSize: image.naturalWidth * outputScale, forceUpscale: true });
                enhancedCanvas.width = result.width; enhancedCanvas.height = result.height; enhancedCanvas.getContext('2d').drawImage(result, 0, 0); bitmap.close(); if (result.close) result.close();
                setStatus('AI 增强完成！左侧为原图，右侧为增强画面', 'success');
            }
            updateStageLayout();
            resultUrl = enhancedCanvas.toDataURL('image/png');
            downloadBtn.href = resultUrl;
            downloadBtn.style.display = 'block';
            drawPosition();
        } catch (error) {
            setStatus(mode === 'ai' ? 'AI 模型下载或处理失败，您可以切换到 Canvas 模式使用' : 'Canvas 处理失败，请更换图片重试', 'error');
        } finally {
            isProcessing = false;
        }
    }

    scaleSelect.onchange = function () {
        if (image) {
            processEnhance();
        }
    };

    if (aiModelSelect) {
        aiModelSelect.onchange = function () {
            if (image && mode === 'ai') {
                processEnhance();
            }
        };
    }

    resetBtn.onclick = function () {
        resetImage();
        setStatus(mode === 'canvas' ? 'Canvas 模式可以直接使用' : 'AI 模式准备就绪，请上传图片');
    };

    viewer.onpointerdown = function (e) {
        dragging = true;
        startX = e.clientX - offsetX;
        startY = e.clientY - offsetY;
        viewer.setPointerCapture(e.pointerId);
    };
    viewer.onpointermove = function (e) {
        if (!dragging) return;
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawPosition();
    };
    viewer.onpointerup = viewer.onpointercancel = function () { dragging = false; };

    viewer.onwheel = function (e) {
        e.preventDefault();
        var rect = viewer.getBoundingClientRect();
        // 映射到单个视口半区内的相对坐标
        var halfWidth = rect.width / 2;
        var mouseX = (e.clientX - rect.left) % halfWidth;
        var mouseY = e.clientY - rect.top;

        var zoomFactor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
        var newScale = Math.max(0.1, Math.min(10, scale * zoomFactor));

        // 以鼠标指针为中心同步缩放左右两张图片
        offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
        offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
        scale = newScale;

        zoomValue.textContent = Math.round(scale * 100) + '%';
        drawPosition();
    };

    function setZoom(value) {
        var newScale = Math.max(0.1, Math.min(10, value));
        var paneWidth = viewer.clientWidth ? viewer.clientWidth / 2 : 400;
        var paneHeight = viewer.clientHeight || 450;
        var centerX = paneWidth / 2;
        var centerY = paneHeight / 2;
        offsetX = centerX - (centerX - offsetX) * (newScale / scale);
        offsetY = centerY - (centerY - offsetY) * (newScale / scale);
        scale = newScale;
        zoomValue.textContent = Math.round(scale * 100) + '%';
        drawPosition();
    }

    function drawPosition() {
        var transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
        stageLeft.style.transform = transform;
        stageRight.style.transform = transform;
    }

    function fitView() {
        if (!image) return;
        var paneWidth = (viewer.clientWidth || 800) / 2;
        var paneHeight = viewer.clientHeight || 450;
        var imgW = image.naturalWidth;
        var imgH = image.naturalHeight;
        var fitScale = Math.min((paneWidth - 30) / imgW, (paneHeight - 30) / imgH, 1);
        scale = Math.max(0.05, fitScale);
        offsetX = (paneWidth - imgW * scale) / 2;
        offsetY = (paneHeight - imgH * scale) / 2;
        zoomValue.textContent = Math.round(scale * 100) + '%';
        drawPosition();
    }

    document.getElementById('zoomIn').onclick = function () { setZoom(scale * 1.2); };
    document.getElementById('zoomOut').onclick = function () { setZoom(scale / 1.2); };
    document.getElementById('zoomReset').onclick = fitView;
    window.addEventListener('resize', function () { if (image) fitView(); });
})();
</script>
</body>
</html>
