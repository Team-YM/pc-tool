<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇率汇算转换器 | PC-TOOL</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="在线全球主要货币实时汇率换算器，支持人民币、美元、欧元、日元、英镑、港币等多币种精准互转与自定义汇率。">
    <link rel="stylesheet" href="common.css">
    <style>
        .container {
            max-width: 800px;
        }
        .container h1 {
            color: #e4e4e7;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        .container > p {
            color: #a1a1aa;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .calc-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .converter-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }
        @media (max-width: 620px) {
            .converter-row {
                grid-template-columns: 1fr;
            }
        }
        .currency-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 16px;
        }
        .currency-box label {
            display: block;
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }
        .input-styled {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: monospace;
            margin-bottom: 10px;
        }
        .input-styled:focus {
            border-color: rgba(129, 140, 248, 0.5);
        }
        .select-styled {
            width: 100%;
            padding: 10px 12px;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .swap-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #818cf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin: 0 auto;
        }
        .swap-btn:hover {
            background: rgba(129, 140, 248, 0.2);
            transform: rotate(180deg);
        }
        .rate-info-bar {
            padding: 12px 16px;
            background: rgba(129, 140, 248, 0.08);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 8px;
            font-size: 13px;
            color: #d4d4d8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .currency-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 14px;
        }
        .currency-table th, .currency-table td {
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 9px 12px;
            text-align: left;
        }
        .currency-table th {
            background: rgba(255, 255, 255, 0.04);
            color: #a1a1aa;
        }
        .currency-table td {
            color: #e4e4e7;
            font-family: monospace;
        }
        .flag-icon {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← 返回首页</a>

    <div class="container">
        <h1>汇率换算器</h1>
        <p>支持多国主流货币实时汇率换算与汇率行情对照表，纯前端即时计算。</p>

        <div class="calc-card">
            <div class="converter-row">
                <div class="currency-box">
                    <label>持有货币与金额</label>
                    <input type="number" class="input-styled" id="fromAmount" value="100" step="any">
                    <select class="select-styled" id="fromCurrency"></select>
                </div>

                <div>
                    <button class="swap-btn" id="swapBtn" title="交换货币">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"/></svg>
                    </button>
                </div>

                <div class="currency-box">
                    <label>兑换目标货币结果</label>
                    <input type="number" class="input-styled" id="toAmount" readonly>
                    <select class="select-styled" id="toCurrency"></select>
                </div>
            </div>

            <div class="rate-info-bar">
                <span id="rateSummary">1 USD ≈ 7.2350 CNY</span>
                <span style="font-size:12px; color:#71717a;">基准参考汇率 (每日自动/离线参考)</span>
            </div>
        </div>

        <div class="calc-card">
            <div style="font-size:15px; font-weight:600; color:#e4e4e7; margin-bottom:10px;">当前金额在各主流币种等值概览：</div>
            <div style="overflow-x:auto;">
                <table class="currency-table">
                    <thead>
                        <tr>
                            <th>货币代码与名称</th>
                            <th>折算后金额</th>
                            <th>汇率 (相对持有币)</th>
                        </tr>
                    </thead>
                    <tbody id="currencyTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // 汇率基准（相对美元 USD = 1.0）
        const RATES_TO_USD = {
            CNY: { name: '人民币 (CNY)', flag: '🇨🇳', rate: 7.238 },
            USD: { name: '美元 (USD)', flag: '🇺🇸', rate: 1.0 },
            EUR: { name: '欧元 (EUR)', flag: '🇪🇺', rate: 0.921 },
            JPY: { name: '日元 (JPY)', flag: '🇯🇵', rate: 153.25 },
            GBP: { name: '英镑 (GBP)', flag: '🇬🇧', rate: 0.789 },
            HKD: { name: '港币 (HKD)', flag: '🇭🇰', rate: 7.825 },
            AUD: { name: '澳大利亚元 (AUD)', flag: '🇦🇺', rate: 1.512 },
            CAD: { name: '加拿大元 (CAD)', flag: '🇨🇦', rate: 1.368 },
            SGD: { name: '新加坡元 (SGD)', flag: '🇸🇬', rate: 1.345 },
            KRW: { name: '韩元 (KRW)', flag: '🇰🇷', rate: 1358.5 },
            CHF: { name: '瑞士法郎 (CHF)', flag: '🇨🇭', rate: 0.908 },
            RUB: { name: '俄罗斯卢布 (RUB)', flag: '🇷🇺', rate: 91.5 }
        };

        const fromCurrency = document.getElementById('fromCurrency');
        const toCurrency = document.getElementById('toCurrency');
        const fromAmount = document.getElementById('fromAmount');
        const toAmount = document.getElementById('toAmount');
        const swapBtn = document.getElementById('swapBtn');
        const rateSummary = document.getElementById('rateSummary');
        const currencyTbody = document.getElementById('currencyTbody');

        function initSelects() {
            Object.keys(RATES_TO_USD).forEach(code => {
                const item = RATES_TO_USD[code];
                const opt1 = document.createElement('option');
                opt1.value = code;
                opt1.textContent = `${item.flag} ${item.name}`;
                fromCurrency.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = code;
                opt2.textContent = `${item.flag} ${item.name}`;
                toCurrency.appendChild(opt2);
            });

            fromCurrency.value = 'CNY';
            toCurrency.value = 'USD';
            convert();
        }

        function convert() {
            const amt = parseFloat(fromAmount.value);
            if (isNaN(amt)) {
                toAmount.value = '';
                currencyTbody.innerHTML = '';
                return;
            }

            const fromCode = fromCurrency.value;
            const toCode = toCurrency.value;

            // 计算汇率: 1 fromCode = ? toCode
            // fromCode / rateFrom = USD; USD * rateTo = toCode
            const rateFrom = RATES_TO_USD[fromCode].rate;
            const rateTo = RATES_TO_USD[toCode].rate;
            const exchangeRate = rateTo / rateFrom;

            const res = amt * exchangeRate;
            toAmount.value = res.toFixed(4);

            rateSummary.textContent = `1 ${fromCode} ≈ ${exchangeRate.toFixed(4)} ${toCode}`;

            // 渲染全币种对照
            currencyTbody.innerHTML = '';
            Object.keys(RATES_TO_USD).forEach(code => {
                if (code === fromCode) return;
                const targetRate = RATES_TO_USD[code].rate / rateFrom;
                const convertedVal = amt * targetRate;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${RATES_TO_USD[code].flag} ${RATES_TO_USD[code].name}</td>
                    <td><strong style="color:#34d399;">${convertedVal.toFixed(2)}</strong> ${code}</td>
                    <td style="color:#a1a1aa;">1 ${fromCode} = ${targetRate.toFixed(4)}</td>
                `;
                currencyTbody.appendChild(tr);
            });
        }

        fromAmount.addEventListener('input', convert);
        fromCurrency.addEventListener('change', convert);
        toCurrency.addEventListener('change', convert);

        swapBtn.addEventListener('click', () => {
            const temp = fromCurrency.value;
            fromCurrency.value = toCurrency.value;
            toCurrency.value = temp;
            convert();
        });

        initSelects();
    </script>
</body>
</html>
