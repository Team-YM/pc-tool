<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Roboto+Mono');

    .center-xy {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      position: absolute;
    }

    html,
    body {
      font-family: 'Roboto Mono', monospace;
      font-size: 16px;
    }

    html {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 229, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.08) 0%, transparent 50%);
      animation: gradientShift 15s ease infinite;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .container::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 229, 0, 0.03) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.3;
      }
    }

    .copy-container {
      text-align: center;
      min-width: 320px;
      padding: 40px;
      background: rgba(10, 10, 10, 0.6);
      border: 1px solid rgba(255, 229, 0, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 229, 0, 0.1),
        0 0 60px rgba(255, 229, 0, 0.05);
      position: relative;
      z-index: 10;
    }

    .copy-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        rgba(255, 229, 0, 0.3), 
        rgba(138, 43, 226, 0.3), 
        rgba(255, 229, 0, 0.3));
      border-radius: 12px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .copy-container:hover::before {
      opacity: 0.6;
      animation: borderGlow 2s linear infinite;
    }

    @keyframes borderGlow {
      0% {
        filter: hue-rotate(0deg);
      }
      100% {
        filter: hue-rotate(360deg);
      }
    }

    .copy-container p {
      color: #fff;
      font-size: 24px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      margin: 0;
      white-space: nowrap;
      text-shadow: 
        0 0 10px rgba(255, 229, 0, 0.5),
        0 0 20px rgba(255, 229, 0, 0.3),
        0 0 30px rgba(255, 229, 0, 0.1);
    }

    .copy-container p + p {
      margin-top: 8px;
    }

    .back-home {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      border: 2px solid #ffe500;
      color: #ffe500;
      background: transparent;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .back-home::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: #ffe500;
      transition: width 0.4s ease, height 0.4s ease, top 0.4s ease, left 0.4s ease;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .back-home.is-visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-home:hover {
      color: #000;
      border-color: #ffe500;
      box-shadow: 
        0 0 20px rgba(255, 229, 0, 0.6),
        0 0 40px rgba(255, 229, 0, 0.4),
        inset 0 0 20px rgba(255, 229, 0, 0.2);
      transform: translateY(-2px);
    }

    .back-home:hover::before {
      width: 300px;
      height: 300px;
    }

    .char {
      display: inline-block;
      opacity: 0;
    }

    .char.is-visible {
      animation: reveal 0.001s ease forwards;
    }

    .handle {
      display: block !important;
      visibility: visible !important;
      background-color: #ffe500;
      width: 14px;
      height: 30px;
      margin: 0;
      position: absolute;
      z-index: 9999;
      opacity: 1 !important;
      transform: none;
      pointer-events: none;
      box-shadow: 
        0 0 10px rgba(255, 229, 0, 0.8),
        0 0 20px rgba(255, 229, 0, 0.6),
        0 0 30px rgba(255, 229, 0, 0.4);
      animation: handlePulse 1.5s ease-in-out infinite;
    }

    @keyframes handlePulse {
      0%, 100% {
        box-shadow: 
          0 0 10px rgba(255, 229, 0, 0.8),
          0 0 20px rgba(255, 229, 0, 0.6),
          0 0 30px rgba(255, 229, 0, 0.4);
      }
      50% {
        box-shadow: 
          0 0 15px rgba(255, 229, 0, 1),
          0 0 30px rgba(255, 229, 0, 0.8),
          0 0 45px rgba(255, 229, 0, 0.6);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }


    #cb-replay {
      fill: #ffe500;
      width: 24px;
      margin: 20px;
      right: 0;
      bottom: 0;
      position: absolute;
      overflow: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(255, 229, 0, 0.5));
      z-index: 100;
    }

    #cb-replay:hover {
      fill: #fff;
      transform: rotate(360deg) scale(1.1);
      filter: drop-shadow(0 0 15px rgba(255, 229, 0, 0.9));
    }

    @media (max-width: 768px) {
      .copy-container {
        padding: 30px 20px;
        min-width: 280px;
      }
      
      .copy-container p {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="copy-container center-xy">
      <p data-text="404, page not found."></p>
      <p data-text="404，界面未找到"></p>
      <button class="back-home" type="button">Back Home</button>
      <span class="handle"></span>
    </div>
  </div>

  <svg version="1.1" id="cb-replay" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
    viewBox="0 0 279.9 297.3" style="enable-background:new 0 0 279.9 297.3;" xml:space="preserve" aria-label="Replay animation">
    <g>
      <path d="M269.4,162.6c-2.7,66.5-55.6,120.1-121.8,123.9c-77,4.4-141.3-60-136.8-136.9C14.7,81.7,71,27.8,140,27.8
        c1.8,0,3.5,0,5.3,0.1c0.3,0,0.5,0.2,0.5,0.5v15c0,1.5,1.6,2.4,2.9,1.7l35.9-20.7c1.3-0.7,1.3-2.6,0-3.3L148.6,0.3
        c-1.3-0.7-2.9,0.2-2.9,1.7v15c0,0.3-0.2,0.5-0.5,0.5c-1.7-0.1-3.5-0.1-5.2-0.1C63.3,17.3,1,78.9,0,155.4
        C-1,233.8,63.4,298.3,141.9,297.3c74.6-1,135.1-60.2,138-134.3c0.1-3-2.3-5.4-5.3-5.4l0,0C271.8,157.6,269.5,159.8,269.4,162.6z"/>
    </g>
  </svg>

  <script>
    (function () {
      var lines = Array.prototype.slice.call(document.querySelectorAll('.copy-container p'));
      var handle = document.querySelector('.handle');
      var button = document.querySelector('.back-home');
      var replay = document.getElementById('cb-replay');
      var characterTimers = [];
      var lineTimers = [];

      function setHandlePosition(element) {
        var rect = element.getBoundingClientRect();
        var parentRect = handle.parentElement.getBoundingClientRect();
        handle.style.left = (rect.right - parentRect.left) + 'px';
        handle.style.top = (rect.top - parentRect.top) + 'px';
      }

      function setLineStart(line) {
        var rect = line.getBoundingClientRect();
        var parentRect = handle.parentElement.getBoundingClientRect();
        handle.style.left = (rect.left - parentRect.left) + 'px';
        handle.style.top = (rect.top - parentRect.top) + 'px';
      }

      function typeLine(line, delay, done) {
        var text = line.getAttribute('data-text');
        line.textContent = '';

        lineTimers.push(window.setTimeout(function () {
          setLineStart(line);
          text.split('').forEach(function (character, index) {
            var span = document.createElement('span');
            span.className = 'char';
            span.textContent = character === ' ' ? '\u00a0' : character;
            line.appendChild(span);

            characterTimers.push(window.setTimeout(function () {
              span.classList.add('is-visible');
              setHandlePosition(span);
            }, index * 50));
          });

          lineTimers.push(window.setTimeout(done, text.length * 50 + 100));
        }, delay));
      }

      function animateCopy() {
        characterTimers.forEach(window.clearTimeout);
        lineTimers.forEach(window.clearTimeout);
        characterTimers = [];
        lineTimers = [];
        button.classList.remove('is-visible');
        lines.forEach(function (line) {
          line.textContent = '';
        });

        typeLine(lines[0], 0, function () {
          typeLine(lines[1], 250, function () {
            button.classList.add('is-visible');
          });
        });
      }

      button.addEventListener('click', function () {
        window.location.href = 'index.html';
      });

      window.addEventListener('resize', function () {
        var visible = document.querySelectorAll('.char.is-visible');
        if (visible.length) {
          setHandlePosition(visible[visible.length - 1]);
        }
      });

      animateCopy();

      replay.addEventListener('click', animateCopy);
    }());
  </script>
</body>
</html>
