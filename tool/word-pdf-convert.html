    <script>
    (function() {
        // ========== DOM 引用 ==========
        var modeTabWordToPdf = document.getElementById('tabWordToPdf');
        var modeTabPdfToWord = document.getElementById('tabPdfToWord');
        var modeSubtitle = document.getElementById('modeSubtitle');
        var dropArea = document.getElementById('dropArea');
        var fileInput = document.getElementById('fileInput');
        var fileInfoDiv = document.getElementById('fileInfo');
        var fileNameDisplay = document.getElementById('fileNameDisplay');
        var removeFileBtn = document.getElementById('removeFileBtn');
        var convertBtn = document.getElementById('convertBtn');
        var statusMessage = document.getElementById('statusMessage');
        var previewBox = document.getElementById('previewBox');
        var downloadBtn = document.getElementById('downloadBtn');
        var uploadText = document.getElementById('uploadText');
        var uploadHint = document.getElementById('uploadHint');

        var currentMode = 'word2pdf';
        var selectedFile = null;
        var resultBlob = null;
        var resultFileName = '';

        // ========== 模式切换 ==========
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'word2pdf') {
                modeTabWordToPdf.classList.add('active');
                modeTabPdfToWord.classList.remove('active');
                modeSubtitle.textContent = 'Word 转 PDF · 纯浏览器端处理';
                uploadText.textContent = '点击或拖拽 Word 文档 (.docx)';
                uploadHint.textContent = '支持 .docx 格式，最大约 200MB';
                fileInput.accept = '.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                convertBtn.innerHTML = '转换为 PDF';
            } else {
                modeTabPdfToWord.classList.add('active');
                modeTabWordToPdf.classList.remove('active');
                modeSubtitle.textContent = 'PDF 转 Word · 纯浏览器端处理';
                uploadText.textContent = '点击或拖拽 PDF 文档';
                uploadHint.textContent = '支持 .pdf 格式，最大约 200MB';
                fileInput.accept = '.pdf,application/pdf';
                convertBtn.innerHTML = '转换为 Word';
            }
            resetAll();
        }

        modeTabWordToPdf.addEventListener('click', function() { setMode('word2pdf'); });
        modeTabPdfToWord.addEventListener('click', function() { setMode('pdf2word'); });

        // ========== UI 辅助 ==========
        function updateStatus(text, isError) {
            statusMessage.innerHTML = text;
            statusMessage.style.color = isError ? '#f87171' : '#a1a1aa';
            statusMessage.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(255, 255, 255, 0.03)';
        }

        function resetAll() {
            selectedFile = null;
            resultBlob = null;
            resultFileName = '';
            fileInput.value = '';
            fileInfoDiv.style.display = 'none';
            fileNameDisplay.textContent = '';
            convertBtn.disabled = true;
            previewBox.classList.remove('show');
            previewBox.innerHTML = '';
            downloadBtn.classList.remove('show');
            updateStatus(currentMode === 'word2pdf' ? '请先选择 Word 文档 (.docx)' : '请先选择 PDF 文档');
        }

        function displayFileInfo(file) {
            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileInfoDiv.style.display = 'flex';
            convertBtn.disabled = false;
            updateStatus('已选择: ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)');
        }

        function isValidFile(file) {
            if (!file) return false;
            if (currentMode === 'word2pdf') {
                var name = file.name.toLowerCase();
                return file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || name.endsWith('.docx');
            }
            return file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        }

        function handleFileSelect(file) {
            if (!file) { resetAll(); return; }
            if (!isValidFile(file)) {
                updateStatus('请选择有效的' + (currentMode === 'word2pdf' ? 'Word文档(.docx)' : 'PDF文档'), true);
                selectedFile = null;
                fileNameDisplay.textContent = file.name + ' (无效格式)';
                fileInfoDiv.style.display = 'flex';
                convertBtn.disabled = true;
                previewBox.classList.remove('show');
                downloadBtn.classList.remove('show');
                return;
            }
            displayFileInfo(file);
            previewBox.classList.remove('show');
            downloadBtn.classList.remove('show');
        }

        // ========== 拖拽 & 点击上传 ==========
        dropArea.addEventListener('click', function(e) {
            if (e.target === removeFileBtn) return;
            fileInput.click();
        });
        fileInput.addEventListener('change', function(e) { handleFileSelect(e.target.files[0]); });
        dropArea.addEventListener('dragover', function(e) { e.preventDefault(); dropArea.classList.add('dragover'); });
        dropArea.addEventListener('dragleave', function(e) { e.preventDefault(); dropArea.classList.remove('dragover'); });
        dropArea.addEventListener('drop', function(e) {
            e.preventDefault(); dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) { handleFileSelect(e.dataTransfer.files[0]); fileInput.value = ''; }
        });
        removeFileBtn.addEventListener('click', function(e) { e.stopPropagation(); resetAll(); });

        // ========== Word → PDF（mammoth + html2pdf） ==========
        async function convertWordToPdf() {
            var arrayBuffer = await readFileAsArrayBuffer(selectedFile);

            // DOCX 本质是 ZIP 包，验证文件头是否为 ZIP 签名 (PK)
            var header = new Uint8Array(arrayBuffer, 0, 4);
            var isZip = header[0] === 0x50 && header[1] === 0x4B;
            if (!isZip) {
                throw new Error('该文件不是有效的 Word 文档。DOCX 必须是标准 ZIP 格式，请确认来源正确（不是 .doc 老格式改后缀）');
            }

            updateStatus('正在解析 Word 文档...');
            var result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
            var htmlContent = result.value;
            if (!htmlContent || htmlContent.trim().length === 0) {
                throw new Error('文档内容为空或无法解析');
            }

            updateStatus('正在转换为 PDF，请稍候...');

            var container = document.createElement('div');
            container.innerHTML = htmlContent;
            container.style.cssText = 'position:absolute;left:0;top:0;width:800px;opacity:0;pointer-events:none;background:#fff;color:#222;font-family:"Microsoft YaHei","SimSun",sans-serif;line-height:1.8;font-size:14px;padding:40px;';
            document.body.appendChild(container);

            try {
                var pdfBlob = await html2pdf().set({
                    margin: [15, 15, 15, 15],
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: { scale: 2, useCORS: true, logging: false },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(container).outputPdf('blob');

                resultBlob = pdfBlob;
                resultFileName = selectedFile.name.replace(/\.docx$/i, '') + '.pdf';

                previewBox.innerHTML = htmlContent;
                previewBox.classList.add('show');
                updateStatus('转换完成，点击下方按钮下载 PDF');
                downloadBtn.classList.add('show');
                downloadBtn.textContent = '下载 PDF';
            } finally {
                document.body.removeChild(container);
            }
        }

        // ========== PDF → Word（pdf.js + JSZip） ==========
        async function convertPdfToWord() {
            if (!window._pdfjs) {
                throw new Error('PDF解析组件未加载，请刷新页面后重试');
            }

            var arrayBuffer = await readFileAsArrayBuffer(selectedFile);
            updateStatus('正在解析 PDF 文档...');

            var pdf = await window._pdfjs.getDocument({ data: arrayBuffer, disableWorker: true }).promise;
            var totalPages = pdf.numPages;
            var allText = '';

            for (var i = 1; i <= totalPages; i++) {
                updateStatus('正在提取第 ' + i + '/' + totalPages + ' 页...');
                var page = await pdf.getPage(i);
                var textContent = await page.getTextContent();
                var pageText = '';
                var lastY = null;

                textContent.items.forEach(function(item) {
                    var y = Math.round(item.transform[5]);
                    if (lastY !== null && Math.abs(y - lastY) > 2) {
                        pageText += '\n';
                    } else if (lastY !== null && pageText.length > 0 && !pageText.endsWith('\n') && !pageText.endsWith(' ')) {
                        pageText += ' ';
                    }
                    pageText += item.str;
                    lastY = y;
                });

                if (pageText.trim()) { allText += pageText.trim() + '\n\n'; }
            }

            if (!allText.trim()) {
                throw new Error('PDF 中没有可提取的文本内容（可能是扫描件或纯图片PDF）');
            }

            previewBox.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;">' +
                escapeHtml(allText.substring(0, 5000)) +
                (allText.length > 5000 ? '\n\n...（内容过长，仅展示前5000字）' : '') +
                '</pre>';
            previewBox.classList.add('show');

            updateStatus('文本提取完成，正在生成 Word 文档...');

            // JSZip 构建 DOCX
            var zip = new JSZip();
            var paragraphs = allText.split('\n\n').filter(function(p) { return p.trim(); });
            var bodyXml = '<w:body>';

            paragraphs.forEach(function(para) {
                var lines = para.split('\n');
                lines.forEach(function(line) {
                    var escaped = escapeXml(line.trim());
                    if (escaped) {
                        bodyXml += '<w:p><w:r><w:rPr><w:rFonts w:ascii="Microsoft YaHei" w:eastAsia="Microsoft YaHei"/>' +
                            '<w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">' + escaped + '</w:t></w:r></w:p>';
                    }
                });
            });
            bodyXml += '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body>';

            var documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"' +
                ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
                bodyXml + '</w:document>';

            zip.file('[Content_Types].xml',
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                '<Default Extension="xml" ContentType="application/xml"/>' +
                '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
                '</Types>');

            zip.folder('_rels').file('.rels',
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
                '</Relationships>');

            zip.folder('word').file('document.xml', documentXml);
            zip.folder('word').folder('_rels').file('document.xml.rels',
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');

            var docxBlob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });

            resultBlob = docxBlob;
            resultFileName = selectedFile.name.replace(/\.pdf$/i, '') + '.docx';
            updateStatus('转换完成，点击下方按钮下载 Word 文档');
            downloadBtn.classList.add('show');
            downloadBtn.textContent = '下载 Word 文档 (.docx)';
        }

        // ========== 工具函数 ==========
        function readFileAsArrayBuffer(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function() { resolve(reader.result); };
                reader.onerror = function() { reject(new Error('文件读取失败')); };
                reader.readAsArrayBuffer(file);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function escapeXml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }

        // ========== 转换按钮 ==========
        convertBtn.addEventListener('click', async function() {
            if (!selectedFile || !isValidFile(selectedFile)) {
                updateStatus('请先选择有效的文件', true);
                return;
            }

            convertBtn.disabled = true;
            convertBtn.innerHTML = '转换中...';
            previewBox.classList.remove('show');
            previewBox.innerHTML = '';
            downloadBtn.classList.remove('show');
            resultBlob = null;

            try {
                if (currentMode === 'word2pdf') {
                    await convertWordToPdf();
                } else {
                    await convertPdfToWord();
                }
            } catch (error) {
                console.error('[doc-convert] 转换错误:', error);
                updateStatus('转换失败: ' + error.message, true);
                previewBox.classList.remove('show');
                downloadBtn.classList.remove('show');
            }

            convertBtn.innerHTML = currentMode === 'word2pdf' ? '转换为 PDF' : '转换为 Word';
            convertBtn.disabled = false;
        });

        // ========== 下载按钮 ==========
        downloadBtn.addEventListener('click', function() {
            if (!resultBlob) return;
            var url = URL.createObjectURL(resultBlob);
            var a = document.createElement('a');
            a.href = url;
            a.download = resultFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
            updateStatus('文件已下载: ' + resultFileName);
        });

        // ========== 初始化 ==========
        setMode('word2pdf');
        resetAll();
    })();
    </script>
</body>
</html>
