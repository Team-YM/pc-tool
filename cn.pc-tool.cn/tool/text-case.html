<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>文本大小写转换 | PC-TOOL</title><link rel="stylesheet" href="common.css"><style>
.container{max-width:850px}.container h1{margin-bottom:8px}.container>p{margin-bottom:20px}.area{text-align:left;margin-bottom:16px}.label{display:block;color:#a1a1aa;font-size:13px;margin-bottom:8px}.text{width:100%;height:180px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e4e4e7;font:14px/1.6 Consolas,monospace;resize:vertical;outline:none}.text:focus{border-color:rgba(129,140,248,.5)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.toolbar .btn{margin:0;padding:9px 13px;font-size:14px}.output{height:150px}.muted{color:#a1a1aa;font-size:13px;margin-top:6px}
</style></head><body><canvas id="bg-canvas" class="bg-canvas"></canvas><a class="back-link" href="../index.html">← 返回首页</a><div class="container"><h1>文本大小写转换</h1><p>将英文单词按常见命名规范转换，中文和 Unicode 字符会被保留。</p><div class="area"><label class="label" for="input">输入文本</label><textarea id="input" class="text" placeholder="例如：hello world 或 hello-world"></textarea></div><div class="toolbar" id="tools"></div><div class="area"><label class="label" for="output">转换结果 <button class="btn" id="copy" style="float:right;margin:0;padding:4px 10px;font-size:12px">复制</button></label><textarea id="output" class="text output" readonly></textarea><div class="muted" id="hint"></div></div><button class="btn" id="clear">清空</button></div><script src="common.js"></script><script>
(function(){var input=document.getElementById('input'),output=document.getElementById('output'),hint=document.getElementById('hint'),tools=document.getElementById('tools');var modes=[['upper','大写'],['lower','小写'],['title','首字母大写'],['sentence','句首大写'],['camel','camelCase'],['pascal','PascalCase'],['snake','snake_case'],['kebab','kebab-case'],['constant','CONSTANT_CASE'],['dot','dot.case'],['space','空格连接']];modes.forEach(function(m){var b=document.createElement('button');b.className='btn';b.textContent=m[1];b.onclick=function(){convert(m[0])};tools.appendChild(b)});function words(s){return s.trim().split(/[\s\-_.,;:!?/\\|()[\]{}]+/).filter(Boolean)}function convert(mode){var s=input.value;if(mode==='upper')output.value=s.toLocaleUpperCase();else if(mode==='lower')output.value=s.toLocaleLowerCase();else if(mode==='sentence')output.value=s.replace(/(^|[.!?。！？]\s*)([A-Za-z])/g,function(_,p,c){return p+c.toUpperCase()});else if(mode==='title')output.value=s.replace(/(^|[\s\-_.,;:!?])([\p{L}\p{N}])/gu,function(_,p,c){return p+c.toLocaleUpperCase()});else{var w=words(s).map(function(x){return x.toLocaleLowerCase()}),cap=w.map(function(x){return x.charAt(0).toLocaleUpperCase()+x.slice(1)});if(mode==='camel')output.value=(w[0]||'')+cap.slice(1).join('');else if(mode==='pascal')output.value=cap.join('');else if(mode==='snake')output.value=w.join('_');else if(mode==='kebab')output.value=w.join('-');else if(mode==='constant')output.value=w.join('_').toLocaleUpperCase();else if(mode==='dot')output.value=w.join('.');else output.value=w.join(' ')}hint.textContent='已处理 '+output.value.length+' 个字符'}document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(output.value).then(function(){showToast('结果已复制')})};document.getElementById('clear').onclick=function(){input.value='';output.value='';hint.textContent=''};input.addEventListener('input',function(){if(input.value)convert('lower')})})();
</script></body></html>
