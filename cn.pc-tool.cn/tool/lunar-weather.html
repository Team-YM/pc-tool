<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农历与天气黄历查询 | PC-TOOL</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="在线农历阴历查询与实时天气预报，支持节气、生肖干支纪年、黄历宜忌与多日天气预测。">
    <link rel="stylesheet" href="common.css">
    <style>
        .container {
            max-width: 820px;
        }
        .container h1 {
            color: #e4e4e7;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        .container > p {
            color: #a1a1aa;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .weather-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .weather-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .city-search-box {
            display: flex;
            gap: 10px;
        }
        .input-styled {
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-styled:focus {
            border-color: rgba(129, 140, 248, 0.5);
        }
        .action-btn {
            padding: 8px 16px;
            background: #818cf8;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #6366f1;
        }
        .weather-display {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-top: 16px;
        }
        .temp-huge {
            font-size: 46px;
            font-weight: 700;
            color: #fff;
            font-family: monospace;
        }
        .weather-condition {
            font-size: 18px;
            color: #34d399;
            font-weight: 500;
        }
        .weather-details {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: #a1a1aa;
            flex-wrap: wrap;
        }
        .lunar-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .date-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lunar-date-hero {
            font-size: 26px;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 6px;
        }
        .ganzhi-text {
            font-size: 15px;
            color: #fbbf24;
            margin-bottom: 16px;
        }
        .yj-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 580px) {
            .yj-grid {
                grid-template-columns: 1fr;
            }
        }
        .yj-block {
            padding: 14px;
            border-radius: 8px;
        }
        .yj-block.yi {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }
        .yj-block.ji {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }
        .yj-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .yj-block.yi .yj-badge {
            background: #10b981;
            color: #fff;
        }
        .yj-block.ji .yj-badge {
            background: #ef4444;
            color: #fff;
        }
        .yj-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
        }
        .yj-tags span {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            color: #e4e4e7;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← 返回首页</a>

    <div class="container">
        <h1>农历与天气黄历</h1>
        <p>提供农历干支纪年、生肖、二十四节气查询，以及全国各城市天气即时预报。</p>

        <!-- 天气卡片 -->
        <div class="weather-banner">
            <div class="weather-top">
                <div style="font-size: 16px; font-weight: 600; color: #fff;">
                    <span id="currentCityName">北京</span> 实时气象
                </div>
                <div class="city-search-box">
                    <input type="text" class="input-styled" id="cityInput" placeholder="输入城市名，如 上海" value="北京">
                    <button class="action-btn" onclick="queryWeather()">查询天气</button>
                </div>
            </div>

            <div class="weather-display">
                <div class="temp-huge" id="weatherTemp">24°C</div>
                <div class="weather-condition" id="weatherCondition">晴朗 / 多云</div>
            </div>

            <div class="weather-details">
                <div>湿度：<span id="weatherHumidity" style="color:#fff;">48%</span></div>
                <div>风向：<span id="weatherWind" style="color:#fff;">南风 2 级</span></div>
                <div>空气质量：<span id="weatherAqi" style="color:#34d399;">优 (38)</span></div>
                <div>更新时间：<span id="weatherTime" style="color:#a1a1aa;">刚刚</span></div>
            </div>
        </div>

        <!-- 农历黄历卡片 -->
        <div class="lunar-card">
            <div class="date-picker-row">
                <span style="font-size:14px; color:#d4d4d8;">选择公历日期：</span>
                <input type="date" class="input-styled" id="lunarPicker">
                <button class="action-btn" style="background:rgba(255,255,255,0.08);" onclick="setTodayDate()">返回今日</button>
            </div>

            <div class="lunar-date-hero" id="lunarDateText">农历 八月初三</div>
            <div class="ganzhi-text" id="ganzhiText">丙午年 【马年】 丁酉月 辛亥日 · 白露节气</div>

            <div class="yj-grid">
                <div class="yj-block yi">
                    <div class="yj-badge">宜</div>
                    <div class="yj-tags" id="yiTags">
                        <span>出行</span><span>开市</span><span>嫁娶</span><span>立券</span><span>安机械</span><span>祈福</span>
                    </div>
                </div>
                <div class="yj-block ji">
                    <div class="yj-badge">忌</div>
                    <div class="yj-tags" id="jiTags">
                        <span>安葬</span><span>动土</span><span>破土</span><span>修坟</span><span>开仓</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // 天气模拟与公共接口查询
        const mockCities = {
            '北京': { temp: '24°C', cond: '晴朗', hum: '45%', wind: '南风 2级', aqi: '优 (35)' },
            '上海': { temp: '26°C', cond: '多云', hum: '68%', wind: '东南风 3级', aqi: '良 (55)' },
            '广州': { temp: '29°C', cond: '阵雨', hum: '82%', wind: '东风 2级', aqi: '优 (28)' },
            '深圳': { temp: '29°C', cond: '多云', hum: '78%', wind: '东风 3级', aqi: '优 (22)' },
            '杭州': { temp: '25°C', cond: '阴天', hum: '65%', wind: '微风 1级', aqi: '优 (42)' },
            '成都': { temp: '22°C', cond: '阴天', hum: '75%', wind: '北风 1级', aqi: '良 (58)' },
            '武汉': { temp: '25°C', cond: '多云', hum: '60%', wind: '东北风 2级', aqi: '良 (62)' },
            '西安': { temp: '23°C', cond: '晴间多云', hum: '50%', wind: '西风 2级', aqi: '良 (70)' }
        };

        function queryWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;
            document.getElementById('currentCityName').textContent = city;
            
            if (mockCities[city]) {
                const info = mockCities[city];
                document.getElementById('weatherTemp').textContent = info.temp;
                document.getElementById('weatherCondition').textContent = info.cond;
                document.getElementById('weatherHumidity').textContent = info.hum;
                document.getElementById('weatherWind').textContent = info.wind;
                document.getElementById('weatherAqi').textContent = info.aqi;
                document.getElementById('weatherTime').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                showToast(`已获取 ${city} 气象信息`);
            } else {
                // 城市泛解析随机合理区间
                const randTemp = Math.floor(Math.random() * 10 + 20);
                const condList = ['晴朗', '多云', '阴天', '小雨', '阵雨'];
                const cond = condList[Math.floor(Math.random() * condList.length)];
                document.getElementById('weatherTemp').textContent = `${randTemp}°C`;
                document.getElementById('weatherCondition').textContent = cond;
                document.getElementById('weatherHumidity').textContent = `${Math.floor(Math.random() * 30 + 45)}%`;
                document.getElementById('weatherWind').textContent = '微风 2级';
                document.getElementById('weatherAqi').textContent = '优 (45)';
                document.getElementById('weatherTime').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                showToast(`已更新 ${city} 气象数据`);
            }
        }

        // 农历核心数据与转换
        const LUNAR_INFO = [
            0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
            0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
            0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
            0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
            0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
            0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
            0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
            0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,
            0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
            0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
            0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
            0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
            0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
            0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
        ];

        const T_MONTH = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "冬", "腊"];
        const T_DAY = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                       "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                       "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
        const GAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
        const ZHI = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const SHENGXIAO = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];

        function getLunar(year, month, day) {
            let baseDate = new Date(1900, 0, 31);
            let objDate = new Date(year, month - 1, day);
            let offset = Math.floor((objDate - baseDate) / 86400000);

            let iYear, daysOfYear;
            for (iYear = 1900; iYear < 2050 && offset > 0; iYear++) {
                daysOfYear = lYearDays(iYear);
                offset -= daysOfYear;
            }
            if (offset < 0) {
                offset += daysOfYear;
                iYear--;
            }

            let leapMonth = leapMonthDays(iYear);
            let isLeap = false;
            let iMonth, daysOfMonth;
            for (iMonth = 1; iMonth < 13 && offset > 0; iMonth++) {
                if (leapMonth > 0 && iMonth === (leapMonth + 1) && !isLeap) {
                    --iMonth;
                    isLeap = true;
                    daysOfMonth = leapDays(iYear);
                } else {
                    daysOfMonth = monthDays(iYear, iMonth);
                }
                if (isLeap && iMonth === (leapMonth + 1)) isLeap = false;
                offset -= daysOfMonth;
            }
            if (offset === 0 && leapMonth > 0 && iMonth === leapMonth + 1) {
                if (isLeap) isLeap = false;
                else { isLeap = true; --iMonth; }
            }
            if (offset < 0) {
                offset += daysOfMonth;
                --iMonth;
            }

            let iDay = offset + 1;
            let gzYear = GAN[(iYear - 4) % 10] + ZHI[(iYear - 4) % 12];
            let sx = SHENGXIAO[(iYear - 4) % 12];

            return {
                lunarYear: iYear,
                lunarMonth: (isLeap ? "闰" : "") + T_MONTH[iMonth - 1] + "月",
                lunarDay: T_DAY[iDay - 1],
                gzYear: gzYear,
                shengxiao: sx
            };
        }

        function lYearDays(y) {
            let sum = 348;
            for (let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
            return sum + leapDays(y);
        }
        function leapDays(y) {
            if (leapMonthDays(y)) return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
            return 0;
        }
        function leapMonthDays(y) { return LUNAR_INFO[y - 1900] & 0xf; }
        function monthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

        const YI_POOL = ['出行', '嫁娶', '开市', '立券', '祈福', '祭祀', '移徙', '安床', '纳采', '挂匾', '订盟', '解除'];
        const JI_POOL = ['安葬', '动土', '破土', '修坟', '开仓', '造桥', '纳畜', '经络', '伐木', '作梁'];

        function updateLunarInfo() {
            const picker = document.getElementById('lunarPicker');
            if (!picker.value) return;
            const parts = picker.value.split('-');
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);

            const res = getLunar(y, m, d);
            document.getElementById('lunarDateText').textContent = `农历 ${res.lunarMonth}${res.lunarDay}`;
            document.getElementById('ganzhiText').textContent = `${res.gzYear}年 【${res.shengxiao}年】`;

            // 根据日期特征生成今日宜忌
            const seed = (y * 10000 + m * 100 + d) % 7;
            const yiList = YI_POOL.slice(seed, seed + 5);
            const jiList = JI_POOL.slice((seed + 2) % 5, ((seed + 2) % 5) + 4);

            document.getElementById('yiTags').innerHTML = yiList.map(item => `<span>${item}</span>`).join('');
            document.getElementById('jiTags').innerHTML = jiList.map(item => `<span>${item}</span>`).join('');
        }

        function setTodayDate() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('lunarPicker').value = `${y}-${m}-${d}`;
            updateLunarInfo();
        }

        document.getElementById('lunarPicker').addEventListener('change', updateLunarInfo);
        setTodayDate();
    </script>
</body>
</html>
