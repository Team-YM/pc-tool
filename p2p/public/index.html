<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直连传文件</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div><span class="eyebrow">WEBRTC DIRECT</span><h1>直连传文件</h1><p class="muted">文件只在两台设备之间传输，不经过服务器。</p></div><span id="visitorName" class="pill"></span></header><section id="landing" class="panel"><div class="hero"><h2>建立一个安全的临时房间</h2><p>无需登录，分享 6 位邀请码即可开始。</p><div class="actions"><button id="createBtn" class="primary">创建房间</button><label class="join"><input id="roomInput" maxlength="6" placeholder="输入邀请码"><button id="joinBtn">加入房间</button></label><p id="joinMessage" class="muted" role="status"></p></div><div id="cooldown" class="notice hidden"></div></div></section><section id="room" class="panel hidden"><div class="roombar"><div><span class="muted">房间邀请码</span><strong id="roomCode"></strong><button id="copyBtn" class="icon-btn" title="复制邀请码">复制</button></div><span id="connection" class="status">等待对方加入</span><button id="leaveBtn" class="danger">离开房间</button></div><div id="dropZone" class="drop"><input id="fileInput" type="file" accept=".zip,.7z,.rar,.gz,.gzip,.tar,.tgz,.bz2,.tbz,.tbz2,.xz,.txz,.zst,.tzst" multiple hidden><button id="pickBtn" class="primary">选择文件</button><small class="upload-hint">确保用户安全 只能传输压缩包 请压缩后传输</small><span>或将文件拖到这里</span></div><div id="files" class="file-list"></div><p id="roomMessage" class="muted"></p></section></main><script src="./socket.io-client.js?v=4"></script><script src="./app.js?v=4"></script></body></html>
