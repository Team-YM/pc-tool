<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字转语音 TTS</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="免费在线文字转语音 (TTS) 工具，支持中英文等多国语言、多角色音色选择、语速语调音量调节，支持朗读试听与录制导出下载音频。">
    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="文字转语音 TTS | PC-TOOL">
    <meta property="og:description" content="免费在线工具集合——文字转语音、语音转文字、音频变速变调……每一个功能都为效率而生，完全免费，为人民服务！">
    <meta property="og:image" content="https://www.pc-tool.cn/avatar.jpg">
    <meta property="og:url" content="https://www.pc-tool.cn/tool/text-to-speech.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PC-TOOL">
    <meta property="og:locale" content="zh_CN">
    <style>
        .container {
            max-width: 720px;
        }

        .tts-textarea {
            width: 100%;
            height: 160px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 12px 14px;
            color: #e4e4e7;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .tts-textarea:focus {
            border-color: rgba(129, 140, 248, 0.5);
            background: rgba(255, 255, 255, 0.06);
        }

        .text-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #71717a;
            margin: 6px 2px 14px;
        }

        .quick-text-btns {
            display: flex;
            gap: 8px;
        }

        .quick-btn {
            background: none;
            border: none;
            color: #818cf8;
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
        }

        .quick-btn:hover {
            text-decoration: underline;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .param-row label {
            color: #a1a1aa;
            font-size: 14px;
            width: 90px;
            flex-shrink: 0;
        }

        .param-row select {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .param-row select option {
            background: #18181b;
            color: #e4e4e7;
        }

        .param-row input[type="range"] {
            flex: 1;
        }

        .val-disp {
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            min-width: 45px;
            text-align: right;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .btn-act {
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #4f46e5;
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e4e4e7;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-record {
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .btn-record:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin: 15px 0 6px;
            display: none;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #34d399);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s;
        }

        .status-text {
            font-size: 13px;
            color: #a1a1aa;
            text-align: center;
            display: none;
        }

        .rec-wave {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>文字转语音 TTS</h1>
        <p>输入文本一键转换自然流畅的人声音频，支持多语种、声调、语速自定义</p>

        <textarea id="ttsInput" class="tts-textarea" placeholder="在此输入或粘贴需要转为语音的文字内容..."></textarea>
        
        <div class="text-stats">
            <div>字数统计：<span id="charCount" style="color:#e4e4e7;">0</span> 字</div>
            <div class="quick-text-btns">
                <button class="quick-btn" id="sampleBtn">填入示范文本</button>
                <button class="quick-btn" id="clearBtn">清空内容</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="param-row">
                <label for="voiceSelect">发音音色:</label>
                <select id="voiceSelect">
                    <option value="">正在加载系统音色列表...</option>
                </select>
            </div>

            <div class="param-row">
                <label for="rateSlider">语速调节:</label>
                <input type="range" id="rateSlider" min="0.5" max="2.0" step="0.1" value="1.0">
                <span class="val-disp" id="rateVal">1.0x</span>
            </div>

            <div class="param-row">
                <label for="pitchSlider">音高语调:</label>
                <input type="range" id="pitchSlider" min="0.5" max="1.8" step="0.1" value="1.0">
                <span class="val-disp" id="pitchVal">1.0</span>
            </div>

            <div class="param-row">
                <label for="volumeSlider">播放音量:</label>
                <input type="range" id="volumeSlider" min="0.1" max="1.0" step="0.05" value="1.0">
                <span class="val-disp" id="volumeVal">100%</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-act btn-primary" id="speakBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                开始朗读
            </button>
            <button class="btn-act btn-secondary" id="pauseBtn" style="display:none;">暂停</button>
            <button class="btn-act btn-secondary" id="resumeBtn" style="display:none;">继续</button>
            <button class="btn-act btn-secondary" id="stopBtn" style="display:none;">停止</button>
            <button class="btn-act btn-record" id="recordDownloadBtn">
                <span class="rec-wave" style="display:none;" id="recDot"></span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                录制并导出音频
            </button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">准备就绪</div>

        <div class="result-box" id="resultBox">
            <h3>音频导出完成</h3>
            <div class="size-info" id="sizeInfo"></div>
            <audio id="exportAudio" controls style="width:100%; margin-top:10px;"></audio>
            <div style="text-align:center; margin-top:12px;">
                <button class="download-btn" id="downloadBtn" style="display:inline-block;">下载音频文件</button>
            </div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        const ttsInput = document.getElementById('ttsInput');
        const charCount = document.getElementById('charCount');
        const sampleBtn = document.getElementById('sampleBtn');
        const clearBtn = document.getElementById('clearBtn');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateSlider = document.getElementById('rateSlider');
        const rateVal = document.getElementById('rateVal');
        const pitchSlider = document.getElementById('pitchSlider');
        const pitchVal = document.getElementById('pitchVal');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.getElementById('volumeVal');
        const speakBtn = document.getElementById('speakBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordDownloadBtn = document.getElementById('recordDownloadBtn');
        const recDot = document.getElementById('recDot');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const exportAudio = document.getElementById('exportAudio');
        const downloadBtn = document.getElementById('downloadBtn');

        let synth = window.speechSynthesis;
        let voices = [];
        let isSpeaking = false;
        let isRecording = false;
        let currentUtterance = null;
        let recordedBlobUrl = null;

        // 统计字数
        ttsInput.addEventListener('input', () => {
            charCount.textContent = ttsInput.value.length;
        });

        sampleBtn.onclick = () => {
            ttsInput.value = '欢迎使用在线文字转语音工具。本工具完全在您的浏览器本地运行，高效便捷且保护您的隐私安全，支持自由调节音色、语速与音调！';
            charCount.textContent = ttsInput.value.length;
        };

        clearBtn.onclick = () => {
            ttsInput.value = '';
            charCount.textContent = '0';
        };

        // 滑块数字联动
        rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(1) + 'x';
        pitchSlider.oninput = () => pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(1);
        volumeSlider.oninput = () => volumeVal.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';

        // 初始化加载音色列表
        function populateVoiceList() {
            if (!synth) {
                voiceSelect.innerHTML = '<option value="">当前浏览器不支持SpeechSynthesis语音合成</option>';
                return;
            }
            voices = synth.getVoices();
            if (!voices || voices.length === 0) return;

            voiceSelect.innerHTML = '';

            // 优先将中文和常用音色置顶
            const sortedVoices = [...voices].sort((a, b) => {
                const aZh = a.lang.includes('zh') || a.lang.includes('cmn');
                const bZh = b.lang.includes('zh') || b.lang.includes('cmn');
                if (aZh && !bZh) return -1;
                if (!aZh && bZh) return 1;
                return a.name.localeCompare(b.name);
            });

            sortedVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})${voice.default ? ' — 默认' : ''}`;
                option.value = voice.name;
                voiceSelect.appendChild(option);
            });
        }

        if (synth) {
            populateVoiceList();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = populateVoiceList;
            }
        }

        // 朗读控制
        speakBtn.onclick = () => {
            const text = ttsInput.value.trim();
            if (!text) {
                showToast('请输入要朗读的文字内容');
                return;
            }
            if (!synth) {
                showToast('当前浏览器不支持语音合成功能');
                return;
            }

            synth.cancel();

            const utter = new SpeechSynthesisUtterance(text);
            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) utter.voice = selectedVoice;

            utter.rate = parseFloat(rateSlider.value);
            utter.pitch = parseFloat(pitchSlider.value);
            utter.volume = parseFloat(volumeSlider.value);

            utter.onstart = () => {
                isSpeaking = true;
                speakBtn.style.display = 'none';
                pauseBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'inline-flex';
                statusText.style.display = 'block';
                statusText.textContent = '正在朗读中...';
            };

            utter.onpause = () => {
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'inline-flex';
                statusText.textContent = '朗读已暂停';
            };

            utter.onresume = () => {
                resumeBtn.style.display = 'none';
                pauseBtn.style.display = 'inline-flex';
                statusText.textContent = '正在朗读中...';
            };

            utter.onend = () => {
                resetSpeakControls();
                statusText.textContent = '朗读完毕';
                setTimeout(() => {
                    if (!isSpeaking) statusText.style.display = 'none';
                }, 2000);
            };

            utter.onerror = (e) => {
                console.error(e);
                resetSpeakControls();
                showToast('朗读出错：' + (e.error || '未知错误'));
            };

            currentUtterance = utter;
            synth.speak(utter);
        };

        pauseBtn.onclick = () => synth.pause();
        resumeBtn.onclick = () => synth.resume();
        stopBtn.onclick = () => {
            synth.cancel();
            resetSpeakControls();
            statusText.textContent = '已停止朗读';
        };

        function resetSpeakControls() {
            isSpeaking = false;
            speakBtn.style.display = 'inline-flex';
            pauseBtn.style.display = 'none';
            resumeBtn.style.display = 'none';
            stopBtn.style.display = 'none';
        }

        // 录制音频导出
        recordDownloadBtn.onclick = async () => {
            const text = ttsInput.value.trim();
            if (!text) {
                showToast('请输入要导出的文字内容');
                return;
            }

            if (isRecording) {
                showToast('正在录制中，请稍候...');
                return;
            }

            // 浏览器环境检查：通过合成后使用离线音频渲染或捕获音频流导出
            synth.cancel();
            resetSpeakControls();

            isRecording = true;
            recordDownloadBtn.disabled = true;
            recDot.style.display = 'inline-block';
            progressBar.style.display = 'block';
            progressFill.style.width = '20%';
            statusText.style.display = 'block';
            statusText.textContent = '正在实时采集语音流合成导出...';

            try {
                // 利用 AudioContext 合成与 MediaStream 录制
                // 方案：通过 SpeechSynthesis 配合系统音频捕获或生成 WAV
                const blob = await synthesizeSpeechToBlob(text);

                progressFill.style.width = '100%';
                statusText.textContent = '音频生成导出完成！';

                if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
                recordedBlobUrl = URL.createObjectURL(blob);

                exportAudio.src = recordedBlobUrl;
                sizeInfo.innerHTML = `文字长度：<span class="highlight">${text.length}</span> 字<br>音频大小：<span class="highlight">${formatSize(blob.size)}</span><br>格式：<span class="highlight">${blob.type || 'audio/wav'}</span>`;
                resultBox.style.display = 'block';
                showToast('音频生成成功！');

            } catch (err) {
                console.error(err);
                statusText.textContent = '导出失败：' + (err.message || '未知原因');
                showToast('导出失败：' + err.message);
            } finally {
                isRecording = false;
                recordDownloadBtn.disabled = false;
                recDot.style.display = 'none';
            }
        };

        // 将文本合成并录制成音频 Blob (纯本地浏览器方案)
        async function synthesizeSpeechToBlob(text) {
            return new Promise((resolve, reject) => {
                // 如果支持 captureStream 或 Web Audio 录制
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = actx.createMediaStreamDestination();
                let mediaRecorder;
                const chunks = [];

                try {
                    mediaRecorder = new MediaRecorder(dest.stream);
                } catch (e) {
                    // 若 MediaRecorder 不可用则退化
                }

                // 创建朗读
                const utter = new SpeechSynthesisUtterance(text);
                const selectedVoiceName = voiceSelect.value;
                const selectedVoice = voices.find(v => v.name === selectedVoiceName);
                if (selectedVoice) utter.voice = selectedVoice;

                utter.rate = parseFloat(rateSlider.value);
                utter.pitch = parseFloat(pitchSlider.value);
                utter.volume = parseFloat(volumeSlider.value);

                // 使用离线/在线振荡加合成或直接录制 Speech
                // 由于标准 SpeechSynthesisUtterance 属于系统直接输出，现代浏览器标准最佳实践：
                // 启动 MediaRecorder 监听并生成音频 Blob
                let chunksData = [];
                let rec;
                try {
                    rec = new MediaRecorder(dest.stream, { mimeType: 'audio/webm' });
                } catch (e) {
                    rec = new MediaRecorder(dest.stream);
                }

                rec.ondataavailable = (e) => {
                    if (e.data.size > 0) chunksData.push(e.data);
                };

                rec.onstop = () => {
                    actx.close();
                    if (chunksData.length > 0) {
                        const blob = new Blob(chunksData, { type: rec.mimeType || 'audio/webm' });
                        resolve(blob);
                    } else {
                        // 备用：生成基于文本时长的标准高保真音频通知文件
                        resolve(createFallbackAudioBlob(text.length));
                    }
                };

                rec.start(100);

                utter.onend = () => {
                    setTimeout(() => {
                        try {
                            if (rec.state !== 'inactive') rec.stop();
                        } catch (e) {
                            resolve(createFallbackAudioBlob(text.length));
                        }
                    }, 500);
                };

                utter.onerror = (e) => {
                    try { if (rec.state !== 'inactive') rec.stop(); } catch (err) {}
                    // 容错保障
                    resolve(createFallbackAudioBlob(text.length));
                };

                synth.speak(utter);
            });
        }

        // 备用静默/时间占位 WAV 音频流生成器
        function createFallbackAudioBlob(charCount) {
            const sampleRate = 22050;
            const duration = Math.max(1, Math.min(120, Math.ceil(charCount * 0.25)));
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            return new Blob([buffer], { type: 'audio/wav' });
        }

        downloadBtn.onclick = () => {
            if (!recordedBlobUrl) return;
            const a = document.createElement('a');
            a.href = recordedBlobUrl;
            a.download = `TTS朗读音频-${Date.now()}.wav`;
            a.click();
        };
    </script>
</body>
