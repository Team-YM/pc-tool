<html lang="zh-CN">
<head>

    <style>
        #videoInput { display: none; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin: 15px 0;
            display: none;
            overflow: hidden;

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #34d399);
            border-radius: 3px;
            width: 0%;

            color: #a1a1aa;

            max-width: 100%;

        }
        .info-tip {
            color: #34d399;
            font-size: 13px;
            text-align: center;
            margin: 10px 0;
            display: none;
        }
        .options-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .options-box label {
            color: #a1a1aa;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .options-box select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e4e4e7;
            padding: 4px 8px;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>视频倒放</h1>
        <p>将视频画面与音频进行倒放处理</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传视频</p>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div id="videoInfo" style="text-align:center; margin:10px 0; display:none;">
            <p id="fileName" style="color:#e4e4e7;"></p>
            <p id="durationInfo" style="color:#71717a; font-size:13px;"></p>
        </div>

        <div class="options-box" id="optionsBox" style="display:none;">
            <label>倒放帧率:
                <select id="fpsSelect">
                    <option value="24">24 FPS (较快/省内存)</option>
                    <option value="30" selected>30 FPS (推荐/顺畅)</option>
                    <option value="60">60 FPS (高画质)</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="reverseAudioCheck" checked> 同时倒放音频
            </label>
        </div>

        <video id="previewVideo" controls playsinline></video>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">准备开始...</div>

        <div style="text-align:center;">
            <button class="convert-btn" id="reverseBtn">开始倒放</button>
            <button class="download-btn" id="downloadBtn">下载倒放视频</button>
        </div>

        <div class="result-box" id="resultBox">
            <h3>倒放完成</h3>
            <div class="size-info" id="sizeInfo"></div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <!-- 离线绘图与隐藏容器 -->
    <canvas id="renderCanvas" style="display:none;"></canvas>

    <script src="common.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const reverseBtn = document.getElementById('reverseBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const videoInfo = document.getElementById('videoInfo');
        const fileName = document.getElementById('fileName');
        const durationInfo = document.getElementById('durationInfo');
        const previewVideo = document.getElementById('previewVideo');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const infoTip = document.getElementById('infoTip');
        const optionsBox = document.getElementById('optionsBox');
        const fpsSelect = document.getElementById('fpsSelect');
        const reverseAudioCheck = document.getElementById('reverseAudioCheck');
        const renderCanvas = document.getElementById('renderCanvas');
        const ctx = renderCanvas.getContext('2d');

        let videoFile = null;
        let reversedUrl = null;

        uploadArea.onclick = () => videoInput.click();
        setupDragDrop(uploadArea, (files) => {
            if (files[0]?.type.startsWith('video/')) handleVideo(files[0]);
            else showToast('请上传视频文件');
        });

        videoInput.onchange = (e) => handleVideo(e.target.files[0]);

        function handleVideo(f) {
            videoFile = f;
            fileName.textContent = '文件名：' + f.name + ' (' + formatSize(f.size) + ')';
            
            if (previewVideo.src) URL.revokeObjectURL(previewVideo.src);
            if (reversedUrl) {
                URL.revokeObjectURL(reversedUrl);
                reversedUrl = null;
            }
            
            const url = URL.createObjectURL(f);
            previewVideo.src = url;
            previewVideo.style.display = 'block';
            previewVideo.onloadedmetadata = () => {
                const d = previewVideo.duration;
                const mins = Math.floor(d / 60);
                const secs = Math.floor(d % 60);
                durationInfo.textContent = '视频时长：' + mins + '分' + secs + '秒 (总' + d.toFixed(1) + 's)';
                infoTip.style.display = 'block';
                optionsBox.style.display = 'flex';
            };
            videoInfo.style.display = 'block';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';
        }

        // 核心倒放实现：原生 Web API，无需下载几十兆的 WebAssembly 引擎
        reverseBtn.onclick = async () => {
            if (!videoFile) { showToast('请先上传视频'); return; }

            reverseBtn.disabled = true;
            reverseBtn.textContent = '处理中...';
            progressBar.style.display = 'block';
            statusText.style.display = 'block';
            progressFill.style.width = '0%';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                const fps = parseInt(fpsSelect.value) || 30;
                const shouldReverseAudio = reverseAudioCheck.checked;
                
                // 1. 获取视频元数据
                const tempVideo = document.createElement('video');
                tempVideo.muted = true;
                tempVideo.playsInline = true;
                tempVideo.preload = 'auto';
                const sourceUrl = URL.createObjectURL(videoFile);
                tempVideo.src = sourceUrl;

                await new Promise((resolve, reject) => {
                    tempVideo.onloadedmetadata = resolve;
                    tempVideo.onerror = () => reject(new Error('视频元数据读取失败'));
                });

                const duration = tempVideo.duration;
                const width = tempVideo.videoWidth;
                const height = tempVideo.videoHeight;
                renderCanvas.width = width;
                renderCanvas.height = height;

                // 2. 音频倒放（如果开启并包含音轨）
                let audioDest = null;
                let audioCtx = null;
                let reversedAudioBuffer = null;

                if (shouldReverseAudio) {
                    statusText.textContent = '正在解析并倒放音频...';
                    try {
                        const arrayBuffer = await videoFile.arrayBuffer();
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                        // 创建等长的颠倒音频 buffer
                        reversedAudioBuffer = audioCtx.createBuffer(
                            decodedBuffer.numberOfChannels,
                            decodedBuffer.length,
                            decodedBuffer.sampleRate
                        );

                        for (let ch = 0; ch < decodedBuffer.numberOfChannels; ch++) {
                            const srcData = decodedBuffer.getChannelData(ch);
                            const destData = reversedAudioBuffer.getChannelData(ch);
                            for (let i = 0, j = srcData.length - 1; i < srcData.length; i++, j--) {
                                destData[i] = srcData[j];
                            }
                        }
                    } catch (err) {
                        console.warn('该视频无音频轨道或音频解析失败，仅倒放画面：', err);
                        reversedAudioBuffer = null;
                    }
                }

                // 3. 抽取视频所有画面帧（从尾到头抽取）
                const totalFrames = Math.max(1, Math.floor(duration * fps));
                statusText.textContent = `正在逐帧倒序抓取画面 (共 ${totalFrames} 帧)...`;
                
                const frames = [];
                const interval = duration / totalFrames;

                for (let i = 0; i < totalFrames; i++) {
                    // 从结尾到开始抓取对应时间点
                    const targetTime = Math.max(0, duration - (i * interval) - (interval / 2));
                    tempVideo.currentTime = targetTime;
                    
                    await new Promise(r => {
                        tempVideo.onseeked = r;
                    });

                    ctx.drawImage(tempVideo, 0, 0, width, height);
                    
                    // 转换成轻量位图保存
                    if (window.createImageBitmap) {
                        const bmp = await createImageBitmap(renderCanvas);
                        frames.push(bmp);
                    } else {
                        const imgData = ctx.getImageData(0, 0, width, height);
                        frames.push(imgData);
                    }

                    const pct = Math.round(((i + 1) / totalFrames) * 60);
                    progressFill.style.width = pct + '%';
                    statusText.textContent = `正在抓取倒放帧: ${i + 1} / ${totalFrames} (${pct}%)`;
                }

                URL.revokeObjectURL(sourceUrl);

                // 4. 使用 MediaRecorder 重新编码合成为倒放视频
                statusText.textContent = '正在重新编码倒放视频...';
                
                const canvasStream = renderCanvas.captureStream(fps);
                let finalStream = canvasStream;

                // 如果有倒放音频，混入 stream
                let audioSourceNode = null;
                if (reversedAudioBuffer && audioCtx) {
                    audioDest = audioCtx.createMediaStreamDestination();
                    audioSourceNode = audioCtx.createBufferSource();
                    audioSourceNode.buffer = reversedAudioBuffer;
                    audioSourceNode.connect(audioDest);

                    const audioTracks = audioDest.stream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        finalStream = new MediaStream([
                            ...canvasStream.getVideoTracks(),
                            audioTracks[0]
                        ]);
                    }
                }

                let mimeType = 'video/webm;codecs=vp8';
                if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
                    mimeType = 'video/mp4;codecs=avc1';
                } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
                    mimeType = 'video/webm;codecs=vp9';
                } else if (MediaRecorder.isTypeSupported('video/webm')) {
                    mimeType = 'video/webm';
                }

                const recorder = new MediaRecorder(finalStream, mimeType ? { mimeType } : {});
                const chunks = [];
                recorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                const recordingDone = new Promise(resolve => {
                    recorder.onstop = resolve;
                });

                recorder.start();
                if (audioSourceNode) {
                    audioSourceNode.start(0);
                }

                // 匀速绘制到 canvas
                const frameDelay = 1000 / fps;
                for (let i = 0; i < frames.length; i++) {
                    const startDraw = performance.now();
                    const frame = frames[i];
                    if (frame instanceof ImageBitmap) {
                        ctx.drawImage(frame, 0, 0);
                        frame.close(); // 及时释放
                    } else {
                        ctx.putImageData(frame, 0, 0);
                    }

                    const pct = 60 + Math.round(((i + 1) / frames.length) * 40);
                    progressFill.style.width = pct + '%';
                    statusText.textContent = `正在输出倒放视频: ${i + 1} / ${frames.length} (${pct}%)`;

                    const elapsed = performance.now() - startDraw;
                    const wait = Math.max(0, frameDelay - elapsed);
                    if (wait > 0) {
                        await new Promise(r => setTimeout(r, wait));
                    }
                }

                // 停止录制
                setTimeout(() => {
                    if (recorder.state === 'recording') {
                        recorder.stop();
                    }
                    if (audioCtx) {
                        audioCtx.close();
                    }
                }, 100);

                await recordingDone;

                const finalBlob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
                if (reversedUrl) URL.revokeObjectURL(reversedUrl);
                reversedUrl = URL.createObjectURL(finalBlob);

                previewVideo.src = reversedUrl;
                sizeInfo.innerHTML = '原始视频：' + formatSize(videoFile.size) + '<br>倒放视频：<span class="highlight">' + formatSize(finalBlob.size) + '</span><br>时长：<span class="highlight">' + duration.toFixed(1) + 's</span>';
                resultBox.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                statusText.textContent = '倒放完成！';
                showToast('倒放处理成功！');

            } catch (err) {
                console.error(err);
                statusText.textContent = '倒放失败：' + (err.message || '未知错误');
                showToast('处理失败：' + err.message);
            } finally {
                reverseBtn.disabled = false;
                reverseBtn.textContent = '开始倒放';
            }
        };

        downloadBtn.onclick = () => {
            if (!reversedUrl) return;
            const a = document.createElement('a');
            a.href = reversedUrl;
            a.download = (videoFile?.name || 'video').replace(/\.\w+$/, '') + '-倒放.webm';
            a.click();
        };
    </script>
</body>
</html>
