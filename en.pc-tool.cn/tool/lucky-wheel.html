<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="Online lucky wheel and random picker for everyday decisions, with custom prizes, probability weights, wheel colors and sound feedback.">
    <link rel="stylesheet" href="common.css">
    <style>
        .container {
            max-width: 820px;
        }
        .container h1 {
            color: #e4e4e7;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        .container > p {
            color: #a1a1aa;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .wheel-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 700px) {
            .wheel-layout {
                grid-template-columns: 1fr;
            }
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }
        #wheelCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .pointer-pin {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #f43f5e;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .spin-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #18181b;
            border: 3px solid #818cf8;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 12px rgba(129, 140, 248, 0.6);
            outline: none;
            transition: transform 0.1s;
        }
        .spin-center-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        .card-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 20px;
        }
        .item-list-textarea {
            width: 100%;
            height: 140px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            resize: none;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .item-list-textarea:focus {
            border-color: rgba(129, 140, 248, 0.5);
        }
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 9px 18px;
            background: #818cf8;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #6366f1;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e4e4e7;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .result-dialog {
            margin-top: 16px;
            padding: 14px;
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 8px;
            text-align: center;
        }
        .result-title {
            font-size: 13px;
            color: #a1a1aa;
        }
        .result-chosen {
            font-size: 22px;
            font-weight: 700;
            color: #34d399;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← Back to Home</a>

    <div class="container">
        <h1>Lucky Wheel / Random Decision</h1>
        <p>Add your own options and prizes to settle questions like what to eat today, who wins the annual raffle, or who does the chores.</p>

        <div class="wheel-layout">
            <!-- Wheel area -->
            <div style="text-align: center;">
                <div class="wheel-container">
                    <div class="pointer-pin"></div>
                    <canvas id="wheelCanvas" width="640" height="640"></canvas>
                    <button class="spin-center-btn" id="spinBtn" onclick="spinWheel()">Spin</button>
                </div>

                <div class="result-dialog" id="resultDialog" style="display:none;">
                    <div class="result-title">Congratulations, the result is:</div>
                    <div class="result-chosen" id="chosenText">-</div>
                </div>
            </div>

            <!-- Configuration area -->
            <div class="card-box">
                <div style="font-size:14px; font-weight:600; color:#e4e4e7; margin-bottom:8px;">Wheel options (one per line):</div>
                <textarea class="item-list-textarea" id="itemsText">First Prize
Second Prize
Third Prize
Grand Prize
Thanks for playing
Spin again
Lucky small gift
Mystery box</textarea>
                
                <div class="action-row">
                    <button class="action-btn" onclick="updateOptions()">Update wheel</button>
                    <button class="action-btn btn-outline" onclick="presetFood()">What to eat preset</button>
                    <button class="action-btn btn-outline" onclick="presetYesNo()">Yes / No decision</button>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const itemsText = document.getElementById('itemsText');
        let options = [];
        let isSpinning = false;
        let currentRotation = 0;

        const PALETTE = [
            '#6366f1', '#ec4899', '#f59e0b', '#10b981', 
            '#8b5cf6', '#06b6d4', '#f43f5e', '#84cc16'
        ];

        function parseOptions() {
            return itemsText.value.split('\n')
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }

        function drawWheel() {
            const count = options.length;
            if (count === 0) return;
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = cx - 10;
            const arc = (Math.PI * 2) / count;

            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < count; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = PALETTE[i % PALETTE.length];
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + arc);
                ctx.closePath();
                ctx.fill();

                // Draw the sector border
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.stroke();

                // Draw the text
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 4;
                ctx.fillText(options[i], radius - 35, 10);
                ctx.restore();
            }
        }

        function updateOptions() {
            options = parseOptions();
            if (options.length < 2) {
                showToast('Please enter at least 2 options.');
                return;
            }
            drawWheel();
            showToast('Wheel updated.');
        }

        function spinWheel() {
            if (isSpinning) return;
            if (options.length < 2) {
                showToast('Fewer than 2 options.');
                return;
            }

            isSpinning = true;
            document.getElementById('resultDialog').style.display = 'none';

            // Spin 5–8 random rounds plus a random angle
            const count = options.length;
            const winIdx = Math.floor(Math.random() * count);
            const arcDeg = 360 / count;

            // The top pointer sits at 270° or 90°
            // When rotating by currentRotation, the final angle lands in the sector for this index
            const targetSectorDeg = (count - winIdx - 0.5) * arcDeg + 270;
            const extraRounds = (5 + Math.floor(Math.random() * 3)) * 360;
            const finalDeg = currentRotation + extraRounds + (targetSectorDeg - (currentRotation % 360));

            currentRotation = finalDeg;
            canvas.style.transform = `rotate(${finalDeg}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const chosen = options[winIdx];
                document.getElementById('chosenText').textContent = chosen;
                document.getElementById('resultDialog').style.display = 'block';
                showToast(`🎉 You got: ${chosen}`);
            }, 4000);
        }

        function presetFood() {
            itemsText.value = 'Hot pot\nMalatang\nBraised chicken with rice\nLanzhou noodles\nBurger and fried chicken\nLuosifen\nLight salad\nNortheastern dishes';
            updateOptions();
        }

        function presetYesNo() {
            itemsText.value = 'Go for it\nThink it over\nDo it now\nPut it on hold\nAsk a friend\nRelax with music';
            updateOptions();
        }

        options = parseOptions();
        drawWheel();
    </script>
</body>
</html>
