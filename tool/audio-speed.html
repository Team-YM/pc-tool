    <style>
        .container {
            max-width: 680px;

        #audioInput { display: none; }

        .speed-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            background: rgba(255, 255, 255, 0.04);

            display: flex;
            align-items: center;
            justify-content: space-between;

            flex-wrap: wrap;
        }

        .options-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .options-row select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e4e4e7;

<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>音频变速</h1>
        <p>支持 0.25x 至 4.0x 音频快放与慢放，可选择保持音调或自然变调</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传音频文件</p>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div id="audioMeta" style="text-align:center; margin:10px 0; display:none;">
            <p id="fileName" style="color:#e4e4e7; font-size:14px;"></p>
            <p id="durationInfo" style="color:#71717a; font-size:13px;"></p>
        </div>

        <div id="settingsBox" style="display:none;">
            <div class="speed-presets">
                <button class="speed-btn" data-speed="0.5">0.5x (慢放)</button>
                <button class="speed-btn" data-speed="0.75">0.75x</button>
                <button class="speed-btn active" data-speed="1.0">1.0x (原速)</button>
                <button class="speed-btn" data-speed="1.25">1.25x</button>

                <button class="speed-btn" data-speed="3.0">3.0x</button>
            </div>

            <div class="slider-box">
                <div class="slider-row">
                    <label>倍速调节:</label>
                    <input type="range" id="speedSlider" min="0.25" max="4.0" step="0.05" value="1.0">
                    <span class="speed-val-display" id="speedDisplay">1.00x</span>

                <div class="options-row">

                        <input type="checkbox" id="preservePitchCheck" checked> 保持原始音调 (保调变速)
                    </label>
                    <label>导出格式:
                        <select id="outputFormat">
                            <option value="wav" selected>WAV 格式 (无损/推荐)</option>
                            <option value="mp3">MP3 格式 (体积小)</option>
                        </select>

            <div class="preview-box" id="previewBox">

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>

        <div style="text-align:center; margin-top:16px;">
            <button class="convert-btn" id="startBtn" style="display:none;">开始变速导出</button>
            <button class="download-btn" id="downloadBtn">下载变速音频</button>
        </div>

        <div class="result-box" id="resultBox">
            <h3>音频变速导出完成</h3>
            <div class="size-info" id="sizeInfo"></div>
            <audio id="resultAudio" controls style="width:100%; margin-top:10px;"></audio>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const audioInput = document.getElementById('audioInput');
        const audioMeta = document.getElementById('audioMeta');
        const fileName = document.getElementById('fileName');
        const durationInfo = document.getElementById('durationInfo');
        const settingsBox = document.getElementById('settingsBox');
        const speedButtons = document.querySelectorAll('.speed-btn');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const preservePitchCheck = document.getElementById('preservePitchCheck');
        const outputFormat = document.getElementById('outputFormat');
        const targetDurationTip = document.getElementById('targetDurationTip');
        const previewBox = document.getElementById('previewBox');
        const previewAudio = document.getElementById('previewAudio');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const resultAudio = document.getElementById('resultAudio');

        let audioFile = null;
        let originalDuration = 0;
        let currentSpeed = 1.0;
        let exportedBlobUrl = null;
        let isProcessing = false;

        uploadArea.onclick = () => audioInput.click();
        setupDragDrop(uploadArea, (files) => {
            const f = files[0];
            if (f && (f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/i.test(f.name))) {
                handleAudio(f);
            } else {
                showToast('请上传有效的音频文件');
            }
        });

        audioInput.onchange = (e) => {
            if (e.target.files[0]) handleAudio(e.target.files[0]);
        };

        function handleAudio(file) {
            audioFile = file;
            fileName.textContent = `文件：${file.name} (${formatSize(file.size)})`;
            audioMeta.style.display = 'block';

            if (previewAudio.src) URL.revokeObjectURL(previewAudio.src);
            if (exportedBlobUrl) {
                URL.revokeObjectURL(exportedBlobUrl);
                exportedBlobUrl = null;
            }

            previewAudio.src = URL.createObjectURL(file);
            previewBox.style.display = 'block';
            settingsBox.style.display = 'block';
            startBtn.style.display = 'inline-block';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            previewAudio.onloadedmetadata = () => {
                originalDuration = previewAudio.duration;
                const m = Math.floor(originalDuration / 60);
                const s = Math.floor(originalDuration % 60);
                durationInfo.textContent = `原音频时长：${m}分${s}秒 (${originalDuration.toFixed(1)}s)`;
                updateSpeedDisplay();
            };
        }

        speedButtons.forEach(btn => {
            btn.onclick = () => {
                speedButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSpeed = parseFloat(btn.dataset.speed);
                speedSlider.value = currentSpeed;
                updateSpeedDisplay();
            };
        });

        speedSlider.oninput = () => {
            currentSpeed = parseFloat(speedSlider.value);
            speedButtons.forEach(b => {
                b.classList.toggle('active', parseFloat(b.dataset.speed) === currentSpeed);
            });
            updateSpeedDisplay();
        };

        preservePitchCheck.onchange = () => {
            previewAudio.preservesPitch = preservePitchCheck.checked;
        };

        function updateSpeedDisplay() {
            speedDisplay.textContent = currentSpeed.toFixed(2) + 'x';
            previewAudio.playbackRate = currentSpeed;
            previewAudio.preservesPitch = preservePitchCheck.checked;

            if (originalDuration > 0) {
                const targetSec = originalDuration / currentSpeed;
                const m = Math.floor(targetSec / 60);
                const s = Math.floor(targetSec % 60);
                targetDurationTip.textContent = `预计变速后时长：约 ${m}分${s}秒 (${targetSec.toFixed(1)}s)`;
            }
        }

        startBtn.onclick = async () => {
            if (!audioFile || isProcessing) return;
            isProcessing = true;

            startBtn.disabled = true;
            startBtn.textContent = '处理中...';
            progressBar.style.display = 'block';
            statusText.style.display = 'block';
            progressFill.style.width = '10%';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                const speed = currentSpeed;
                const preservePitch = preservePitchCheck.checked;

                statusText.textContent = '正在解析音频数据...';
                const arrayBuffer = await audioFile.arrayBuffer();
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const decodedBuffer = await actx.decodeAudioData(arrayBuffer);
                actx.close();

                progressFill.style.width = '35%';
                statusText.textContent = '正在进行高质量音频变速算法处理...';

                // 基于 Web Worker 或异步分段处理音频时间拉伸
                let finalBuffer;
                if (Math.abs(speed - 1.0) < 0.001) {
                    finalBuffer = decodedBuffer;
                } else if (!preservePitch) {
                    // 自然变速（变频）重采样
                    finalBuffer = resampleSpeed(decodedBuffer, speed);
                } else {
                    // 保调变速：SOLA (Synchronized Overlap-Add) 算法
                    finalBuffer = await solaTimeStretch(decodedBuffer, speed, (p) => {
                        progressFill.style.width = `${35 + p * 40}%`;
                    });
                }

                progressFill.style.width = '80%';
                statusText.textContent = '正在编码音频...';

                let blob;
                const fmt = outputFormat.value;
                if (fmt === 'wav') {
                    blob = audioBufferToWavBlob(finalBuffer);
                } else {
                    blob = encodeMP3(finalBuffer);
                }

                progressFill.style.width = '100%';
                statusText.textContent = '变速处理完成！';

                if (exportedBlobUrl) URL.revokeObjectURL(exportedBlobUrl);
                exportedBlobUrl = URL.createObjectURL(blob);

                resultAudio.src = exportedBlobUrl;
                sizeInfo.innerHTML = `原始文件：${formatSize(audioFile.size)} (${originalDuration.toFixed(1)}s)<br>变速文件：<span class="highlight">${formatSize(blob.size)}</span> (${finalBuffer.duration.toFixed(1)}s)<br>倍速：<span class="highlight">${speed.toFixed(2)}x</span> (保调：${preservePitch ? '是' : '否'})`;
                resultBox.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                showToast('音频变速成功！');

            } catch (err) {
                console.error(err);
                statusText.textContent = '处理失败：' + (err.message || '未知错误');
                showToast('处理失败：' + err.message);
            } finally {
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.textContent = '开始变速导出';
            }
        };

        // 自然变速（重新采样重构波形）
        function resampleSpeed(buffer, speed) {
            const numChannels = buffer.numberOfChannels;
            const origLen = buffer.length;
            const newLen = Math.floor(origLen / speed);
            const sampleRate = buffer.sampleRate;

            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const outBuffer = actx.createBuffer(numChannels, newLen, sampleRate);
            actx.close();

            for (let ch = 0; ch < numChannels; ch++) {
                const src = buffer.getChannelData(ch);
                const dst = outBuffer.getChannelData(ch);
                for (let i = 0; i < newLen; i++) {
                    const srcPos = i * speed;
                    const i0 = Math.floor(srcPos);
                    const i1 = Math.min(i0 + 1, origLen - 1);
                    const frac = srcPos - i0;
                    dst[i] = src[i0] * (1 - frac) + src[i1] * frac;
                }
            }
            return outBuffer;
        }

        // SOLA (Synchronized Overlap-Add) 保调变速纯前端算法
        async function solaTimeStretch(buffer, speed, onProgress) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const origLen = buffer.length;

            // 窗口配置
            const winSize = Math.floor(sampleRate * 0.04); // 40ms 窗口
            const synHop = Math.floor(winSize / 2);         // 20ms 合成步长
            const anaHop = Math.floor(synHop * speed);     // 分析步长

            const targetLen = Math.floor(origLen / speed);
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const outBuffer = actx.createBuffer(numChannels, targetLen, sampleRate);
            actx.close();

            // 汉宁窗
            const windowFunc = new Float32Array(winSize);
            for (let i = 0; i < winSize; i++) {
                windowFunc[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (winSize - 1)));
            }

            const maxSearch = Math.floor(sampleRate * 0.015); // 15ms 搜索范围
            const outChannels = [];
            const srcChannels = [];
            for (let ch = 0; ch < numChannels; ch++) {
                outChannels.push(outBuffer.getChannelData(ch));
                srcChannels.push(buffer.getChannelData(ch));
            }

            const totalSteps = Math.floor((origLen - winSize - maxSearch) / anaHop);
            let anaPos = 0;
            let synPos = 0;

            for (let step = 0; step < totalSteps; step++) {
                if (step % 40 === 0) {
                    onProgress(step / totalSteps);
                    await new Promise(r => setTimeout(r, 0)); // 让出主线程避免卡顿
                }

                // 计算相关性找最佳重叠点 (只用第一声道或单声道加速相关性查找)
                let bestOffset = 0;
                if (synPos > 0 && anaPos > 0) {
                    let maxCorr = -Infinity;
                    const ref = srcChannels[0];
                    for (let delta = -maxSearch; delta <= maxSearch; delta++) {
                        const testPos = anaPos + delta;
                        if (testPos < 0 || testPos + winSize >= origLen) continue;
                        let corr = 0;
                        for (let k = 0; k < synHop; k += 2) {
                            corr += ref[testPos + k] * outChannels[0][synPos + k];
                        }
                        if (corr > maxCorr) {
                            maxCorr = corr;
                            bestOffset = delta;
                        }
                    }
                }

                const actualAnaPos = anaPos + bestOffset;

                // 叠加各声道
                for (let ch = 0; ch < numChannels; ch++) {
                    const src = srcChannels[ch];
                    const dst = outChannels[ch];
                    for (let i = 0; i < winSize; i++) {
                        if (synPos + i >= targetLen) break;
                        const sVal = actualAnaPos + i < origLen ? src[actualAnaPos + i] : 0;
                        if (i < synHop && synPos > 0) {
                            const w = i / synHop;
                            dst[synPos + i] = dst[synPos + i] * (1 - w) + sVal * w;
                        } else {
                            dst[synPos + i] = sVal;
                        }
                    }
                }

                anaPos += anaHop;
                synPos += synHop;
                if (synPos >= targetLen) break;
            }

            return outBuffer;
        }

        function audioBufferToWavBlob(buffer) {
            const numChannels = buffer.numberOfChannels;
            const length = buffer.length;
            const sampleRate = buffer.sampleRate;
            const bitsPerSample = 16;
            const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
            const blockAlign = (numChannels * bitsPerSample) / 8;
            const dataSize = (length * numChannels * bitsPerSample) / 8;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;
            const arrayBuffer = new ArrayBuffer(totalSize);
            const view = new DataView(arrayBuffer);

            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            }

            writeString(0, 'RIFF');
            view.setUint32(4, totalSize - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function encodeMP3(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length;

            const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
            const mp3Data = [];
            const blockSize = 1152;

            const left = new Int16Array(length);
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, buffer.getChannelData(0)[i]));
                left[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }

            if (numChannels === 1) {
                for (let i = 0; i < length; i += blockSize) {
                    const chunk = left.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            } else {
                const right = new Int16Array(length);
                for (let i = 0; i < length; i++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(1)[i]));
                    right[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                }
                for (let i = 0; i < length; i += blockSize) {
                    const chunkL = left.subarray(i, i + blockSize);
                    const chunkR = right.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunkL, chunkR);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            }

            const finalBuf = mp3encoder.flush();
            if (finalBuf.length > 0) mp3Data.push(finalBuf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        downloadBtn.onclick = () => {
            if (!exportedBlobUrl) return;
            const a = document.createElement('a');
            a.href = exportedBlobUrl;
            const ext = outputFormat.value;
            a.download = (audioFile?.name || 'audio').replace(/\.\w+$/, '') + `-${currentSpeed.toFixed(2)}x.` + ext;
            a.click();
        };
    </script>
