<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码 / UUID 生成器 | PC-TOOL</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="在线高强度随机密码生成器与 UUID/GUID (v4) 批量生成工具，纯本地加密级真随机数，安全无泄露。">
    <link rel="stylesheet" href="common.css">
    <style>
        .container {
            max-width: 760px;
        }
        .container h1 {
            color: #e4e4e7;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        .container > p {
            color: #a1a1aa;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .tab-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: #a1a1aa;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-weight: 600;
        }
        .option-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .option-label {
            font-size: 14px;
            color: #e4e4e7;
        }
        .range-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .range-wrap input[type="range"] {
            width: 160px;
            accent-color: #818cf8;
            cursor: pointer;
        }
        .range-val {
            font-family: monospace;
            color: #818cf8;
            font-weight: 600;
            min-width: 28px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .checkbox-group input {
            cursor: pointer;
            accent-color: #818cf8;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #818cf8;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .action-btn:hover {
            background: #6366f1;
        }
        .result-box-custom {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .result-item {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Consolas, Monaco, monospace;
            font-size: 15px;
            color: #34d399;
            word-break: break-all;
        }
        .copy-tag-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e4e4e7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 12px;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .copy-tag-btn:hover {
            background: rgba(129, 140, 248, 0.25);
            color: #a5b4fc;
        }
        .batch-output {
            width: 100%;
            height: 160px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 14px;
            color: #34d399;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            font-family: Consolas, Monaco, monospace;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← 返回首页</a>

    <div class="container">
        <h1>随机密码 / UUID 生成器</h1>
        <p>基于 Web Crypto API 加密级硬件随机源，秒级生成安全密码与标准 UUID/GUID。</p>

        <div class="tab-switch">
            <button class="tab-btn active" id="tabPassword">高强度随机密码</button>
            <button class="tab-btn" id="tabUuid">UUID / GUID 生成</button>
        </div>

        <!-- 密码配置 -->
        <div id="passwordSection">
            <div class="option-panel">
                <div class="option-row">
                    <span class="option-label">密码长度：</span>
                    <div class="range-wrap">
                        <input type="range" id="passLen" min="6" max="64" value="16">
                        <span class="range-val" id="passLenVal">16</span>
                    </div>
                </div>
                <div class="option-row">
                    <span class="option-label">生成数量：</span>
                    <div class="range-wrap">
                        <input type="range" id="passCount" min="1" max="20" value="5">
                        <span class="range-val" id="passCountVal">5</span>
                    </div>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="chkUpper" checked> 大写字母 (A-Z)</label>
                    <label><input type="checkbox" id="chkLower" checked> 小写字母 (a-z)</label>
                    <label><input type="checkbox" id="chkNum" checked> 数字 (0-9)</label>
                    <label><input type="checkbox" id="chkSpecial" checked> 特殊符号 (!@#$%^&*)</label>
                    <label><input type="checkbox" id="chkExclude"> 排除易混淆字符 (l, 1, I, o, 0, O)</label>
                </div>
            </div>
            <button class="action-btn" id="genPassBtn">生成随机密码</button>
            <div class="result-box-custom" id="passResults"></div>
        </div>

        <!-- UUID 配置 -->
        <div id="uuidSection" style="display:none;">
            <div class="option-panel">
                <div class="option-row">
                    <span class="option-label">生成数量：</span>
                    <div class="range-wrap">
                        <input type="range" id="uuidCount" min="1" max="50" value="5">
                        <span class="range-val" id="uuidCountVal">5</span>
                    </div>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="uuidUpper"> 转换为大写</label>
                    <label><input type="checkbox" id="uuidNoHyphen"> 去除横杠 (-)</label>
                </div>
            </div>
            <button class="action-btn" id="genUuidBtn">生成 UUID (v4)</button>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:13px; color:#a1a1aa;">批量结果：</span>
                <button class="copy-tag-btn" id="copyAllUuidBtn" style="margin:0;">复制全部</button>
            </div>
            <textarea class="batch-output" id="uuidOutput" readonly placeholder="UUID 生成结果..."></textarea>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        const tabPassword = document.getElementById('tabPassword');
        const tabUuid = document.getElementById('tabUuid');
        const passwordSection = document.getElementById('passwordSection');
        const uuidSection = document.getElementById('uuidSection');

        tabPassword.onclick = () => {
            tabPassword.classList.add('active');
            tabUuid.classList.remove('active');
            passwordSection.style.display = 'block';
            uuidSection.style.display = 'none';
        };

        tabUuid.onclick = () => {
            tabUuid.classList.add('active');
            tabPassword.classList.remove('active');
            passwordSection.style.display = 'none';
            uuidSection.style.display = 'block';
            if (!document.getElementById('uuidOutput').value) generateUuids();
        };

        // 密码参数
        const passLen = document.getElementById('passLen');
        const passLenVal = document.getElementById('passLenVal');
        const passCount = document.getElementById('passCount');
        const passCountVal = document.getElementById('passCountVal');
        passLen.oninput = () => passLenVal.textContent = passLen.value;
        passCount.oninput = () => passCountVal.textContent = passCount.value;

        // 安全随机数
        function getRandomInt(max) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            return arr[0] % max;
        }

        function generatePasswords() {
            const len = parseInt(passLen.value);
            const count = parseInt(passCount.value);
            let chars = '';
            if (document.getElementById('chkUpper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('chkLower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('chkNum').checked) chars += '0123456789';
            if (document.getElementById('chkSpecial').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (document.getElementById('chkExclude').checked) {
                chars = chars.replace(/[l1Io0O]/g, '');
            }

            if (!chars) {
                alert('请至少勾选一种字符类型！');
                return;
            }

            const results = [];
            for (let c = 0; c < count; c++) {
                let pass = '';
                for (let i = 0; i < len; i++) {
                    pass += chars[getRandomInt(chars.length)];
                }
                results.push(pass);
            }

            const container = document.getElementById('passResults');
            container.innerHTML = '';
            results.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'result-item';
                row.innerHTML = `<span>${p}</span><button class="copy-tag-btn" onclick="copyVal('${p}', this)">复制</button>`;
                container.appendChild(row);
            });
        }

        document.getElementById('genPassBtn').onclick = generatePasswords;

        // UUID 逻辑
        const uuidCount = document.getElementById('uuidCount');
        const uuidCountVal = document.getElementById('uuidCountVal');
        uuidCount.oninput = () => uuidCountVal.textContent = uuidCount.value;

        function generateUuids() {
            const count = parseInt(uuidCount.value);
            const isUpper = document.getElementById('uuidUpper').checked;
            const noHyphen = document.getElementById('uuidNoHyphen').checked;
            const list = [];
            for (let i = 0; i < count; i++) {
                let u = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
                if (noHyphen) u = u.replace(/-/g, '');
                if (isUpper) u = u.toUpperCase();
                list.push(u);
            }
            document.getElementById('uuidOutput').value = list.join('\n');
        }

        document.getElementById('genUuidBtn').onclick = generateUuids;
        document.getElementById('copyAllUuidBtn').onclick = () => {
            const val = document.getElementById('uuidOutput').value;
            if (!val) return;
            navigator.clipboard.writeText(val).then(() => showToast('全部 UUID 已复制！'));
        };

        function copyVal(txt, btn) {
            navigator.clipboard.writeText(txt).then(() => {
                btn.textContent = '已复制！';
                setTimeout(() => btn.textContent = '复制', 1500);
            });
        }

        // 初始化
        generatePasswords();
    </script>
</body>
</html>
