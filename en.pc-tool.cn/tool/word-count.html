<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Counter | PC-TOOL</title><link rel="stylesheet" href="common.css"><style>
.container{max-width:850px}.container h1{margin-bottom:8px}.container>p{margin-bottom:20px}.editor{width:100%;height:250px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e4e4e7;font:15px/1.6 Consolas,monospace;resize:vertical;outline:none}.editor:focus{border-color:rgba(129,140,248,.5)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;text-align:left}.item{padding:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px}.item strong{display:block;font-size:23px;color:#e4e4e7}.item span{font-size:12px;color:#a1a1aa}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><canvas id="bg-canvas" class="bg-canvas"></canvas><a class="back-link" href="../index.html">← Back to Home</a><div class="container"><h1>Word Counter</h1><p>Count characters, words, lines, paragraphs, and sections in real time as the text changes.</p><textarea id="input" class="editor" placeholder="Enter or paste text here..."></textarea><div class="stats"><div class="item"><strong id="chars">0</strong><span>Characters (with spaces)</span></div><div class="item"><strong id="noSpace">0</strong><span>Characters (without spaces)</span></div><div class="item"><strong id="cn">0</strong><span>Chinese characters</span></div><div class="item"><strong id="words">0</strong><span>English words</span></div><div class="item"><strong id="nums">0</strong><span>Numbers</span></div><div class="item"><strong id="lines">0</strong><span>Lines</span></div><div class="item"><strong id="paras">0</strong><span>Paragraphs</span></div><div class="item"><strong id="bytes">0</strong><span>UTF-8 bytes</span></div></div></div><script src="common.js"></script><script>
(function(){var input=document.getElementById('input');function count(){var s=input.value,seg,words=0;if(window.Intl&&Intl.Segmenter){seg=new Intl.Segmenter('en',{granularity:'word'});for(var x of seg.segment(s))if(x.isWordLike&&/^[A-Za-z][A-Za-z'’-]*$/.test(x.segment))words++}else words=(s.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length;var set={chars:s.length,noSpace:s.replace(/\s/g,'').length,cn:(s.match(/[\u3400-\u9fff]/g)||[]).length,words:words,nums:(s.match(/[0-9]/g)||[]).length,lines:s? s.split(/\r\n?|\n/).length:0,paras:s.trim()?s.trim().split(/(?:\r\n?|\n)\s*(?:\r\n?|\n)+/).length:0,bytes:new Blob([s]).size};Object.keys(set).forEach(function(k){document.getElementById(k).textContent=set[k]})}input.addEventListener('input',count);count()})();
</script></body></html>
