<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">

    <meta name="description" content="免费在线表格转换工具，支持 CSV 与 Excel (.xlsx, .xls) 格式互转，表格在线预览与导出，纯浏览器本地处理，安全高效。">
    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="CSV与Excel互转 | PC-TOOL">
    <meta property="og:description" content="在线 CSV 转 Excel、Excel 转 CSV，纯浏览器本地解析与转换，安全快捷。">

    <style>
        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(24, 24, 27, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2.2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        h1 span {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-top: -0.6rem;
            border-left: 3px solid #34d399;
            padding-left: 1rem;
        }

        /* 模式切换选项卡 */
        .mode-tabs {
            display: flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mode-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            text-align: center;
            border-radius: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            color: #71717a;
            border: none;
            background: transparent;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mode-tab:hover {
            color: #e4e4e7;
        }

        .mode-tab.active {
            background: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            border: 1px solid rgba(129, 140, 248, 0.4);
            font-weight: 600;
        }

        /* 上传拖拽区域 */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: #e4e4e7;
            margin-bottom: 0.4rem;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: #71717a;
        }

        /* 已选文件卡片 */
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .file-name {
            font-size: 0.925rem;
            font-weight: 500;
            color: #f4f4f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 500px;
        }

        .file-size {
            font-size: 0.75rem;
            color: #71717a;
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* 转换选项条 */
        .options-row {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 0.875rem;
            color: #d4d4d8;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .option-item select {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f4f4f5;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
            outline: none;
        }

        /* 按钮与状态 */
        .convert-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .convert-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-1px);
        }

        .convert-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-box {
            font-size: 0.875rem;
            color: #a1a1aa;
            text-align: center;
            min-height: 22px;
        }

        .status-box.error {
            color: #f87171;
        }

        .status-box.success {
            color: #34d399;
        }

        /* 表格预览区域 */
        .preview-section {
            display: none;
            flex-direction: column;
            gap: 0.8rem;
            animation: fadeIn 0.4s ease;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
            color: #a1a1aa;
        }

        .table-wrap {
            max-height: 320px;
            overflow: auto;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .table-wrap::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-wrap::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        table.preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.825rem;
            color: #e4e4e7;
            text-align: left;
        }

        table.preview-table th,
        table.preview-table td {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        table.preview-table th {
            background: rgba(255, 255, 255, 0.06);
            color: #93c5fd;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        table.preview-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        /* 下载按钮 */
        .download-btn {
            display: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #059669, #047857);
        }

        .footer-note {
            font-size: 0.8rem;
            color: #52525b;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.1rem; }
            h1 { font-size: 1.5rem; }
            .file-name { max-width: 220px; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../home.html" class="back-link">← 返回工具首页</a>

    <div class="card">
        <h1>CSV与Excel互转 <span>离线安全</span></h1>
        <div class="subtitle" id="modeSubtitle">CSV 转 Excel · 纯浏览器端快速处理</div>

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tabCsvToExcel">CSV 转 Excel (.xlsx)</button>
            <button class="mode-tab" id="tabExcelToCsv">Excel (.xlsx/.xls) 转 CSV</button>
        </div>

        <!-- 上传拖拽区 -->
        <div class="upload-area" id="dropArea">
            <div class="upload-text" id="uploadText">点击或拖拽上传 CSV 文件</div>
            <div class="upload-hint" id="uploadHint">支持 .csv 文本文件，纯前端解析不上传服务器</div>
            <input type="file" id="fileInput" accept=".csv">
        </div>

        <!-- 已选文件显示 -->
        <div id="fileInfo" class="file-info" style="display: none;">
            <div class="file-details">
                <span class="file-name" id="fileNameDisplay"></span>
                <span class="file-size" id="fileSizeDisplay"></span>
            </div>
            <button class="remove-btn" id="removeFileBtn" title="移除文件">移除</button>
        </div>

        <!-- 额外转换选项 -->
        <div class="options-row" id="optionsRow">
            <div class="option-item" id="sheetSelectWrap" style="display: none;">
                <label for="sheetSelect">选择工作表 (Sheet)：</label>
                <select id="sheetSelect"></select>
            </div>
            <div class="option-item" id="encodingWrap">
                <label for="csvEncoding">CSV 编码：</label>
                <select id="csvEncoding">
                    <option value="utf-8" selected>UTF-8 (推荐)</option>
                    <option value="gbk">GBK / GB2312 (中文防乱码)</option>
                </select>
            </div>
        </div>

        <button class="convert-btn" id="convertBtn" disabled>开始转换</button>
        <div class="status-box" id="statusMessage">请先选择需要转换的文件</div>

        <!-- 转换数据预览 -->
        <div class="preview-section" id="previewSection">
            <div class="preview-header">
                <span id="previewTitle">表格预览</span>
                <span id="previewCount">共 0 行数据</span>
            </div>
            <div class="table-wrap">
                <table class="preview-table" id="previewTable"></table>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">下载转换文件</button>
        <div class="footer-note">纯浏览器端处理 · 无服务器上传 · 保护数据隐私</div>
    </div>

    <script src="common.js"></script>

    <!-- 
      引入 SheetJS (xlsx.full.min.js)：
      优先使用国内字节跳动/BootCDN镜像源，若不可达自动回退至官方与 cdnjs 镜像站，确保无缝秒级加载
    -->
    <script>
        (function loadSheetJS() {
            var cdnList = [
                "https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
                "https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/xlsx/0.18.5/xlsx.full.min.js",
                "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
                "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
            ];
            var currentIndex = 0;

            function tryNext() {
                if (currentIndex >= cdnList.length) {
                    console.error('所有 SheetJS CDN 镜像源均无法访问，请检查网络');
                    var status = document.getElementById('statusMessage');
                    if (status) {
                        status.className = 'status-box error';
                        status.textContent = '表格解析组件加载失败，请刷新重试';
                    }
                    return;
                }
                var script = document.createElement('script');
                script.src = cdnList[currentIndex];
                script.onload = function() {
                    console.log('SheetJS 成功通过镜像源加载:', cdnList[currentIndex]);
                };
                script.onerror = function() {
                    console.warn('当前镜像不可用，切换下一个:', cdnList[currentIndex]);
                    currentIndex++;
                    tryNext();
                };
                document.head.appendChild(script);
            }

            tryNext();
        })();
    </script>

    <script>
    (function() {
        var tabCsvToExcel = document.getElementById('tabCsvToExcel');
        var tabExcelToCsv = document.getElementById('tabExcelToCsv');
        var modeSubtitle = document.getElementById('modeSubtitle');
        var dropArea = document.getElementById('dropArea');
        var fileInput = document.getElementById('fileInput');
        var fileInfo = document.getElementById('fileInfo');
        var fileNameDisplay = document.getElementById('fileNameDisplay');
        var fileSizeDisplay = document.getElementById('fileSizeDisplay');
        var removeFileBtn = document.getElementById('removeFileBtn');
        var sheetSelectWrap = document.getElementById('sheetSelectWrap');
        var sheetSelect = document.getElementById('sheetSelect');
        var encodingWrap = document.getElementById('encodingWrap');
        var csvEncoding = document.getElementById('csvEncoding');
        var convertBtn = document.getElementById('convertBtn');
        var statusMessage = document.getElementById('statusMessage');
        var previewSection = document.getElementById('previewSection');
        var previewTable = document.getElementById('previewTable');
        var previewCount = document.getElementById('previewCount');
        var downloadBtn = document.getElementById('downloadBtn');
        var uploadText = document.getElementById('uploadText');
        var uploadHint = document.getElementById('uploadHint');

        var currentMode = 'csv2excel'; // 'csv2excel' 或 'excel2csv'
        var selectedFile = null;
        var loadedWorkbook = null;
        var resultBlob = null;
        var resultFileName = '';

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            var k = 1024;
            var sizes = ['B', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function setStatus(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = 'status-box ' + (type || '');
        }

        // 切换模式
        tabCsvToExcel.addEventListener('click', function() {
            if (currentMode === 'csv2excel') return;
            currentMode = 'csv2excel';
            tabCsvToExcel.classList.add('active');
            tabExcelToCsv.classList.remove('active');
            modeSubtitle.textContent = 'CSV 转 Excel · 纯浏览器端快速处理';
            uploadText.textContent = '点击或拖拽上传 CSV 文件';
            uploadHint.textContent = '支持 .csv 文本文件，纯前端解析不上传服务器';
            fileInput.accept = '.csv';
            sheetSelectWrap.style.display = 'none';
            encodingWrap.style.display = 'flex';
            resetState();
        });

        tabExcelToCsv.addEventListener('click', function() {
            if (currentMode === 'excel2csv') return;
            currentMode = 'excel2csv';
            tabExcelToCsv.classList.add('active');
            tabCsvToExcel.classList.remove('active');
            modeSubtitle.textContent = 'Excel 转 CSV · 支持多工作表导出';
            uploadText.textContent = '点击或拖拽上传 Excel 文档 (.xlsx / .xls)';
            uploadHint.textContent = '支持 .xlsx, .xls 格式，纯前端解析不上传服务器';
            fileInput.accept = '.xlsx, .xls';
            sheetSelectWrap.style.display = 'flex';
            encodingWrap.style.display = 'none';
            resetState();
        });

        function resetState() {
            selectedFile = null;
            loadedWorkbook = null;
            resultBlob = null;
            resultFileName = '';
            fileInput.value = '';
            fileInfo.style.display = 'none';
            previewSection.style.display = 'none';
            previewTable.innerHTML = '';
            downloadBtn.style.display = 'none';
            convertBtn.disabled = true;
            sheetSelect.innerHTML = '';
            setStatus('请先选择需要转换的文件');
        }

        removeFileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            resetState();
        });

        // 拖拽处理
        dropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });

        dropArea.addEventListener('dragleave', function() {
            dropArea.classList.remove('dragover');
        });

        dropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files.length > 0) {
                handleFileSelect(fileInput.files[0]);
            }
        });

        function handleFileSelect(file) {
            var ext = file.name.split('.').pop().toLowerCase();
            if (currentMode === 'csv2excel' && ext !== 'csv') {
                setStatus('格式不匹配，请上传 .csv 格式文件', 'error');
                return;
            }
            if (currentMode === 'excel2csv' && ext !== 'xlsx' && ext !== 'xls') {
                setStatus('格式不匹配，请上传 .xlsx 或 .xls 格式文件', 'error');
                return;
            }

            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileSizeDisplay.textContent = formatBytes(file.size);
            fileInfo.style.display = 'flex';
            convertBtn.disabled = false;
            previewSection.style.display = 'none';
            downloadBtn.style.display = 'none';

            if (currentMode === 'excel2csv') {
                loadExcelSheets(file);
            } else {
                setStatus('已选择文件，点击“开始转换”即可生成 Excel', 'success');
            }
        }

        // 读取 Excel 并填充工作表下拉项
        function loadExcelSheets(file) {
            if (typeof XLSX === 'undefined') {
                setStatus('解析库仍在加载中，请稍候...', 'error');
                return;
            }
            setStatus('正在分析 Excel 结构...', '');
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    loadedWorkbook = XLSX.read(data, { type: 'array' });
                    sheetSelect.innerHTML = '';
                    loadedWorkbook.SheetNames.forEach(function(name) {
                        var opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        sheetSelect.appendChild(opt);
                    });
                    setStatus('Excel 结构识别成功，共有 ' + loadedWorkbook.SheetNames.length + ' 个工作表', 'success');
                } catch (err) {
                    console.error(err);
                    setStatus('无法读取该 Excel 文件: ' + err.message, 'error');
                    convertBtn.disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 渲染预览表格 (仅展示前 15 行，避免大文件卡顿)
        function renderTablePreview(rows) {
            previewTable.innerHTML = '';
            if (!rows || rows.length === 0) {
                previewSection.style.display = 'none';
                return;
            }

            previewCount.textContent = '共 ' + rows.length + ' 行数据（仅预览前 15 行）';

            var thead = document.createElement('thead');
            var headTr = document.createElement('tr');
            var firstRow = rows[0] || [];
            firstRow.forEach(function(cell, idx) {
                var th = document.createElement('th');
                th.textContent = cell !== undefined && cell !== null && cell !== '' ? cell : ('列 ' + (idx + 1));
                headTr.appendChild(th);
            });
            thead.appendChild(headTr);
            previewTable.appendChild(thead);

            var tbody = document.createElement('tbody');
            var previewRows = rows.slice(1, 16);
            previewRows.forEach(function(r) {
                var tr = document.createElement('tr');
                for (var i = 0; i < firstRow.length; i++) {
                    var td = document.createElement('td');
                    td.textContent = r[i] !== undefined && r[i] !== null ? r[i] : '';
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
            previewTable.appendChild(tbody);
            previewSection.style.display = 'flex';
        }

        // 点击开始转换
        convertBtn.addEventListener('click', function() {
            if (!selectedFile) return;
            if (typeof XLSX === 'undefined') {
                setStatus('SheetJS 核心库未就绪，请刷新重试', 'error');
                return;
            }

            convertBtn.disabled = true;
            setStatus('正在转换中，请稍候...', '');

            if (currentMode === 'csv2excel') {
                convertCsvToExcel();
            } else {
                convertExcelToCsv();
            }
        });

        // 1. CSV -> Excel (.xlsx)
        function convertCsvToExcel() {
            var encoding = csvEncoding.value || 'utf-8';
            var reader = new FileReader();

            reader.onload = function(e) {
                try {
                    var csvContent = e.target.result;
                    var workbook = XLSX.read(csvContent, { type: 'string', raw: true });
                    var firstSheetName = workbook.SheetNames[0];
                    var worksheet = workbook.Sheets[firstSheetName];

                    // 转换为二维数组用于预览
                    var rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    renderTablePreview(rows);

                    // 生成 Excel 二进制文件
                    var wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                    resultBlob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    resultFileName = selectedFile.name.replace(/\.csv$/i, '') + '.xlsx';

                    setStatus('转换成功！可预览前 15 行并点击下方按钮下载', 'success');
                    downloadBtn.textContent = '下载 ' + resultFileName;
                    downloadBtn.style.display = 'block';
                } catch (err) {
                    console.error(err);
                    setStatus('转换失败：' + err.message, 'error');
                } finally {
                    convertBtn.disabled = false;
                }
            };

            reader.onerror = function() {
                setStatus('读取文件失败，请重试', 'error');
                convertBtn.disabled = false;
            };

            reader.readAsText(selectedFile, encoding);
        }

        // 2. Excel (.xlsx / .xls) -> CSV
        function convertExcelToCsv() {
            try {
                if (!loadedWorkbook) {
                    throw new Error('工作簿尚未加载完成');
                }
                var selectedSheetName = sheetSelect.value || loadedWorkbook.SheetNames[0];
                var worksheet = loadedWorkbook.Sheets[selectedSheetName];
                if (!worksheet) {
                    throw new Error('未找到指定的工作表：' + selectedSheetName);
                }

                // 导出为 CSV 文本并附带 UTF-8 BOM（防止用 Excel 打开中文乱码）
                var csvString = XLSX.utils.sheet_to_csv(worksheet);
                var rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                renderTablePreview(rows);

                var bom = new Uint8Array([0xEF, 0xBB, 0xBF]); // UTF-8 BOM
                resultBlob = new Blob([bom, csvString], { type: 'text/csv;charset=utf-8;' });
                var baseName = selectedFile.name.replace(/\.(xlsx|xls)$/i, '');
                resultFileName = baseName + '_' + selectedSheetName + '.csv';

                setStatus('转换成功！已生成带 UTF-8 BOM 的 CSV 文本（中文打开不乱码）', 'success');
                downloadBtn.textContent = '下载 ' + resultFileName;
                downloadBtn.style.display = 'block';
            } catch (err) {
                console.error(err);
                setStatus('转换失败：' + err.message, 'error');
            } finally {
                convertBtn.disabled = false;
            }
        }

        // 下载触发
        downloadBtn.addEventListener('click', function() {
            if (!resultBlob) return;
            var url = URL.createObjectURL(resultBlob);
            var a = document.createElement('a');
            a.href = url;
            a.download = resultFileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        });

    })();
    </script>
</body>
