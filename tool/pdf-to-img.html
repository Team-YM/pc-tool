<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF转图片 | PC-TOOL</title>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        #pdfInput { display: none; }
        .to-img-card {
            max-width: 800px;
            width: 100%;
        }
        .file-info-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin: 15px 0;
        }
        .file-info-bar .info-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .file-info-bar .file-name {
            color: #e4e4e7;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 480px;
        }
        .file-info-bar .file-meta {
            font-size: 12px;
            color: #71717a;
        }
        .btn-change {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-change:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #f4f4f5;
        }
        .options-group {
            display: none;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .setting-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-col label {
            font-size: 13px;
            color: #d4d4d8;
        }
        .select-input {
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #f4f4f5;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .select-input option {
            background: #18181b;
            color: #f4f4f5;
        }
        .progress-bar-wrap {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #34d399);
            width: 0%;
            transition: width 0.2s ease;
        }
        .img-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
            max-height: 520px;
            overflow-y: auto;
            padding: 10px;
        }
        .img-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .img-thumb-wrap {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }
        .img-thumb-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .img-meta {
            font-size: 12px;
            color: #a1a1aa;
            text-align: center;
            width: 100%;
        }
        .img-btn-dl {
            width: 100%;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .img-btn-dl:hover {
            background: rgba(129, 140, 248, 0.25);
            border-color: rgba(129, 140, 248, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回转换工具首页</a>

    <div class="container to-img-card">
        <h1>PDF转图片</h1>
        <p>将PDF各页面高清导出为PNG、JPG或WebP格式，支持单张下载与一键ZIP打包</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传 PDF 文件</p>
            <input type="file" id="pdfInput" accept=".pdf,application/pdf">
        </div>

        <div class="file-info-bar" id="fileInfoBar">
            <div class="info-left">
                <span class="file-name" id="fileName">-</span>
                <span class="file-meta" id="fileMeta">-</span>
            </div>
            <button class="btn-change" id="changeBtn">更换文件</button>
        </div>

        <div class="options-group" id="optionsGroup">
            <div class="settings-grid">
                <div class="setting-col">
                    <label for="formatSelect">导出图片格式</label>
                    <select id="formatSelect" class="select-input">
                        <option value="png">PNG (高保真无损)</option>
                        <option value="jpeg" selected>JPG (文件较小)</option>
                        <option value="webp">WebP (现代高效)</option>
                    </select>
                </div>
                <div class="setting-col">
                    <label for="dpiSelect">清晰度 / 缩放倍数</label>
                    <select id="dpiSelect" class="select-input">
                        <option value="1.0">标准清晰度 (1.0x)</option>
                        <option value="1.5" selected>推荐高清 (1.5x)</option>
                        <option value="2.0">超高清 (2.0x, 适合精细文档)</option>
                        <option value="3.0">印刷级特清 (3.0x, 速度稍慢)</option>
                    </select>
                </div>
            </div>

            <div style="text-align: center; margin-top: 6px;">
                <button class="convert-btn" id="startBtn" style="margin: 0;">开始转换</button>
            </div>

            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="progressText" style="display:none; text-align:center; font-size:12px; color:#a1a1aa; margin-top:4px;">正在准备...</div>
        </div>

        <div class="result-box" id="resultBox">
            <h3>转换完成</h3>
            <div id="resultSummary" style="color: #a1a1aa; font-size: 14px; margin: 8px 0 14px 0;"></div>
            <button class="download-btn" id="zipDownloadBtn" style="display: inline-block;">打包下载所有图片 (ZIP)</button>
            <div class="img-grid" id="imgGrid"></div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
        }

        const uploadArea = document.getElementById('uploadArea');
        const pdfInput = document.getElementById('pdfInput');
        const fileInfoBar = document.getElementById('fileInfoBar');
        const fileName = document.getElementById('fileName');
        const fileMeta = document.getElementById('fileMeta');
        const changeBtn = document.getElementById('changeBtn');
        const optionsGroup = document.getElementById('optionsGroup');
        const formatSelect = document.getElementById('formatSelect');
        const dpiSelect = document.getElementById('dpiSelect');
        const startBtn = document.getElementById('startBtn');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resultBox = document.getElementById('resultBox');
        const resultSummary = document.getElementById('resultSummary');
        const zipDownloadBtn = document.getElementById('zipDownloadBtn');
        const imgGrid = document.getElementById('imgGrid');

        let originalFile = null;
        let pdfDoc = null;
        let pageCount = 0;
        let convertedImages = [];

        uploadArea.onclick = () => pdfInput.click();
        setupDragDrop(uploadArea, (files) => {
            const pdfs = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            if (pdfs.length > 0) handleFile(pdfs[0]);
            else showToast('请上传有效的PDF文件');
        });

        pdfInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        changeBtn.onclick = () => pdfInput.click();

        async function handleFile(file) {
            originalFile = file;
            fileName.textContent = file.name;
            fileMeta.textContent = '解析文档中...';
            fileInfoBar.style.display = 'flex';
            uploadArea.style.display = 'none';
            resultBox.style.display = 'none';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                pdfDoc = await loadingTask.promise;
                pageCount = pdfDoc.numPages;
                fileMeta.textContent = `${formatSize(file.size)} · 共 ${pageCount} 页`;
                optionsGroup.style.display = 'flex';
            } catch (err) {
                console.error(err);
                showToast('解析PDF失败，文件损坏或受密码保护');
                fileInfoBar.style.display = 'none';
                uploadArea.style.display = 'block';
                optionsGroup.style.display = 'none';
            }
        }

        startBtn.onclick = async () => {
            if (!pdfDoc || pageCount === 0) return;

            startBtn.disabled = true;
            startBtn.textContent = '转换中...';
            resultBox.style.display = 'none';
            progressWrap.style.display = 'block';
            progressText.style.display = 'block';
            progressBar.style.width = '0%';
            imgGrid.innerHTML = '';
            convertedImages = [];

            const format = formatSelect.value;
            const mimeType = format === 'jpeg' ? 'image/jpeg' : (format === 'webp' ? 'image/webp' : 'image/png');
            const ext = format === 'jpeg' ? 'jpg' : format;
            const scale = parseFloat(dpiSelect.value);
            const base = originalFile.name.replace(/\.pdf$/i, '');

            try {
                for (let i = 1; i <= pageCount; i++) {
                    progressText.textContent = `正在转换第 ${i} / ${pageCount} 页...`;
                    progressBar.style.width = `${Math.round((i - 0.5) / pageCount * 100)}%`;

                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;

                    const blob = await new Promise(resolve => {
                        canvas.toBlob(resolve, mimeType, 0.92);
                    });

                    const imgUrl = URL.createObjectURL(blob);
                    const imgName = `${base}_第${i}页.${ext}`;
                    convertedImages.push({
                        pageIndex: i,
                        blob: blob,
                        url: imgUrl,
                        name: imgName,
                        width: Math.round(viewport.width),
                        height: Math.round(viewport.height),
                        size: blob.size
                    });

                    progressBar.style.width = `${Math.round(i / pageCount * 100)}%`;
                }

                resultSummary.textContent = `已成功转换全部 ${convertedImages.length} 个页面为 ${ext.toUpperCase()} 图像`;

                convertedImages.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'img-item';
                    el.innerHTML = `
                        <div class="img-thumb-wrap">
                            <img src="${item.url}" alt="${item.name}">
                        </div>
                        <div class="img-meta">
                            <div>第 ${item.pageIndex} 页 (${item.width}×${item.height})</div>
                            <div style="color:#71717a; font-size:11px;">${formatSize(item.size)}</div>
                        </div>
                        <button class="img-btn-dl" data-idx="${item.pageIndex - 1}">单张下载</button>
                    `;
                    el.querySelector('.img-btn-dl').onclick = () => {
                        downloadFile(item.url, item.name);
                    };
                    imgGrid.appendChild(el);
                });

                resultBox.style.display = 'block';
                showToast('图片转换成功！');
            } catch (err) {
                console.error(err);
                showToast('转换过程发生错误：' + err.message);
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = '开始转换';
                progressWrap.style.display = 'none';
                progressText.style.display = 'none';
            }
        };

        zipDownloadBtn.onclick = async () => {
            if (convertedImages.length === 0) return;
            zipDownloadBtn.disabled = true;
            zipDownloadBtn.textContent = '正在打包 ZIP...';

            try {
                const zip = new JSZip();
                convertedImages.forEach(img => {
                    zip.file(img.name, img.blob);
                });
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(zipBlob);
                const base = originalFile.name.replace(/\.pdf$/i, '');
                downloadFile(zipUrl, `${base}_图片导出.zip`);
            } catch (err) {
                console.error(err);
                showToast('打包失败：' + err.message);
            } finally {
                zipDownloadBtn.disabled = false;
                zipDownloadBtn.textContent = '打包下载所有图片 (ZIP)';
            }
        };
    </script>
</body>
</html>
