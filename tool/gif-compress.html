<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF压缩</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="免费在线GIF压缩工具，支持分辨率缩放、抽帧优化与质量调控，有效减小GIF动图文件体积。">
    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="GIF压缩 | PC-TOOL">
    <meta property="og:description" content="在线GIF动图无损/有损压缩、抽帧与尺寸调整，纯前端安全处理。">
    <meta property="og:image" content="https://www.pc-tool.cn/avatar.jpg">
    <meta property="og:url" content="https://www.pc-tool.cn/tool/gif-compress.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PC-TOOL">
    <meta property="og:locale" content="zh_CN">
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        .container {
            max-width: 800px;
            width: 100%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-item label {
            font-size: 13px;
            color: #a1a1aa;
            display: flex;
            justify-content: space-between;
        }

        .setting-item label span.val {
            color: #818cf8;
            font-weight: 600;
        }

        .setting-item select,
        .setting-item input[type="range"] {
            width: 100%;
            height: 36px;
            border-radius: 6px;
            outline: none;
        }

        .setting-item select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            padding: 0 10px;
            font-size: 14px;
        }

        .setting-item input[type="range"] {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            -webkit-appearance: none;
            cursor: pointer;
            margin-top: 15px;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #818cf8;
            cursor: pointer;
        }

        .info-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
            font-size: 13px;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 14px;
            color: #a1a1aa;
        }

        .info-pill strong {
            color: #e4e4e7;
            margin-left: 6px;
        }

        .compare-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .compare-box { grid-template-columns: 1fr; }
        }

        .preview-pane {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .preview-pane h4 {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        .preview-wrap {
            width: 100%;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#1c1c22 0% 25%, #141418 0% 50%) 50% / 14px 14px;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .progress-bar-wrap {
            display: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin: 18px 0 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #6366f1);
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .progress-text {
            display: none;
            text-align: center;
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 12px;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← 返回转换工具首页</a>

    <div class="container">
        <h1>GIF压缩</h1>
        <p>纯前端解析并二次编码压缩动图，支持尺寸缩放、降采样抽帧和色彩品质调控</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传需要压缩的 GIF 文件</p>
            <input type="file" id="fileInput" accept="image/gif">
        </div>

        <div id="compressWorkspace" style="display:none;">
            <div class="info-card">
                <div class="info-pill">原始尺寸: <strong id="origDimension">-</strong></div>
                <div class="info-pill">原始体积: <strong id="origFileSize">-</strong></div>
                <div class="info-pill">解析帧数: <strong id="origFrameCount">-</strong></div>
                <div class="info-pill">压缩预期: <strong id="ratioExpect">按需调节参数</strong></div>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <label>尺寸缩放 <span class="val" id="scaleVal">80%</span></label>
                    <input type="range" id="scaleRange" min="20" max="100" value="80" step="5">
                </div>
                <div class="setting-item">
                    <label>抽帧优化 (减少帧数)</label>
                    <select id="dropFrameSelect">
                        <option value="1">保留全部帧 (最高流畅度)</option>
                        <option value="2" selected>抽取 1/2 帧 (体积大幅降低)</option>
                        <option value="3">抽取 1/3 帧 (极小体积)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>色彩量化品质 <span class="val" id="qualityVal">12 (中等)</span></label>
                    <input type="range" id="qualityRange" min="5" max="25" value="12" step="1">
                </div>
            </div>

            <div class="action-row">
                <button class="btn" id="startCompressBtn" style="background:rgba(129,140,248,0.3);border-color:rgba(129,140,248,0.4);">开始压缩 GIF</button>
                <button class="download-btn" id="downloadBtn">下载压缩后的 GIF</button>
            </div>

            <div class="progress-bar-wrap" id="progWrap">
                <div class="progress-bar-fill" id="progFill"></div>
            </div>
            <div class="progress-text" id="progText">正在处理...</div>

            <div class="compare-box">
                <div class="preview-pane">
                    <h4>压缩前原图</h4>
                    <div class="preview-wrap">
                        <img id="origPreview" alt="原GIF">
                    </div>
                </div>
                <div class="preview-pane">
                    <h4 id="resultTitle">压缩后效果 (等待处理)</h4>
                    <div class="preview-wrap">
                        <img id="compressedPreview" style="display:none;" alt="压缩后GIF">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        var uploadArea = document.getElementById('uploadArea');
        var fileInput = document.getElementById('fileInput');
        var compressWorkspace = document.getElementById('compressWorkspace');
        var origDimension = document.getElementById('origDimension');
        var origFileSize = document.getElementById('origFileSize');
        var origFrameCount = document.getElementById('origFrameCount');
        var scaleRange = document.getElementById('scaleRange');
        var scaleVal = document.getElementById('scaleVal');
        var dropFrameSelect = document.getElementById('dropFrameSelect');
        var qualityRange = document.getElementById('qualityRange');
        var qualityVal = document.getElementById('qualityVal');
        var startCompressBtn = document.getElementById('startCompressBtn');
        var downloadBtn = document.getElementById('downloadBtn');
        var progWrap = document.getElementById('progWrap');
        var progFill = document.getElementById('progFill');
        var progText = document.getElementById('progText');
        var origPreview = document.getElementById('origPreview');
        var compressedPreview = document.getElementById('compressedPreview');
        var resultTitle = document.getElementById('resultTitle');

        var gifBuffer = null;
        var gifReader = null;
        var extractedFrames = [];
        var compressedBlob = null;
        var rawFile = null;

        uploadArea.addEventListener('click', function() { fileInput.click(); });
        uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleGifFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length) handleGifFile(e.target.files[0]);
        });

        scaleRange.addEventListener('input', function() {
            scaleVal.innerText = scaleRange.value + '%';
        });

        qualityRange.addEventListener('input', function() {
            var q = qualityRange.value;
            qualityVal.innerText = q + (q <= 8 ? ' (高画质)' : q <= 15 ? ' (均衡)' : ' (极速压缩)');
        });

        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            var k = 1024;
            var sizes = ['B', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        function handleGifFile(file) {
            if (!file) return;
            rawFile = file;
            origFileSize.innerText = formatSize(file.size);
            var reader = new FileReader();
            reader.onload = function(e) {
                var arr = new Uint8Array(e.target.result);
                gifBuffer = arr;
                try {
                    gifReader = new GifReader(arr);
                    var numFrames = gifReader.numFrames();
                    var w = gifReader.width;
                    var h = gifReader.height;

                    origDimension.innerText = w + ' × ' + h;
                    origFrameCount.innerText = numFrames + ' 帧';
                    origPreview.src = URL.createObjectURL(file);

                    compressWorkspace.style.display = 'block';
                    compressedPreview.style.display = 'none';
                    downloadBtn.style.display = 'none';
                    resultTitle.innerText = '压缩后效果 (等待处理)';

                    parseAllFrames();
                } catch (err) {
                    alert('GIF 解析失败，请确认文件是否损坏');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseAllFrames() {
            extractedFrames = [];
            var w = gifReader.width;
            var h = gifReader.height;
            var num = gifReader.numFrames();

            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            var fullImageData = ctx.createImageData(w, h);

            for (var i = 0; i < num; i++) {
                var info = gifReader.frameInfo(i);
                gifReader.decodeAndBlitFrameRGBA(i, fullImageData.data);
                ctx.putImageData(fullImageData, 0, 0);

                var frameCanvas = document.createElement('canvas');
                frameCanvas.width = w;
                frameCanvas.height = h;
                var frameCtx = frameCanvas.getContext('2d');
                frameCtx.drawImage(canvas, 0, 0);

                extractedFrames.push({
                    canvas: frameCanvas,
                    delay: (info.delay || 10) * 10
                });
            }
        }

        startCompressBtn.addEventListener('click', async function() {
            if (!extractedFrames.length) return;
            startCompressBtn.disabled = true;
            progWrap.style.display = 'block';
            progText.style.display = 'block';
            progFill.style.width = '10%';
            progText.innerText = '正在初始化编码器...';

            var scale = parseInt(scaleRange.value, 10) / 100;
            var dropStep = parseInt(dropFrameSelect.value, 10);
            var quality = parseInt(qualityRange.value, 10);

            var origW = gifReader.width;
            var origH = gifReader.height;
            var targetW = Math.round(origW * scale);
            var targetH = Math.round(origH * scale);

            var workerBlobUrl;
            try {
                var resp = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
                var text = await resp.text();
                var blob = new Blob([text], { type: 'application/javascript' });
                workerBlobUrl = URL.createObjectURL(blob);
            } catch (err) {
                alert('Worker 脚本获取失败，请确保网络通畅');
                startCompressBtn.disabled = false;
                return;
            }

            var gif = new GIF({
                workers: 2,
                quality: quality,
                width: targetW,
                height: targetH,
                workerScript: workerBlobUrl,
                repeat: 0
            });

            var selected = [];
            for (var i = 0; i < extractedFrames.length; i += dropStep) {
                selected.push(extractedFrames[i]);
            }

            for (var j = 0; j < selected.length; j++) {
                var f = selected[j];
                var scaledCanvas = document.createElement('canvas');
                scaledCanvas.width = targetW;
                scaledCanvas.height = targetH;
                var sCtx = scaledCanvas.getContext('2d');
                sCtx.drawImage(f.canvas, 0, 0, targetW, targetH);

                var totalDelay = f.delay * dropStep;
                gif.addFrame(scaledCanvas, { delay: totalDelay, copy: true });

                var p = 10 + Math.round((j + 1) / selected.length * 75);
                progFill.style.width = p + '%';
                progText.innerText = '正在压缩重采样帧: ' + (j + 1) + ' / ' + selected.length;
            }

            progText.innerText = '正在执行调色板色彩优化与拼装...';
            progFill.style.width = '90%';

            gif.on('finished', function(blob) {
                compressedBlob = blob;
                var url = URL.createObjectURL(blob);
                compressedPreview.src = url;
                compressedPreview.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                startCompressBtn.disabled = false;

                progFill.style.width = '100%';
                progText.innerText = '压缩成功！体积缩小约 ' + Math.max(0, Math.round((1 - blob.size / rawFile.size) * 100)) + '%';

                resultTitle.innerText = '压缩后: ' + formatSize(blob.size) + ' (' + targetW + '×' + targetH + ')';
            });

            gif.render();
        });

        downloadBtn.addEventListener('click', function() {
            if (!compressedBlob) return;
            var a = document.createElement('a');
            a.download = 'compressed_' + (rawFile ? rawFile.name : 'image.gif');
            a.href = URL.createObjectURL(compressedBlob);
            a.click();
        });
    </script>
</body>
</html>
