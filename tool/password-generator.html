<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 | PC-TOOL</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="安全高强度的随机密码生成器，支持大写字母、小写字母、数字和特殊字符自由组合，支持密码强度与熵值实时评估，纯本地安全生成。">
    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="随机密码生成器 | PC-TOOL">
    <meta property="og:description" content="纯浏览器本地运行的高强度随机密码生成器，完全离线无泄露风险。">
    <meta property="og:image" content="https://www.pc-tool.cn/avatar.jpg">
    <meta property="og:url" content="https://www.pc-tool.cn/tool/password-generator.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PC-TOOL">
    <meta property="og:locale" content="zh_CN">
    <style>
        .container {
            max-width: 680px;
        }

        /* 密码展示区 */
        .password-display-box {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .password-display-box:hover {
            border-color: rgba(129, 140, 248, 0.4);
        }

        .password-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 20px;
            color: #f4f4f5;
            word-break: break-all;
            user-select: all;
            letter-spacing: 1px;
            min-height: 30px;
            display: flex;
            align-items: center;
        }

        .display-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #e4e4e7;
            padding: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* 强度进度条 */
        .strength-container {
            margin-bottom: 22px;
        }

        .strength-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 6px;
        }

        .strength-meter {
            height: 6px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 配置控制面板 */
        .setting-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .setting-row label {
            color: #d4d4d8;
            font-size: 14px;
            user-select: none;
            cursor: pointer;
        }

        .length-slider-box {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            max-width: 380px;
        }

        .length-slider-box input[type="range"] {
            flex: 1;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .length-display {
            font-size: 16px;
            font-weight: 600;
            color: #818cf8;
            width: 32px;
            text-align: right;
            font-family: monospace;
        }

        /* 选项网格 */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 520px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .checkbox-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .checkbox-card input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .checkbox-title {
            font-size: 14px;
            color: #e4e4e7;
            font-weight: 500;
        }

        .checkbox-sample {
            font-size: 12px;
            color: #71717a;
            margin-left: auto;
            font-family: monospace;
        }

        /* 批量生成区 */
        .batch-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #a1a1aa;
        }

        .batch-list {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 13px;
            color: #a1a1aa;
            max-height: 140px;
            overflow-y: auto;
            white-space: pre-line;
            line-height: 1.8;
            user-select: all;
        }

        /* 操作按钮 */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../home.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>随机密码生成器</h1>
        <p>纯本地随机算法生成高强度密码，可灵活自定义字符集与长度，无数据上传更安全。</p>

        <!-- 主密码展示框 -->
        <div class="password-display-box">
            <span class="password-text" id="passwordOutput">正在生成...</span>
            <div class="display-actions">
                <button class="icon-btn" id="regenerateBtn" title="重新生成">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                </button>
                <button class="icon-btn" id="copyBtn" title="复制密码">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
            </div>
        </div>

        <!-- 密码强度条 -->
        <div class="strength-container">
            <div class="strength-info">
                <span>密码安全强度：<strong id="strengthLabel" style="color: #34d399;">高强度</strong></span>
                <span id="entropyLabel">熵值: 0 bits</span>
            </div>
            <div class="strength-meter">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
        </div>

        <!-- 参数控制面板 -->
        <div class="setting-section">
            <div class="setting-row">
                <label for="lengthSlider">密码长度</label>
                <div class="length-slider-box">
                    <input type="range" id="lengthSlider" min="4" max="64" value="16">
                    <span class="length-display" id="lengthVal">16</span>
                </div>
            </div>

            <div class="options-grid">
                <label class="checkbox-card">
                    <input type="checkbox" id="incUpper" checked>
                    <span class="checkbox-title">大写字母</span>
                    <span class="checkbox-sample">A-Z</span>
                </label>
                <label class="checkbox-card">
                    <input type="checkbox" id="incLower" checked>
                    <span class="checkbox-title">小写字母</span>
                    <span class="checkbox-sample">a-z</span>
                </label>
                <label class="checkbox-card">
                    <input type="checkbox" id="incDigits" checked>
                    <span class="checkbox-title">阿拉伯数字</span>
                    <span class="checkbox-sample">0-9</span>
                </label>
                <label class="checkbox-card">
                    <input type="checkbox" id="incSymbols" checked>
                    <span class="checkbox-title">特殊符号</span>
                    <span class="checkbox-sample">!@#$%^&*</span>
                </label>
            </div>

            <div class="setting-row" style="margin-top: 4px;">
                <label class="checkbox-card" style="width: 100%;">
                    <input type="checkbox" id="excAmbiguous">
                    <span class="checkbox-title">排除易混淆字符 (避免 1, l, I, 0, O, o 识别错误)</span>
                </label>
            </div>
        </div>

        <button class="btn-main" id="generateMainBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-1-1l2 2M11 13l9-9a2.828 2.828 0 1 0-4-4L7 9m-3 7l-2 2a1 1 0 0 0 0 1.414l2.586 2.586a1 1 0 0 0 1.414 0L8 18m-4-2l4 4"/></svg>
            一键生成并复制
        </button>

        <!-- 批量导出区域 -->
        <div class="batch-section" style="margin-top: 20px;">
            <div class="batch-header">
                <span>批量生成参考 (一次生成 5 组)</span>
                <button class="quick-btn" id="copyBatchBtn" style="color:#818cf8; background:none; border:none; cursor:pointer; font-size:12px;">复制全部</button>
            </div>
            <div class="batch-list" id="batchList"></div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ交流群：<strong>1121812272</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        (function() {
            const passwordOutput = document.getElementById('passwordOutput');
            const lengthSlider = document.getElementById('lengthSlider');
            const lengthVal = document.getElementById('lengthVal');
            const incUpper = document.getElementById('incUpper');
            const incLower = document.getElementById('incLower');
            const incDigits = document.getElementById('incDigits');
            const incSymbols = document.getElementById('incSymbols');
            const excAmbiguous = document.getElementById('excAmbiguous');
            const regenerateBtn = document.getElementById('regenerateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const generateMainBtn = document.getElementById('generateMainBtn');
            const strengthLabel = document.getElementById('strengthLabel');
            const strengthFill = document.getElementById('strengthFill');
            const entropyLabel = document.getElementById('entropyLabel');
            const batchList = document.getElementById('batchList');
            const copyBatchBtn = document.getElementById('copyBatchBtn');

            const CHAR_SETS = {
                upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lower: 'abcdefghijklmnopqrstuvwxyz',
                digits: '0123456789',
                symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
            };

            const AMBIGUOUS = /[il1Lo0O]/g;

            // 使用高精度加密随机数
            function getSecureRandomInt(max) {
                const arr = new Uint32Array(1);
                window.crypto.getRandomValues(arr);
                return arr[0] % max;
            }

            function generateSinglePassword() {
                let pool = '';
                let guaranteed = [];

                let upperStr = CHAR_SETS.upper;
                let lowerStr = CHAR_SETS.lower;
                let digitStr = CHAR_SETS.digits;
                let symbolStr = CHAR_SETS.symbols;

                if (excAmbiguous.checked) {
                    upperStr = upperStr.replace(AMBIGUOUS, '');
                    lowerStr = lowerStr.replace(AMBIGUOUS, '');
                    digitStr = digitStr.replace(AMBIGUOUS, '');
                    symbolStr = symbolStr.replace(/[|`'"]/g, '');
                }

                if (incUpper.checked) {
                    pool += upperStr;
                    if (upperStr.length) guaranteed.push(upperStr[getSecureRandomInt(upperStr.length)]);
                }
                if (incLower.checked) {
                    pool += lowerStr;
                    if (lowerStr.length) guaranteed.push(lowerStr[getSecureRandomInt(lowerStr.length)]);
                }
                if (incDigits.checked) {
                    pool += digitStr;
                    if (digitStr.length) guaranteed.push(digitStr[getSecureRandomInt(digitStr.length)]);
                }
                if (incSymbols.checked) {
                    pool += symbolStr;
                    if (symbolStr.length) guaranteed.push(symbolStr[getSecureRandomInt(symbolStr.length)]);
                }

                if (!pool) {
                    return '';
                }

                const length = parseInt(lengthSlider.value, 10);
                const result = [...guaranteed];

                while (result.length < length) {
                    result.push(pool[getSecureRandomInt(pool.length)]);
                }

                // 洗牌算法保证随机分布
                for (let i = result.length - 1; i > 0; i--) {
                    const j = getSecureRandomInt(i + 1);
                    const tmp = result[i];
                    result[i] = result[j];
                    result[j] = tmp;
                }

                return result.slice(0, length).join('');
            }

            // 计算信息熵与强度
            function calculateStrength(pwd) {
                if (!pwd) return { label: '无', percent: 0, color: '#71717a', bits: 0 };
                let poolSize = 0;
                if (/[a-z]/.test(pwd)) poolSize += 26;
                if (/[A-Z]/.test(pwd)) poolSize += 26;
                if (/[0-9]/.test(pwd)) poolSize += 10;
                if (/[^a-zA-Z0-9]/.test(pwd)) poolSize += 32;

                const entropy = Math.round(pwd.length * Math.log2(Math.max(poolSize, 2)));
                let label = '极弱';
                let percent = 15;
                let color = '#ef4444';

                if (entropy >= 75) {
                    label = '极高强度 (绝难破解)';
                    percent = 100;
                    color = '#10b981';
                } else if (entropy >= 60) {
                    label = '高强度 (推荐)';
                    percent = 80;
                    color = '#34d399';
                } else if (entropy >= 45) {
                    label = '中等强度';
                    percent = 55;
                    color = '#f59e0b';
                } else if (entropy >= 30) {
                    label = '偏弱';
                    percent = 35;
                    color = '#fb923c';
                }

                return { label, percent, color, bits: entropy };
            }

            function updateAll() {
                lengthVal.textContent = lengthSlider.value;
                const pwd = generateSinglePassword();

                if (!pwd) {
                    passwordOutput.textContent = '请至少勾选一种字符类别';
                    strengthLabel.textContent = '无法生成';
                    strengthFill.style.width = '0%';
                    entropyLabel.textContent = '熵值: 0 bits';
                    batchList.textContent = '';
                    return;
                }

                passwordOutput.textContent = pwd;
                const st = calculateStrength(pwd);
                strengthLabel.textContent = st.label;
                strengthLabel.style.color = st.color;
                strengthFill.style.width = st.percent + '%';
                strengthFill.style.backgroundColor = st.color;
                entropyLabel.textContent = `熵值: ${st.bits} bits`;

                // 批量生成5组
                const batch = [];
                for (let i = 0; i < 5; i++) {
                    batch.push(generateSinglePassword());
                }
                batchList.textContent = batch.join('\n');
            }

            async function copyToClipboard(text, msg) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(msg || '复制成功！');
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast(msg || '复制成功！');
                }
            }

            lengthSlider.addEventListener('input', updateAll);
            [incUpper, incLower, incDigits, incSymbols, excAmbiguous].forEach(el => {
                el.addEventListener('change', () => {
                    // 防止全不选
                    if (!incUpper.checked && !incLower.checked && !incDigits.checked && !incSymbols.checked) {
                        showToast('至少需要保留一种字符类型');
                    }
                    updateAll();
                });
            });

            regenerateBtn.addEventListener('click', updateAll);
            copyBtn.addEventListener('click', () => {
                const pwd = passwordOutput.textContent;
                if (pwd && pwd !== '请至少勾选一种字符类别') copyToClipboard(pwd, '已复制密码到剪贴板！');
            });

            generateMainBtn.addEventListener('click', () => {
                updateAll();
                const pwd = passwordOutput.textContent;
                if (pwd && pwd !== '请至少勾选一种字符类别') copyToClipboard(pwd, '新密码已生成并成功复制！');
            });

            copyBatchBtn.addEventListener('click', () => {
                const txt = batchList.textContent.trim();
                if (txt) copyToClipboard(txt, '已复制全部 5 组密码！');
            });

            updateAll();
        })();
    </script>
</body>
</html>
