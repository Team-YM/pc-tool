        #audioInput { display: none; }

        }
        .options-box select {
            background: rgba(255, 255, 255, 0.06);

            outline: none;
        }
        audio {
            width: 100%;
            margin: 10px 0;
            display: none;
        }
    </style>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>

    <a href="../index.html" class="back-link">← 返回工具首页</a>

    <div class="container">
        <h1>音频倒放</h1>
        <p>将音频进行倒放处理</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传音频文件</p>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div id="audioInfo" style="text-align:center; margin:10px 0; display:none;">
            <p id="fileName" style="color:#e4e4e7;"></p>
            <p id="durationInfo" style="color:#71717a; font-size:13px;"></p>
        </div>

        <div class="options-box" id="optionsBox" style="display:none;">
            <label>导出格式:
                <select id="outputFormat">
                    <option value="wav" selected>WAV 格式 (无损/推荐)</option>
                    <option value="mp3">MP3 格式 (体积小)</option>
                </select>
            </label>
        </div>

        <audio id="previewAudio" controls></audio>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">准备开始...</div>

        <div style="text-align:center;">
            <button class="convert-btn" id="reverseBtn">开始倒放</button>
            <button class="download-btn" id="downloadBtn">下载倒放音频</button>
        </div>

        <div class="result-box" id="resultBox">
            <h3>倒放完成</h3>
            <div class="size-info" id="sizeInfo"></div>
        </div>

        <div class="contact-tip">面向大众，有任何想要的功能或者意见，请联系QQ：<strong>1003294905</strong></div>
    </div>

    <script src="common.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const audioInput = document.getElementById('audioInput');
        const reverseBtn = document.getElementById('reverseBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const sizeInfo = document.getElementById('sizeInfo');
        const audioInfo = document.getElementById('audioInfo');
        const fileName = document.getElementById('fileName');
        const durationInfo = document.getElementById('durationInfo');
        const previewAudio = document.getElementById('previewAudio');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const optionsBox = document.getElementById('optionsBox');
        const outputFormat = document.getElementById('outputFormat');

        let audioFile = null;
        let reversedUrl = null;

        uploadArea.onclick = () => audioInput.click();
        setupDragDrop(uploadArea, (files) => {
            const f = files[0];
            if (f && (f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name))) {
                handleAudio(f);
            } else {
                showToast('请上传音频文件');
            }
        });

        audioInput.onchange = (e) => {
            if (e.target.files[0]) handleAudio(e.target.files[0]);
        };

        function handleAudio(f) {
            audioFile = f;
            fileName.textContent = '文件名：' + f.name + ' (' + formatSize(f.size) + ')';
            
            if (previewAudio.src) URL.revokeObjectURL(previewAudio.src);
            if (reversedUrl) {
                URL.revokeObjectURL(reversedUrl);
                reversedUrl = null;
            }

            const url = URL.createObjectURL(f);
            previewAudio.src = url;
            previewAudio.style.display = 'block';
            previewAudio.onloadedmetadata = () => {
                const d = previewAudio.duration;
                const mins = Math.floor(d / 60);
                const secs = Math.floor(d % 60);
                durationInfo.textContent = '音频时长：' + mins + '分' + secs + '秒 (总' + d.toFixed(1) + 's)';
                optionsBox.style.display = 'flex';
            };
            audioInfo.style.display = 'block';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';
        }

        reverseBtn.onclick = async () => {
            if (!audioFile) { showToast('请先上传音频'); return; }

            reverseBtn.disabled = true;
            reverseBtn.textContent = '处理中...';
            progressBar.style.display = 'block';
            statusText.style.display = 'block';
            progressFill.style.width = '0%';
            resultBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                statusText.textContent = '正在读取并解析音频...';
                progressFill.style.width = '20%';

                const arrayBuffer = await audioFile.arrayBuffer();
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const decodedBuffer = await actx.decodeAudioData(arrayBuffer);

                statusText.textContent = '正在进行数据倒放...';
                progressFill.style.width = '50%';

                // 创建等长倒放 buffer
                const reversedBuffer = actx.createBuffer(
                    decodedBuffer.numberOfChannels,
                    decodedBuffer.length,
                    decodedBuffer.sampleRate
                );

                for (let ch = 0; ch < decodedBuffer.numberOfChannels; ch++) {
                    const srcData = decodedBuffer.getChannelData(ch);
                    const destData = reversedBuffer.getChannelData(ch);
                    for (let i = 0, j = srcData.length - 1; i < srcData.length; i++, j--) {
                        destData[i] = srcData[j];
                    }
                }
                actx.close();

                statusText.textContent = '正在编码导出...';
                progressFill.style.width = '75%';

                let blob;
                const fmt = outputFormat.value;
                if (fmt === 'wav') {
                    blob = audioBufferToWavBlob(reversedBuffer);
                } else {
                    blob = encodeMP3(reversedBuffer);
                }

                progressFill.style.width = '100%';
                statusText.textContent = '倒放完成！';

                if (reversedUrl) URL.revokeObjectURL(reversedUrl);
                reversedUrl = URL.createObjectURL(blob);

                previewAudio.src = reversedUrl;
                sizeInfo.innerHTML = '原始音频：' + formatSize(audioFile.size) + '<br>倒放音频：<span class="highlight">' + formatSize(blob.size) + '</span><br>时长：<span class="highlight">' + reversedBuffer.duration.toFixed(1) + 's</span>';
                resultBox.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                showToast('倒放处理成功！');

            } catch (err) {
                console.error(err);
                statusText.textContent = '倒放失败：' + (err.message || '未知错误');
                showToast('处理失败：' + err.message);
            } finally {
                reverseBtn.disabled = false;
                reverseBtn.textContent = '开始倒放';
            }
        };

        function audioBufferToWavBlob(buffer) {
            const numChannels = buffer.numberOfChannels;
            const length = buffer.length;
            const sampleRate = buffer.sampleRate;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * bitsPerSample / 8;
            const blockAlign = numChannels * bitsPerSample / 8;
            const dataSize = length * numChannels * bitsPerSample / 8;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;
            const arrayBuffer = new ArrayBuffer(totalSize);
            const view = new DataView(arrayBuffer);

            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            }

            writeString(0, 'RIFF');
            view.setUint32(4, totalSize - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function encodeMP3(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length;

            const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
            const mp3Data = [];
            const blockSize = 1152;

            const left = new Int16Array(length);
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, buffer.getChannelData(0)[i]));
                left[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }

            if (numChannels === 1) {
                for (let i = 0; i < length; i += blockSize) {
                    const chunk = left.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            } else {
                const right = new Int16Array(length);
                for (let i = 0; i < length; i++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(1)[i]));
                    right[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                }
                for (let i = 0; i < length; i += blockSize) {
                    const chunkL = left.subarray(i, i + blockSize);
                    const chunkR = right.subarray(i, i + blockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunkL, chunkR);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
            }

            const finalBuf = mp3encoder.flush();
            if (finalBuf.length > 0) mp3Data.push(finalBuf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        downloadBtn.onclick = () => {
            if (!reversedUrl) return;
            const a = document.createElement('a');
            a.href = reversedUrl;
            const ext = outputFormat.value;
            a.download = (audioFile?.name || 'audio').replace(/\.\w+$/, '') + '-倒放.' + ext;
            a.click();
        };
    </script>
</body>
</html>
