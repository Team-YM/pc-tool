<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Cleaner and Sorter</title><link rel="stylesheet" href="common.css"><style>
.container{max-width:900px}.container h1{margin-bottom:8px}.container>p{margin-bottom:18px}.editor{width:100%;height:220px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e4e4e7;font:14px/1.6 Consolas,monospace;resize:vertical;outline:none}.options{display:flex;flex-wrap:wrap;gap:14px;text-align:left;margin:16px 0;color:#d4d4d8;font-size:14px}.options label{display:flex;align-items:center;gap:5px}.number{width:80px;padding:5px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.actions .btn{margin:0}.label{display:flex;justify-content:space-between;color:#a1a1aa;font-size:13px;margin:8px 0}.stat{color:#a1a1aa;font-size:13px;margin-top:8px}
</style></head><body><canvas id="bg-canvas" class="bg-canvas"></canvas><a class="back-link" href="../index.html">← Back to Home</a><div class="container"><h1>Text Cleaner and Sorter</h1><p>Combine duplicate removal, sorting, blank-line removal, and line numbering. All processing happens entirely in your browser.</p><div class="label"><span>Input lines</span><span id="inStat">0 lines</span></div><textarea id="input" class="editor" placeholder="One item per line..."></textarea><div class="options"><label><input type="checkbox" id="dedupe"> Remove duplicates</label><label><input type="checkbox" id="ignore"> Ignore case when deduplicating</label><label><input type="checkbox" id="empty"> Remove blank lines</label><label><input type="checkbox" id="sort"> Sort</label><select id="sortType" class="number"><option value="natural">Natural</option><option value="dict">Dictionary</option></select><select id="order" class="number"><option value="asc">Ascending</option><option value="desc">Descending</option></select><label><input type="checkbox" id="number"> Add line numbers</label><label>Start <input id="start" class="number" type="number" value="1"></label><label>Separator <input id="sep" class="number" style="width:55px" value=". "></label></div><div class="actions"><button class="btn" id="run">Process text</button><button class="btn" id="sample">Sample</button><button class="btn" id="clear">Clear</button><button class="btn" id="copy">Copy Result</button><button class="btn" id="download">Download result</button></div><div class="label"><span>Processed result</span></div><textarea id="output" class="editor" readonly></textarea><div class="stat" id="stat">Waiting for processing</div></div><script src="common.js"></script><script>
(function(){var $=function(id){return document.getElementById(id)},input=$('input'),output=$('output');function natural(a,b){return a.localeCompare(b,'zh-CN',{numeric:true,sensitivity:'base'})}function run(){var lines=input.value.replace(/\r\n?/g,'\n').split('\n');var before=lines.length;if($('empty').checked)lines=lines.filter(function(x){return x.trim()});if($('dedupe').checked){var seen=Object.create(null);lines=lines.filter(function(x){var k=$('ignore').checked?x.toLocaleLowerCase():x;if(seen[k])return false;seen[k]=true;return true})}if($('sort').checked){lines.sort($('sortType').value==='natural'?natural:function(a,b){return a.localeCompare(b,'zh-CN')});if($('order').value==='desc')lines.reverse()}if($('number').checked){var n=Number($('start').value)||1,sep=$('sep').value;lines=lines.map(function(x,i){return n+i+sep+x})}output.value=lines.join('\n');$('stat').textContent='Original: '+before+' lines · Result: '+lines.length+' lines · '+output.value.length+' characters'}input.addEventListener('input',function(){$('inStat').textContent=(input.value?input.value.split(/\r\n?|\n/).length:0)+' lines'});$('run').onclick=run;$('sample').onclick=function(){input.value='Banana\napple\n\nbanana\nitem 10\nitem 2';input.dispatchEvent(new Event('input'));run()};$('clear').onclick=function(){input.value='';output.value='';$('stat').textContent='Waiting for processing';input.dispatchEvent(new Event('input'))};$('copy').onclick=function(){navigator.clipboard.writeText(output.value).then(function(){showToast('Result copied')})};$('download').onclick=function(){var blob=new Blob([output.value],{type:'text/plain;charset=utf-8'});downloadFile(URL.createObjectURL(blob),'cleaned-text.txt')};input.dispatchEvent(new Event('input'))})();
</script></body></html>
