<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宫格切图</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="description" content="免费在线九宫格切图工具，支持微信朋友圈、小红书、微博3x3、3x2、3x1等多种宫格分割，可单张下载或一键打包ZIP。">
    <link rel="stylesheet" href="common.css">
    <meta property="og:title" content="九宫格切图 | PC-TOOL">
    <meta property="og:description" content="在线朋友圈九宫格切图神器，快速分割为9张高清图片，支持批量与单张导出。">
    <meta property="og:image" content="https://www.pc-tool.cn/avatar.jpg">
    <meta property="og:url" content="https://www.pc-tool.cn/tool/image-grid-split.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PC-TOOL">
    <meta property="og:locale" content="zh_CN">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        .container {
            max-width: 820px;
            width: 100%;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 18px 0;
        }

        .grid-types {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .type-btn {
            padding: 7px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .type-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .type-btn.active {
            background: rgba(129, 140, 248, 0.25);
            border-color: rgba(129, 140, 248, 0.6);
            color: #c4b5fd;
        }

        .shape-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a1a1aa;
        }

        .shape-toggle select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            padding: 5px 8px;
            border-radius: 6px;
            outline: none;
        }

        .grid-preview-wrap {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .grid-board {
            display: grid;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 8px;
            max-width: 480px;
            width: 100%;
        }

        .grid-cell {
            position: relative;
            aspect-ratio: 1;
            background: #18181b;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .grid-cell:hover {
            transform: scale(1.03);
            z-index: 2;
        }

        .grid-cell canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .grid-cell-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.65);
            color: #e4e4e7;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: monospace;
            pointer-events: none;
        }

        .grid-cell-down {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(129, 140, 248, 0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .grid-cell:hover .grid-cell-down {
            opacity: 1;
        }

        .actions-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <a href="../index.html" class="back-link">← 返回转换工具首页</a>

    <div class="container">
        <h1>九宫格切图</h1>
        <p>朋友圈、微博、小红书专属切图工具，将图片快速等分为 3×3 九宫格，支持单张保存或一键 ZIP 打包</p>

        <div class="upload-area" id="uploadArea">
            <p>点击或拖拽上传需要切图的图片</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="splitWorkspace" style="display:none;">
            <div class="controls-row">
                <div class="grid-types" id="gridTypes">
                    <button class="type-btn active" data-rows="3" data-cols="3">3×3 九宫格</button>
                    <button class="type-btn" data-rows="2" data-cols="3">2×3 六宫格</button>
                    <button class="type-btn" data-rows="1" data-cols="3">1×3 三联图</button>
                    <button class="type-btn" data-rows="2" data-cols="2">2×2 四宫格</button>
                </div>
                <div class="shape-toggle">
                    <span>裁剪模式:</span>
                    <select id="cropModeSelect">
                        <option value="square">正方形等比居中裁切</option>
                        <option value="original">保持原图高宽比切分</option>
                    </select>
                </div>
            </div>

            <div class="grid-preview-wrap">
                <div class="grid-board" id="gridBoard"></div>
            </div>

            <div class="actions-bar">
                <button class="btn" id="btnDownloadAllZip" style="background:rgba(129,140,248,0.3);border-color:rgba(129,140,248,0.5);">打包下载全部切片 (ZIP)</button>
            </div>
            <p style="text-align:center;font-size:12px;color:#71717a;margin-top:10px;">提示：可点击任意单张宫格单独下载该切片</p>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        var uploadArea = document.getElementById('uploadArea');
        var fileInput = document.getElementById('fileInput');
        var splitWorkspace = document.getElementById('splitWorkspace');
        var gridTypes = document.getElementById('gridTypes');
        var cropModeSelect = document.getElementById('cropModeSelect');
        var gridBoard = document.getElementById('gridBoard');
        var btnDownloadAllZip = document.getElementById('btnDownloadAllZip');

        var currentImg = null;
        var curRows = 3;
        var curCols = 3;
        var cellCanvases = [];

        uploadArea.addEventListener('click', function() { fileInput.click(); });
        uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    currentImg = img;
                    splitWorkspace.style.display = 'block';
                    generateGrid();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        gridTypes.addEventListener('click', function(e) {
            if (e.target.classList.contains('type-btn')) {
                gridTypes.querySelectorAll('.type-btn').forEach(function(b) { b.classList.remove('active'); });
                e.target.classList.add('active');
                curRows = parseInt(e.target.getAttribute('data-rows'), 10);
                curCols = parseInt(e.target.getAttribute('data-cols'), 10);
                generateGrid();
            }
        });

        cropModeSelect.addEventListener('change', generateGrid);

        function generateGrid() {
            if (!currentImg) return;
            gridBoard.innerHTML = '';
            gridBoard.style.gridTemplateColumns = 'repeat(' + curCols + ', 1fr)';
            cellCanvases = [];

            var imgW = currentImg.width;
            var imgH = currentImg.height;

            var cropX = 0, cropY = 0, cropW = imgW, cropH = imgH;
            var mode = cropModeSelect.value;

            if (mode === 'square') {
                var targetRatio = curCols / curRows;
                var currentRatio = imgW / imgH;
                if (currentRatio > targetRatio) {
                    cropW = imgH * targetRatio;
                    cropX = (imgW - cropW) / 2;
                } else {
                    cropH = imgW / targetRatio;
                    cropY = (imgH - cropH) / 2;
                }
            }

            var cellW = cropW / curCols;
            var cellH = cropH / curRows;

            var idx = 1;
            for (var r = 0; r < curRows; r++) {
                for (var c = 0; c < curCols; c++) {
                    var cell = document.createElement('div');
                    cell.className = 'grid-cell';

                    var cvs = document.createElement('canvas');
                    cvs.width = cellW;
                    cvs.height = cellH;
                    var ctx = cvs.getContext('2d');

                    var sx = cropX + c * cellW;
                    var sy = cropY + r * cellH;
                    ctx.drawImage(currentImg, sx, sy, cellW, cellH, 0, 0, cellW, cellH);

                    var badge = document.createElement('div');
                    badge.className = 'grid-cell-badge';
                    badge.innerText = idx;

                    var downHint = document.createElement('div');
                    downHint.className = 'grid-cell-down';
                    downHint.innerText = '下载';

                    cell.appendChild(cvs);
                    cell.appendChild(badge);
                    cell.appendChild(downHint);

                    (function(canvasRef, indexNum) {
                        cell.addEventListener('click', function() {
                            var a = document.createElement('a');
                            a.download = 'grid_' + indexNum + '.png';
                            a.href = canvasRef.toDataURL('image/png');
                            a.click();
                        });
                    })(cvs, idx);

                    cellCanvases.push({ canvas: cvs, index: idx });
                    gridBoard.appendChild(cell);
                    idx++;
                }
            }
        }

        btnDownloadAllZip.addEventListener('click', function() {
            if (!cellCanvases.length) return;
            btnDownloadAllZip.disabled = true;
            btnDownloadAllZip.innerText = '正在生成压缩包...';

            var zip = new JSZip();
            var promises = cellCanvases.map(function(item) {
                return new Promise(function(resolve) {
                    item.canvas.toBlob(function(blob) {
                        zip.file('grid_' + item.index + '.png', blob);
                        resolve();
                    }, 'image/png');
                });
            });

            Promise.all(promises).then(function() {
                zip.generateAsync({ type: 'blob' }).then(function(content) {
                    var a = document.createElement('a');
                    a.download = 'grid_images.zip';
                    a.href = URL.createObjectURL(content);
                    a.click();
                    btnDownloadAllZip.disabled = false;
                    btnDownloadAllZip.innerText = '打包下载全部切片 (ZIP)';
                });
            });
        });
    </script>
</body>
</html>
